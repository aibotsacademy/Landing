const CITY_ALIAS = { 'vina': 'Viña del Mar', 'valpo': 'Valparaíso', 'stgo': 'Santiago', 'conce': 'Concepción', 'pto montt': 'Puerto Montt' };
function findCity(n) {
  const names = S.cityStats.map(c => c.name).sort((a, b) => b.length - a.length);
  for (const c of names) if (n.includes(norm(c))) return c;
  for (const [k, v] of Object.entries(CITY_ALIAS)) if (new RegExp('\\b' + k + '\\b').test(n) && names.includes(v)) return v;
  return null;
}
function findType(n) {
  if (/cross|venta cruzada|cruzad/.test(n)) return 'CROSS-SELL';
  if (/upsell|up-sell|upgrade/.test(n)) return 'UPSELL';
  if (/equip|device|dispositivo|aparat|maquina/.test(n)) return 'EQUIPMENT';
  if (/dormant|inactiv|dormid|reactiv/.test(n)) return 'DORMANT ACCOUNT';
  if (/risk|riesgo|declin|caida|churn|drop|perdiendo/.test(n)) return 'CUSTOMER RISK';
  if (/reorder|re-order|recompra|reposic|overdue|atrasad|vencid/.test(n)) return 'REORDER';
  return null;
}
function findProducts(n) {
  const exact = S.data.products.filter(p => n.includes(norm(p.name)));
  if (exact.length) return exact.map(p => String(p.id));
  const brands = [...new Set(S.data.products.map(p => norm(p.name).split(' ')[0]).filter(b => b.length >= 5))];
  const hit = brands.filter(b => n.includes(b));
  return hit.length ? S.data.products.filter(p => hit.includes(norm(p.name).split(' ')[0])).map(p => String(p.id)) : [];
}
function findCustomer(n) {
  let best = null;
  for (const s of S.cs.values()) { const cn = norm(s.c.name); if (n.includes(cn) && (!best || cn.length > norm(best.c.name).length)) best = s; }
  return best;
}
function findRep(n) { const reps = [...new Set(S.data.customers.map(c => c.rep).filter(Boolean))]; return reps.find(r => n.includes(norm(r)) || n.includes(norm(r).split(' ')[0] + ' ')) || null; }

function copilotAnswer(q) {
  const n = norm(q), es = isSpanish(q), T = (a, b) => es ? a : b;
  const TL = t => TYPES[t].label.toLowerCase();
  const src = cnt => `<div class="srcl">${T('Fuente', 'Source')}: ${S.mode === 'live' ? 'Odoo · ' + esc(S.odoo?.db || '') : T('datos comerciales Eurolab', 'Eurolab commercial data')} · ${cnt} · ${fmtDate(S.data.today)}</div>`;
  const oppTbl = list => `<div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>Score</th><th>${T('Cliente', 'Customer')}</th><th>${T('Tipo', 'Type')}</th><th>${T('Producto', 'Product')}</th><th class="num">${T('Potencial', 'Potential')}</th></tr></thead><tbody>${list.map(o => `<tr><td data-l="Score"><b style="color:#fff">${o.score}</b></td><td data-l="${T('Cliente', 'Customer')}">${custBtn(o.customerId, o.customer)}<div class="sub">${esc(o.city)}</div></td><td data-l="${T('Tipo', 'Type')}">${chip(o.type)}</td><td data-l="${T('Producto', 'Product')}">${esc(o.product || '—')}</td><td data-l="${T('Potencial', 'Potential')}" class="num money">${money(o.potential)}</td></tr>`).join('')}</tbody></table></div>`;
  const filterBtn = f => `<button class="btn sm" data-action="filter-go" ${f.city ? `data-city="${esc(f.city)}"` : ''} ${f.type ? `data-type="${esc(f.type)}"` : ''}>${T('Abrir en AI Opportunities', 'Open in AI Opportunities')}</button>`;
  if (!n) return `<p>${T('Pregúntame por clientes, productos, ciudades u oportunidades.', 'Ask me about customers, products, cities or opportunities.')}</p>`;

  if (/^(hola|hi|hello|buenas|buenos dias|buen dia|hey)\b/.test(n) && n.length < 25) {
    return `<p>${T(`Hola. Tengo ${S.opps.length} oportunidades activas por ${money(S.kpi.potential, true)} y sigo auditando cuentas en tiempo real. Puedo decirte a quién contactar hoy, qué recompras están atrasadas, qué clínicas están listas para equipos o qué ciudad tiene más potencial.`, `Hi. I'm tracking ${S.opps.length} open opportunities worth ${money(S.kpi.potential, true)} and auditing accounts in real time. Ask me who to contact today, overdue reorders, equipment candidates or the city with most potential.`)}</p>`;
  }

  // Patterns
  if (/patron|pattern|tendencia|trend|insight|hallazgo/.test(n) && !findCity(n)) {
    if (!S.patterns.length) return `<p>${T('Aún no hay patrones con suficiente evidencia.', 'No pattern has enough evidence yet.')}</p>`;
    return `<p>${T(`Detecté ${S.patterns.length} patrones cruzando todas las cuentas:`, `I found ${S.patterns.length} cross-account patterns (described in Spanish below):`)}</p><ol>${S.patterns.map(p => `<li><b>${esc(p.title)}</b> <span class="muted">(${esc(p.kpi)} · ${AGENT_NAME[p.agent]})</span><br>${esc(p.detail)}</li>`).join('')}</ol>` + src(S.data.orders.length + T(' pedidos', ' orders'));
  }

  // Cadence slowdown
  if (/desaceler|espaci|slowing|slow down|slowdown|frecuencia/.test(n)) {
    const p = S.patterns.find(x => x.id === 'cadence');
    if (!p) return `<p>${T('Ninguna cuenta muestra una desaceleración clara de su frecuencia de compra.', 'No account shows a clear slowdown in purchase frequency.')}</p>`;
    const list = p.members.map(id => S.cs.get(id)).sort((a, b) => b.rev12 - a.rev12).slice(0, 10);
    return `<p>${esc(p.detail)}</p><div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>${T('Cliente', 'Customer')}</th><th class="num">${T('Ciclo histórico', 'Usual cycle')}</th><th class="num">${T('Última compra', 'Last purchase')}</th><th class="num">Revenue 12M</th></tr></thead><tbody>${list.map(s => `<tr><td data-l="${T('Cliente', 'Customer')}">${custBtn(s.c.id, s.c.name)}<div class="sub">${esc(s.c.city)}</div></td><td data-l="${T('Ciclo', 'Cycle')}" class="num">${s.cycle} d</td><td data-l="${T('Última', 'Last')}" class="num">${s.daysSince} d</td><td data-l="Revenue" class="num">${money(s.rev12)}</td></tr>`).join('')}</tbody></table></div>` + src(p.members.length + T(' cuentas', ' accounts'));
  }

  const city = findCity(n), type = findType(n), prods = findProducts(n), cust = findCustomer(n), rep = findRep(n);
  const overdue = /overdue|atrasad|vencid|late|tarde/.test(n);

  // City ranking
  if (!city && /which city|what city|que ciudad|cual ciudad|cities|ciudades|by city|por ciudad|territor|zona|region/.test(n)) {
    const val = type ? (c => sum(S.opps.filter(o => o.city === c.name && o.type === type), o => o.potential)) : /revenue|venta|factur/.test(n) && !/potential|potencial/.test(n) ? (c => c.rev12) : (c => c.potential);
    const ranked = S.cityStats.map(c => ({ c, v: val(c) })).sort((a, b) => b.v - a.v).filter(x => x.v > 0);
    if (!ranked.length) return `<p>${T('Ninguna ciudad tiene valor para esa métrica.', 'No city has a value for that measure.')}</p>`;
    const lead = ranked[0];
    return `<p>${T(`<b>${esc(lead.c.name)}</b> lidera con <b class="money">${money(lead.v)}</b>${type ? ' en ' + TL(type) : ''}, con ${lead.c.opps} oportunidades en ${lead.c.customers} clientes.`, `<b>${esc(lead.c.name)}</b> leads with <b class="money">${money(lead.v)}</b>${type ? ' in ' + TL(type) + ' potential' : ''}, from ${lead.c.opps} opportunities across ${lead.c.customers} customers.`)}${ranked[1] ? T(` Le sigue ${esc(ranked[1].c.name)} con ${money(ranked[1].v, true)}.`, ` ${esc(ranked[1].c.name)} follows with ${money(ranked[1].v, true)}.`) : ''}</p>
      <div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>${T('Ciudad', 'City')}</th><th class="num">${T('Valor', 'Value')}</th><th class="num">Opps</th><th class="num">${T('Clientes', 'Customers')}</th></tr></thead><tbody>${ranked.slice(0, 10).map(x => `<tr><td data-l="${T('Ciudad', 'City')}"><button class="linkish" data-action="set-city" data-city="${esc(x.c.name)}">${esc(x.c.name)}</button></td><td data-l="${T('Valor', 'Value')}" class="num money">${money(x.v)}</td><td data-l="Opps" class="num">${x.c.opps}</td><td data-l="${T('Clientes', 'Customers')}" class="num">${x.c.customers}</td></tr>`).join('')}</tbody></table></div>` + src(S.cityStats.length + T(' ciudades', ' cities'));
  }

  // Penetration
  if (/penetrat|penetrac|coverage|cobertura|baja penetr/.test(n)) {
    if (city) {
      const g = S.cityStats.find(c => c.name === city);
      const rows = g.prodPen.filter(x => x.nat >= 0.15).sort((a, b) => (a.city - a.nat) - (b.city - b.nat)).slice(0, 8);
      const top = rows[0];
      return `<p>${T(`En <b>${esc(city)}</b> (${g.active} clientes activos) estas son las mayores brechas frente al promedio nacional:`, `In <b>${esc(city)}</b> (${g.active} active customers), the biggest penetration gaps vs the national average:`)}</p>
        <div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>${T('Producto', 'Product')}</th><th class="num">${esc(city)}</th><th class="num">${T('Nacional', 'National')}</th><th class="num">${T('Brecha', 'Gap')}</th></tr></thead><tbody>${rows.map(x => `<tr><td data-l="${T('Producto', 'Product')}">${esc(x.p.name)}</td><td data-l="${esc(city)}" class="num">${pct(x.city)}</td><td data-l="${T('Nacional', 'National')}" class="num">${pct(x.nat)}</td><td data-l="${T('Brecha', 'Gap')}" class="num ${x.city < x.nat ? 'risk-h' : 'risk-l'}">${x.city >= x.nat ? '+' : '−'}${Math.abs(Math.round((x.city - x.nat) * 100))} pts</td></tr>`).join('')}</tbody></table></div>
        <p>${top && top.city < top.nat ? T(`Empezaría por <b>${esc(top.p.name)}</b>: ${top.of - top.n} clínicas activas en ${esc(city)} todavía no lo compran.`, `Start with <b>${esc(top.p.name)}</b>: ${top.of - top.n} active clinics in ${esc(city)} don't buy it yet.`) : T(`${esc(city)} está en o sobre el promedio nacional en todos los productos.`, `${esc(city)} is at or above the national average on every product.`)}</p>` + src(g.active + T(' clientes activos', ' active customers'));
    }
    const rows = S.prodStats.filter(x => !x.p.equipment).sort((a, b) => a.penetration - b.penetration).slice(0, 8);
    return `<p>${T('Productos con menor penetración nacional:', 'Lowest-penetration products nationally:')}</p><div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>${T('Producto', 'Product')}</th><th class="num">${T('Penetración', 'Penetration')}</th><th class="num">${T('Clientes', 'Customers')}</th></tr></thead><tbody>${rows.map(x => `<tr><td data-l="${T('Producto', 'Product')}">${esc(x.p.name)}</td><td data-l="${T('Penetración', 'Penetration')}" class="num">${pct(x.penetration)}</td><td data-l="${T('Clientes', 'Customers')}" class="num">${x.customers}</td></tr>`).join('')}</tbody></table></div>` + src(S.prodStats.length + T(' productos', ' products'));
  }

  // Contact today
  if (!type && !cust && /contact|call|llamar|contactar|contacto|today|hoy|priorit|visit|visitar|prioridad/.test(n)) {
    const best = new Map();
    for (const o of S.opps) {
      if (city && o.city !== city) continue;
      if (rep && o.rep !== rep) continue;
      const pr = o.score + (o.type === 'REORDER' && o.meta && o.meta.ratio >= 1.3 ? 8 : 0) + (o.type === 'CUSTOMER RISK' ? 4 : 0);
      const cur = best.get(o.customerId);
      if (!cur || pr > cur.pr) best.set(o.customerId, { o, pr });
    }
    const list = [...best.values()].sort((a, b) => b.pr - a.pr).slice(0, 8);
    if (!list.length) return `<p>${T('No hay clientes con señales abiertas en ese filtro.', 'No customers with open signals for that filter.')}</p>`;
    const tot = sum(list, x => S.cs.get(x.o.customerId).potential);
    return `<p>${T(`Estas son las <b>${list.length} cuentas</b> que contactaría hoy${city ? ' en ' + esc(city) : ''}${rep ? ' de ' + esc(rep) : ''}. Juntas suman <b class="money">${money(tot, true)}</b> en potencial. Prioricé por AI score y subí las recompras atrasadas y las cuentas que están cayendo.`, `These are the <b>${list.length} accounts</b> I'd contact today${city ? ' in ' + esc(city) : ''}. Together they hold <b class="money">${money(tot, true)}</b> in potential. Ranked by AI score, boosted for overdue reorders and declining accounts.`)}</p>
      <ol>${list.map(({ o }) => `<li>${custBtn(o.customerId, o.customer)} <span class="muted">· ${esc(o.city)} · ${esc(o.rep)}</span><br>${chip(o.type)} ${esc(o.product)} <span class="muted">— ${esc(o.action)}</span></li>`).join('')}</ol><div class="row-flex">${filterBtn({ city })}</div>` + src(S.opps.length + T(' oportunidades', ' opportunities'));
  }

  // Customer lookup
  if (cust) {
    const s = cust;
    return `<p>${agentNarrative(s)}</p><p>${T('Siguiente mejor producto', 'Next best product')}: <b>${esc(s.nbp || '—')}</b>. ${T('Siguiente mejor acción', 'Next best action')}: ${esc(s.nba)}</p>${s.opps.length ? oppTbl(s.opps.slice(0, 6)) : ''}<div class="row-flex">${custBtn(s.c.id, 'Customer 360', 'btn sm')}</div>` + src(s.nOrders + T(' pedidos', ' orders'));
  }

  // Filtered opportunities
  if (type || city || prods.length || rep) {
    let list = S.opps.filter(o => (!type || o.type === type) && (!city || o.city === city) && (!rep || o.rep === rep) && (!prods.length || prods.includes(o.productId)));
    if (type === 'REORDER' && overdue) list = list.filter(o => o.meta && o.meta.ratio >= 1.2).sort((a, b) => b.meta.overdue - a.meta.overdue);
    if (type === 'CUSTOMER RISK' && !/dormant|dormid|inactiv/.test(n)) list = list.concat(S.opps.filter(o => o.type === 'DORMANT ACCOUNT' && (!city || o.city === city) && (!rep || o.rep === rep))).sort((a, b) => b.score - a.score);
    const where = `${city ? T(' en ', ' in ') + esc(city) : ''}${rep ? T(' de ', ' for ') + esc(rep) : ''}`;
    if (!list.length) return `<p>${T(`No encontré ${type ? TL(type) : 'oportunidades'}${where}.`, `I found no ${type ? TL(type) : 'opportunities'}${where}.`)}</p>` + src(S.opps.length + T(' oportunidades', ' opportunities'));
    const pot = sum(list, o => o.potential);
    let intro;
    if (type === 'REORDER' && overdue) intro = T(`<b>${list.length} recompras atrasadas</b>${where} (más de 1,2× el ciclo habitual de la clínica), por <b class="money">${money(pot)}</b>. La más atrasada es ${esc(list[0].customer)}: ${esc(list[0].product)}, ${list[0].meta.overdue} días sobre su ciclo.`, `<b>${list.length} overdue reorders</b>${where} (past 1.2× the clinic's usual cycle), worth <b class="money">${money(pot)}</b>. Most overdue: ${esc(list[0].customer)}, ${esc(list[0].product)}, ${list[0].meta.overdue} days past cycle.`);
    else if (type === 'EQUIPMENT') intro = T(`<b>${list.length} ${plural(list.length, 'clínica')}</b>${where} compran suficientes inyectables para justificar un equipo: <b class="money">${money(pot)}</b> a precio lista. La mejor candidata es ${esc(list[0].customer)} (${money(list[0].meta.injRev, true)} al año).`, `<b>${list.length} ${plural(list.length, 'clinic')}</b>${where} buy enough injectables to justify equipment: <b class="money">${money(pot)}</b> at list price. Top candidate: ${esc(list[0].customer)} (${money(list[0].meta.injRev, true)} a year).`);
    else if (type === 'CUSTOMER RISK') intro = T(`<b>${list.length} cuentas en riesgo o dormidas</b>${where}, con <b class="money">${money(pot)}</b> de revenue expuesto.`, `<b>${list.length} accounts at risk or dormant</b>${where}, with <b class="money">${money(pot)}</b> of revenue exposed.`);
    else intro = T(`<b>${list.length} ${type ? TL(type) : 'oportunidades'}</b>${where}${prods.length ? ' para ' + esc([...new Set(prods.map(id => S.data.products.find(p => String(p.id) === id).name.split(' ')[0]))].join(', ')) : ''}, por <b class="money">${money(pot)}</b> en revenue potencial.`, `<b>${list.length} ${type ? TL(type) : 'opportunities'}</b>${where}, worth <b class="money">${money(pot)}</b> in potential revenue.`);
    let extra = '';
    if (!type) { const byType = TYPE_KEYS.map(t => [t, list.filter(o => o.type === t).length]).filter(x => x[1]); extra = `<p>${byType.map(([t, c]) => `${c} ${TL(t)}`).join(', ')}.</p>`; }
    if (city && !type) { const g = S.cityStats.find(c => c.name === city); extra += `<p>${T(`${esc(city)}: ${g.customers} clientes, ${money(g.rev12, true)} de revenue 12M, ${g.atRisk} ${plural(g.atRisk, 'cuenta')} en riesgo.`, `${esc(city)}: ${g.customers} customers, ${money(g.rev12, true)} revenue 12M, ${g.atRisk} at risk.`)}</p>`; }
    return `<p>${intro}</p>${extra}${oppTbl(list.slice(0, 8))}${list.length > 8 ? `<p class="muted">${T('Top 8 por AI score.', 'Top 8 by AI score.')}</p>` : ''}<div class="row-flex">${filterBtn({ city, type })}</div>` + src(list.length + T(' oportunidades', ' opportunities'));
  }

  if (/product|producto|best seller|mas vendid|top/.test(n)) {
    const rows = S.prodStats.slice(0, 8);
    return `<p>${T('Productos con más revenue en 12 meses:', 'Top products by 12-month revenue:')}</p><div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>${T('Producto', 'Product')}</th><th class="num">Revenue 12M</th><th class="num">${T('Clientes', 'Customers')}</th><th class="num">${T('Potencial', 'Potential')}</th></tr></thead><tbody>${rows.map(x => `<tr><td data-l="${T('Producto', 'Product')}">${esc(x.p.name)}</td><td data-l="Revenue" class="num">${money(x.rev12)}</td><td data-l="${T('Clientes', 'Customers')}" class="num">${x.customers}</td><td data-l="${T('Potencial', 'Potential')}" class="num money">${money(x.potential, true)}</td></tr>`).join('')}</tbody></table></div>` + src(S.prodStats.length + T(' productos', ' products'));
  }

  if (/revenue|summary|resumen|kpi|overview|venta|how are we|como vamos|como va|total|potential|potencial/.test(n)) {
    const k = S.kpi;
    return `<p>${T(`Revenue 12M: <b>${money(k.rev12)}</b> (${k.growth >= 0 ? '+' : '−'}${pct(Math.abs(k.growth))} último semestre vs anterior). Hay <b>${k.opps}</b> oportunidades por <b class="money">${money(k.potential)}</b>: ${TYPE_KEYS.map(t => `${k[t].n} ${TL(t)}`).join(', ')}.`, `Revenue 12M: <b>${money(k.rev12)}</b> (${k.growth >= 0 ? '+' : '−'}${pct(Math.abs(k.growth))} last 6 months vs prior). There are <b>${k.opps}</b> opportunities worth <b class="money">${money(k.potential)}</b>: ${TYPE_KEYS.map(t => `${k[t].n} ${TL(t)}`).join(', ')}.`)}</p>` + src(S.data.lines.length + T(' líneas de venta', ' order lines'));
  }

  return `<p>${T('Respondo solo con los datos comerciales cargados y no pude relacionar la pregunta con clientes, productos, ciudades o tipos de oportunidad.', 'I answer only from the loaded commercial data and could not match that to customers, products, cities or opportunity types.')}</p><p>${T('Prueba nombrando una ciudad', 'Try naming a city')} (${S.cityStats.slice(0, 3).map(c => esc(c.name)).join(', ')}), ${T('un producto', 'a product')} (${esc(S.prodStats[0]?.p.name || '')}), ${T('una clínica o un tipo: recompra, cross-sell, equipos, riesgo.', 'a clinic, or a type: reorder, cross-sell, equipment, risk.')}</p>`;
}

/* =========================================================
   OdooClient — JSON-RPC over fetch
   ========================================================= */
class OdooError extends Error { constructor(kind, message) { super(message); this.kind = kind; } }
class OdooClient {
  constructor({ url, db, username, key, proxy }) {
    this.url = String(url || '').trim().replace(/\/+$/, '').replace(/\/(web|odoo)(\/.*)?$/, '');
    this.db = db; this.username = username; this.key = key; this.proxy = (proxy || '').trim(); this.uid = null;
  }
  endpoint() { const t = this.url + '/jsonrpc'; if (!this.proxy) return t; return this.proxy.endsWith('=') ? this.proxy + encodeURIComponent(t) : this.proxy + t; }
  async rpc(service, method, args) {
    const body = { jsonrpc: '2.0', method: 'call', params: { service, method, args }, id: Date.now() };
    let res;
    try { res = await fetch(this.endpoint(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
    catch (e) { throw new OdooError('network', `The browser could not reach ${this.proxy ? 'the proxy' : this.url}. The usual cause is CORS: Odoo does not accept requests from a web page on another origin. Allow this origin on the Odoo server, or enter a proxy URL, then try again.`); }
    if (!res.ok) throw new OdooError('http', `Odoo answered HTTP ${res.status}${res.status === 404 ? ': /jsonrpc was not found. Check the Odoo URL.' : '.'}`);
    let j;
    try { j = await res.json(); } catch (e) { throw new OdooError('parse', 'The response was not JSON. Check that the URL points to the Odoo server itself.'); }
    if (j.error) throw new OdooError('odoo', (j.error.data && j.error.data.message) || j.error.message || 'Odoo returned an error.');
    return j.result;
  }
  async authenticate() {
    const uid = await this.rpc('common', 'authenticate', [this.db, this.username, this.key, {}]);
    if (!uid) throw new OdooError('auth', 'Odoo rejected the credentials. Check the database name, username and API key.');
    this.uid = uid; return uid;
  }
  execute(model, method, args = [], kwargs = {}) { return this.rpc('object', 'execute_kw', [this.db, this.uid, this.key, model, method, args, kwargs]); }
  searchRead(model, domain, fields, opts = {}) { return this.execute(model, 'search_read', [domain], Object.assign({ fields }, opts)); }
  create(model, vals) { return this.execute(model, 'create', [vals]); }
}

const EQUIP_RE = /equip|device|dispositiv|aparat|maquin|m[aá]quina|laser|l[aá]ser|system|sistema|plataforma/i;
async function loadFromOdoo(client, log) {
  const today = startOfDay(Date.now());
  const since = new Date(today - 548 * DAY).toISOString().slice(0, 19).replace('T', ' ');
  const parseDate = s => { if (!s) return today; const t = Date.parse(String(s).replace(' ', 'T') + 'Z'); return isNaN(t) ? today : t; };
  log('Reading sale.order (confirmed, last 18 months)…');
  const orders = await client.searchRead('sale.order', [['state', 'in', ['sale', 'done']], ['date_order', '>=', since]], ['id', 'name', 'partner_id', 'date_order', 'amount_total', 'user_id'], { limit: 10000, order: 'date_order asc' });
  log(`  ${orders.length} sale.order`, 'o');
  const orderIds = orders.map(o => o.id);
  let lines = [];
  if (orderIds.length) {
    log('Reading sale.order.line…');
    for (let i = 0; i < orderIds.length; i += 2000) {
      const chunk = await client.searchRead('sale.order.line', [['order_id', 'in', orderIds.slice(i, i + 2000)]], ['order_id', 'product_id', 'product_uom_qty', 'price_subtotal', 'display_type'], { limit: 100000 });
      lines = lines.concat(chunk.filter(l => !l.display_type && l.product_id));
    }
    log(`  ${lines.length} sale.order.line`, 'o');
  }
  const partnerIds = [...new Set(orders.map(o => o.partner_id && o.partner_id[0]).filter(Boolean))];
  log('Reading res.partner…');
  const partners = partnerIds.length ? await client.searchRead('res.partner', [['id', 'in', partnerIds]], ['id', 'name', 'city', 'email', 'phone', 'user_id', 'country_id'], { limit: 20000 }) : [];
  log(`  ${partners.length} res.partner`, 'o');
  const productIds = [...new Set(lines.map(l => l.product_id[0]))];
  log('Reading product.product…');
  const prods = productIds.length ? await client.searchRead('product.product', [['id', 'in', productIds]], ['id', 'name', 'default_code', 'list_price', 'categ_id'], { limit: 20000 }) : [];
  log(`  ${prods.length} product.product`, 'o');
  let leads = [], activities = [];
  try { log('Reading crm.lead…'); leads = await client.searchRead('crm.lead', [['type', '=', 'opportunity']], ['id', 'name', 'partner_id', 'stage_id'], { limit: 500 }); log(`  ${leads.length} crm.lead`, 'o'); }
  catch (e) { log('  crm.lead unavailable: ' + e.message, 'e'); }
  try { log('Reading mail.activity…'); activities = await client.searchRead('mail.activity', [], ['id', 'res_model', 'res_id', 'summary', 'date_deadline'], { limit: 500 }); log(`  ${activities.length} mail.activity`, 'o'); }
  catch (e) { log('  mail.activity unavailable: ' + e.message, 'e'); }

  const orderMap = new Map(orders.map(o => [o.id, o]));
  const repByPartner = {};
  for (const o of orders) if (o.user_id && o.partner_id) repByPartner[o.partner_id[0]] = { name: o.user_id[1], id: o.user_id[0] };
  const customers = partners.map(p => ({
    id: String(p.id), odooId: p.id, name: p.name, city: normalizeCity(p.city), email: p.email || '', phone: p.phone || '',
    rep: (p.user_id && p.user_id[1]) || (repByPartner[p.id] && repByPartner[p.id].name) || 'Unassigned',
    repUserId: (p.user_id && p.user_id[0]) || (repByPartner[p.id] && repByPartner[p.id].id) || null
  }));
  const products = prods.map(p => {
    const cat = p.categ_id ? String(p.categ_id[1]).split('/').pop().trim() : 'Uncategorized';
    const equipment = EQUIP_RE.test(cat) || p.list_price >= 5000;
    return { id: String(p.id), odooId: p.id, sku: p.default_code || '', name: p.name, category: equipment ? 'Equipment' : cat, price: p.list_price || 0, equipment };
  });
  const outLines = lines.map(l => { const o = orderMap.get(l.order_id[0]); return { orderId: l.order_id[0], customerId: String(o.partner_id[0]), productId: String(l.product_id[0]), qty: l.product_uom_qty || 0, subtotal: l.price_subtotal || 0, date: parseDate(o.date_order) }; });
  const outOrders = orders.map(o => ({ id: o.id, name: o.name, customerId: String(o.partner_id[0]), date: parseDate(o.date_order), rep: o.user_id ? o.user_id[1] : '', total: o.amount_total }));
  return { source: 'odoo', today, customers, products, orders: outOrders, lines: outLines, leads: leads.map(l => ({ id: l.id, name: l.name, partnerId: l.partner_id ? l.partner_id[0] : null, stage: l.stage_id ? l.stage_id[1] : '' })), activities, loadedAt: Date.now() };
}

/* Live sync with Odoo every 10 minutes */
let syncTimer = null;
function startSync() {
  clearInterval(syncTimer);
  syncTimer = setInterval(async () => {
    if (S.mode !== 'live' || !S.odoo) return;
    try {
      const before = S.data.orders.length;
      const data = await loadFromOdoo(S.odoo, () => {});
      S.data = data; analyze();
      const diff = data.orders.length - before;
      audit('odoo', 'Sync', `${data.orders.length} orders (${diff >= 0 ? '+' : ''}${diff})`, 'ok');
      if (diff > 0) Agent.say(`<p>Sincronicé con Odoo: <b>${diff} ${plural(diff, 'pedido nuevo', 'pedidos nuevos')}</b>. Recalculé las oportunidades: ahora hay ${S.opps.length} por ${money(S.kpi.potential, true)}.</p>`, { notify: true, bubble: `${diff} pedidos nuevos desde Odoo` });
      if (['dashboard', 'agents'].includes(S.route)) rerenderKeepScroll();
    } catch (e) { audit('odoo', 'Sync failed', e.message, 'error'); }
  }, 10 * 60 * 1000);
}

async function connectOdoo() {
  const url = $('#oUrl').value.trim(), db = $('#oDb').value.trim(), username = $('#oUser').value.trim(), key = $('#oKey').value, proxy = $('#oProxy').value.trim();
  const logEl = $('#connLog'), btn = $('#connBtn');
  let text = '';
  const log = (m, cls) => { text += (text ? '\n' : '') + m; S.connLog = text; if (logEl && document.body.contains(logEl)) { logEl.insertAdjacentHTML('beforeend', (logEl.dataset.started ? '\n' : '') + `<span class="${cls || ''}">${esc(m)}</span>`); logEl.dataset.started = '1'; logEl.scrollTop = logEl.scrollHeight; } };
  if (logEl) { logEl.innerHTML = ''; delete logEl.dataset.started; }
  if (!/^https?:\/\//i.test(url)) { log('La URL de Odoo debe empezar con https:// o http://', 'e'); return; }
  if ($('#oRemember').checked) { S.conn = { url, db, username, proxy }; store.set('conn', S.conn); } else { store.del('conn'); S.conn = { url: '', db: '', username: '', proxy: '' }; }
  btn.disabled = true; btn.textContent = 'Conectando…';
  const client = new OdooClient({ url, db, username, key, proxy });
  audit('odoo', 'Connection attempt', `${client.url} · db ${db} · user ${username}`, 'info');
  try {
    log(`${fmtTime(Date.now())}  Authenticating ${username} on ${db} at ${client.url}…`, 'm');
    const uid = await client.authenticate();
    log(`  Authenticated. uid ${uid}`, 'o');
    const data = await loadFromOdoo(client, log);
    S.odoo = client; S.mode = 'live'; S.data = data; S.created = {}; S.agentRuns = {}; S.geoCity = null;
    S.filters = { city: '', product: '', type: '', rep: '', minScore: 0, minRev: 0, q: '' };
    Live.feed = []; Live.perAgent = {}; Live.announced = new Set();
    analyze(); startSync();
    log(`✓ ODOO LIVE. ${S.opps.length} opportunities detected.`, 'o');
    audit('odoo', 'Connected — ODOO LIVE', `${data.customers.length} partners, ${data.lines.length} order lines, ${S.opps.length} opportunities`, 'ok');
    toast('Conectado a Odoo. Los agentes están analizando los datos reales.', 'ok');
    render();
    Agent.brief(true);
  } catch (e) {
    log('✕ ' + e.message, 'e');
    audit('odoo', 'Connection failed', e.message, 'error');
    btn.disabled = false; btn.textContent = S.mode === 'live' ? 'Reconectar y recargar' : 'Conectar y sincronizar';
  }
}
function disconnect() {
  S.odoo = null; S.mode = 'local'; S.created = {}; S.agentRuns = {}; S.geoCity = null; S.connLog = 'Desconectado de Odoo.';
  clearInterval(syncTimer);
  S.data = genDemo(S.settings.seed); analyze();

}

function downloadCSV(name, rows) {
  const csv = rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

    case 'filter-go': S.filters = { city: d.city || '', product: d.product || '', type: d.type || '', rep: '', minScore: 0, minRev: 0, q: '' }; S.oppLimit = 40; closeDrawer(); go('opportunities'); break;
    case 'clear-filters': S.filters = { city: '', product: '', type: '', rep: '', minScore: 0, minRev: 0, q: '' }; S.oppLimit = 40; render(); break;
    case 'more-opps': S.oppLimit += 40; $('#oppResults').innerHTML = oppResultsHtml(filteredOpps()); break;
    case 'export-opps': { const l = filteredOpps(); downloadCSV('eurolab-opportunities.csv', [['ID', 'Type', 'Customer', 'City', 'Rep', 'Product', 'AI Score', 'Potential USD', 'Reason', 'Recommended Action', 'Odoo CRM ID'], ...l.map(o => [o.id, o.type, o.customer, o.city, o.rep, o.product, o.score, o.potential, o.reason, o.action, o.odooId || ''])]); audit('system', 'Opportunities exported', l.length + ' rows', 'ok'); break; }
    case 'ask': closeDrawer(); Agent.ask(d.q); break;
    case 'run-agent': runAgent(d.id); break;
    case 'run-all': (async () => { el.disabled = true; for (const ag of AGENTS) { if (S.route !== 'agents') break; await runAgent(ag.id); } })(); break;
    case 'disconnect': disconnect(); break;
    case 'save-settings': saveSettings(); break;
    case 'reset-settings': S.settings = Object.assign({}, DEFAULT_SETTINGS, { seed: S.settings.seed }); store.set('settings', S.settings); analyze(); audit('system', 'Settings restored', '', 'ok'); render(); break;
    case 'forget-conn': store.del('conn'); S.conn = { url: '', db: '', username: '', proxy: '' }; toast('Conexión guardada eliminada.'); break;
    case 'export-audit': downloadCSV('eurolab-audit-log.csv', [['Time', 'Area', 'Event', 'Detail', 'Result'], ...S.audit.map(x => [new Date(x.t).toISOString(), x.cat, x.event, x.detail, x.status])]); break;
    case 'clear-audit': S.audit = []; store.set('audit', []); render(); break;
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-composer]'); if (!f) return;
  e.preventDefault();
  const inp = f.querySelector('input'), v = inp.value.trim();
  if (v) { inp.value = ''; Agent.ask(v); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modal').classList.contains('on')) closeModal(); else if ($('#drawer').classList.contains('on')) closeDrawer(); else if (Agent.open) Agent.closeDock(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g.city,[data-action]:not(button):not(form)')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); Agent.openDock(); }
});
$('#overlay').addEventListener('click', () => { closeModal(); closeDrawer(); });
$('#menuBtn').addEventListener('click', () => { $('#sidebar').classList.add('open'); $('#scrim').classList.add('on'); });
$('#scrim').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); });
window.addEventListener('hashchange', render);

/* =========================================================
   Init
   ========================================================= */
S.mode = 'local';
S.created = {};
S.data = genDemo(S.settings.seed);
analyze();
audit('system', 'Agents started', `${S.data.customers.length} customers, ${S.data.products.length} products, ${S.data.lines.length} order lines, ${S.opps.length} opportunities`, 'info');
$('#dockSuggest').innerHTML = DOCK_SUGGEST.map(q => `<button data-action="ask" data-q="${esc(q)}">${esc(q)}</button>`).join('');
render();
Live.start();
for (let i = 0; i < 6; i++) Live.tick();
setTimeout(() => {
  if (S.settings.autoBrief === false) return;
  const wide = window.matchMedia('(min-width:1100px)').matches;
  if (wide && S.route !== 'copilot') Agent.openDock();
  Agent.brief(!wide);
}, 900);
</script>
