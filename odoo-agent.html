<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A101E">
<title>Eurolab Group · AI Revenue Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A101E; --bg-2:#0D1526; --panel:#111A2D; --panel-2:#16213A; --panel-3:#1C2946;
  --line:rgba(150,172,212,.13); --line-2:rgba(150,172,212,.07);
  --text:#E8EDF6; --muted:#95A2BA; --faint:#66738E;
  --accent:#6CD5C7; --accent-2:#43B7A8; --gold:#E2BF7C; --violet:#A08FF6;
  --t-reorder:#E8B55C; --t-cross:#6CD5C7; --t-upsell:#93A5FF; --t-equip:#DB8FC9; --t-dormant:#A3ADBF; --t-risk:#F27D7D;
  --ok:#5ED39A; --bad:#F27D7D; --warn:#E8B55C;
  --r-s:8px; --r-m:14px; --r-l:20px;
  --shadow:0 24px 60px rgba(0,0,0,.45);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --dock-w:410px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Manrope,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;color:var(--text);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  background:radial-gradient(1100px 620px at 88% -8%,rgba(108,213,199,.08),transparent 62%),radial-gradient(900px 520px at 8% 4%,rgba(160,143,246,.07),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
::selection{background:rgba(108,213,199,.3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(150,172,212,.18);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}

/* ---------- Orb (agent presence) ---------- */
.orb{--s:38px;position:relative;width:var(--s);height:var(--s);border-radius:50%;flex:none;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 26px rgba(108,213,199,.28)}
.orb::before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,#6CD5C7,#A08FF6,#E2BF7C,#6CD5C7);animation:spin 9s linear infinite;filter:blur(2px)}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.85) 0 7%,rgba(255,255,255,.1) 26%,transparent 46%),radial-gradient(circle at 60% 75%,rgba(10,16,30,.35),transparent 60%)}
.orb.sm{--s:26px}.orb.xs{--s:20px}.orb.lg{--s:64px}.orb.xl{--s:84px}
.orb.busy{animation:breathe 1.1s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 44px rgba(108,213,199,.6)}}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;position:relative;flex:none}
.pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ok);opacity:0;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.8}100%{transform:scale(1.6);opacity:0}}

/* ---------- Sidebar ---------- */
.sidebar{background:linear-gradient(180deg,#080D19,#0A1120);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:24px 14px 16px;z-index:40}
.brand{padding:2px 10px 22px}
.brand .wm{font-weight:800;font-size:15.5px;letter-spacing:.2em;color:#fff;display:flex;align-items:center;gap:11px}
.brand .sub{font-family:var(--display);font-size:15px;color:var(--gold);margin-top:5px;padding-left:37px;font-style:italic;font-weight:400}
.nav-group{margin:18px 0 6px;padding:0 12px;font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--faint)}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#AEB9CD;padding:9px 12px;border-radius:var(--r-s);cursor:pointer;text-align:left;font-weight:500;position:relative;transition:background .15s,color .15s}
.nav button svg{width:17px;height:17px;flex:none;opacity:.75}
.nav button:hover{background:rgba(255,255,255,.04);color:#fff}
.nav button.active{background:linear-gradient(90deg,rgba(108,213,199,.14),rgba(108,213,199,.03));color:#fff;font-weight:600}
.nav button.active svg{opacity:1;color:var(--accent)}
.nav button.active::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.nav .count{margin-left:auto;font-size:11px;background:rgba(108,213,199,.12);color:var(--accent);border-radius:10px;padding:1px 8px;font-weight:700}
.side-agent{margin-top:auto;border:1px solid var(--line);border-radius:var(--r-m);padding:14px;background:linear-gradient(160deg,rgba(108,213,199,.08),rgba(160,143,246,.05));cursor:pointer;text-align:left;width:100%;color:inherit}
.side-agent:hover{border-color:rgba(108,213,199,.35)}
.side-agent .top{display:flex;gap:11px;align-items:center}
.side-agent b{display:block;font-size:13.5px;color:#fff}
.side-agent small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.side-agent .meta{display:flex;justify-content:space-between;gap:8px;margin-top:12px;font-size:11.5px;color:var(--muted)}
.side-agent .meta b{display:inline;color:var(--text);font-size:12px}

/* ---------- Main / topbar ---------- */
.main{min-width:0;display:flex;flex-direction:column;transition:padding-right .25s ease}
.app.dock-open .main{padding-right:var(--dock-w)}
.topbar{position:sticky;top:0;z-index:30;background:rgba(10,16,30,.78);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 30px;padding-top:max(12px,env(safe-area-inset-top))}
.crumb{font-weight:600;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.menu-btn{display:none;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-s);width:38px;height:36px;cursor:pointer;place-items:center}
.ticker{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);min-width:0;max-width:440px;border:1px solid var(--line);border-radius:20px;padding:5px 13px 5px 11px;background:rgba(17,26,45,.7)}
.ticker .lt-a{color:var(--accent);font-weight:700;white-space:nowrap}
.ticker .lt-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-btn{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.05em;padding:6px 12px;border-radius:20px;border:1px solid var(--line);white-space:nowrap;cursor:pointer;background:rgba(17,26,45,.7);color:var(--muted)}
.chip-btn:hover{color:#fff;border-color:rgba(108,213,199,.4)}
.chip-btn.live{color:var(--ok);border-color:rgba(94,211,154,.4);background:rgba(94,211,154,.08)}
.talk-btn{display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(108,213,199,.35);background:linear-gradient(135deg,rgba(108,213,199,.16),rgba(160,143,246,.12));color:#fff;border-radius:22px;padding:4px 14px 4px 5px;font-weight:600;cursor:pointer;white-space:nowrap}
.talk-btn:hover{border-color:var(--accent)}
.view{padding:28px 30px 70px;max-width:1500px;width:100%;margin:0 auto}

.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-head h1{margin:0;font-family:var(--display);font-weight:500;font-size:34px;line-height:1.1;letter-spacing:-.01em;color:#fff}
.page-head p{margin:8px 0 0;color:var(--muted);max-width:72ch}
.page-head-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.src{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ok);border:1px solid rgba(94,211,154,.4);padding:4px 11px;border-radius:20px}

/* ---------- Panels ---------- */
.panel{background:linear-gradient(180deg,rgba(22,33,58,.72),rgba(17,26,45,.72));border:1px solid var(--line);border-radius:var(--r-m);padding:20px 22px;min-width:0;position:relative}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-h h2{margin:0;font-size:14.5px;font-weight:700;color:#fff;letter-spacing:.01em;display:flex;align-items:center;gap:9px}
.panel-h .hint{font-size:12.5px;color:var(--muted)}
.grid{display:grid;gap:18px;margin-bottom:18px}
.g-2-1{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.g-1-1{grid-template-columns:1fr 1fr}
.mt{margin-top:18px}
.muted{color:var(--muted)}
.row-flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- Hero (agent briefing) ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;margin-bottom:18px;background:linear-gradient(120deg,rgba(108,213,199,.10),rgba(160,143,246,.07) 45%,rgba(17,26,45,.6) 80%)}
.hero-main{padding:30px 32px;display:flex;gap:22px;align-items:flex-start}
.hero-k{font-size:12.5px;color:var(--accent);font-weight:700;display:flex;gap:8px;align-items:center}
.hero-h{font-family:var(--display);font-weight:400;font-size:clamp(26px,2.5vw,35px);line-height:1.2;margin:10px 0 12px;color:#fff;letter-spacing:-.01em;max-width:32ch}
.hero-p{color:#C3CCDC;margin:0 0 20px;max-width:64ch}
.hero-side{border-left:1px solid var(--line);padding:24px 24px 20px;background:rgba(10,16,30,.45)}
.hero-side h3{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
.big-count{font-family:var(--display);font-size:40px;color:#fff;line-height:1.1}
.big-count small{font-family:Manrope,sans-serif;font-size:13px;color:var(--muted);margin-left:6px}
.cur{font-size:13px;color:var(--muted);margin:2px 0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cur b{color:var(--text);font-weight:600}
.agent-rows{list-style:none;margin:0;padding:0}
.agent-rows li{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line-2);font-size:13px}
.ag-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.55;display:inline-block}
.ag-dot.blink{animation:blink 1s ease-out}
@keyframes blink{0%{opacity:1;box-shadow:0 0 0 0 rgba(108,213,199,.9)}100%{opacity:.55;box-shadow:0 0 0 10px rgba(108,213,199,0)}}
.agent-rows .ag-count{color:var(--muted);font-size:12px}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:18px;background:rgba(17,26,45,.6);overflow:hidden}
.kpi{padding:18px 18px 16px;border-left:1px solid var(--line-2);min-width:0}
.kpi:first-child{border-left:0}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--display);font-size:28px;color:#fff;line-height:1.15;margin-top:4px;white-space:nowrap;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--faint);margin-top:3px}
.kpi .s.up{color:var(--ok)}.kpi .s.down{color:var(--bad)}
.kpi.gold .v{color:var(--gold)}
.kpi .bar{height:3px;border-radius:2px;background:var(--line);margin-top:10px;overflow:hidden}
.kpi .bar span{display:block;height:100%;background:var(--c,var(--accent))}

/* ---------- Chips, score, tables ---------- */
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 32%,transparent)}
.t-reorder{--c:var(--t-reorder)}.t-cross{--c:var(--t-cross)}.t-upsell{--c:var(--t-upsell)}.t-equip{--c:var(--t-equip)}.t-dormant{--c:var(--t-dormant)}.t-risk{--c:var(--t-risk)}
.score{display:inline-flex;align-items:center;gap:8px}
.score b{font-weight:800;min-width:22px;text-align:right;color:#fff}
.score i{display:block;width:40px;height:4px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.score i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--v);background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:3px}
.risk-h{color:var(--bad);font-weight:700}.risk-m{color:var(--warn);font-weight:700}.risk-l{color:var(--ok);font-weight:600}
.tbl-wrap{overflow-x:auto;margin:0 -22px;padding:0 22px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11.5px;color:var(--faint);font-weight:700;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.03em}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover td{background:rgba(108,213,199,.04)}
.tbl .num{text-align:right;white-space:nowrap}
.tbl .click{cursor:pointer}
.tbl .cust{font-weight:700;color:#fff}
.tbl .sub{font-size:12px;color:var(--muted)}
.tbl .reason{max-width:34ch;color:#C9D1DF}
.tbl .action{color:var(--muted);max-width:28ch}
.money{color:var(--gold);font-weight:700}
.linkish{background:none;border:0;padding:0;color:#fff;font-weight:700;cursor:pointer;text-align:left}
.linkish:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* ---------- Buttons & forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);padding:8px 15px;border-radius:var(--r-s);font-weight:600;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:rgba(150,172,212,.4);background:rgba(255,255,255,.06)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#57BFD2);border-color:transparent;color:#06222A}
.btn.primary:hover{filter:brightness(1.07)}
.btn.gold{background:linear-gradient(135deg,#EACB8E,#C99D52);border-color:transparent;color:#2A1C05}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn.done{border-color:rgba(94,211,154,.4);color:var(--ok);background:rgba(94,211,154,.08);cursor:default}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field .help{font-size:12px;color:var(--faint)}
input[type=text],input[type=url],input[type=password],input[type=number],input[type=search],select,textarea{border:1px solid var(--line);background:rgba(10,16,30,.6);border-radius:var(--r-s);padding:9px 11px;width:100%;min-width:0;color:var(--text)}
select option{background:#111A2D}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
input[type=range]{accent-color:var(--accent);width:100%}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.2fr) minmax(0,1fr) auto;gap:10px;align-items:end;margin-bottom:12px}
.results-line{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 0 12px;flex-wrap:wrap;color:var(--muted)}
.results-line b{color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:16px}
.seg button.on{background:rgba(108,213,199,.16);color:#fff}

/* ---------- Charts ---------- */
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line-2)}.chart .al{font-size:11px;fill:var(--faint)}
.donut-wrap{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center}
.donut-wrap svg{width:170px;height:170px}
.legend-rows{list-style:none;margin:0;padding:0}
.legend-rows li{display:grid;grid-template-columns:10px 1fr auto auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line-2);font-size:13px}
.legend-rows li:first-child{border-top:0}
.legend-rows .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.legend-rows .n{color:var(--muted);font-size:12px}
.spark{width:100%;height:60px;display:block}

/* ---------- Priority, feed, patterns ---------- */
.priority{list-style:none;margin:0;padding:0}
.priority li{display:grid;grid-template-columns:46px 1fr auto;gap:14px;padding:13px 0;border-top:1px solid var(--line-2);align-items:start}
.priority li:first-child{border-top:0;padding-top:2px}
.ring{--v:50;width:42px;height:42px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--v)*1%),rgba(150,172,212,.12) 0);display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;position:relative}
.ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#131D32}
.ring span{position:relative}
.priority .t{font-weight:700;color:#fff}
.priority .r{font-size:12.5px;color:var(--muted);margin-top:3px}
.priority .p{text-align:right;white-space:nowrap}
.priority .by{font-size:11.5px;color:var(--accent);font-weight:600}
.live-feed{list-style:none;margin:0;padding:0;overflow:hidden}
.fi{display:grid;grid-template-columns:62px 1fr 30px;gap:10px;padding:10px 0;border-top:1px solid var(--line-2);font-size:12.8px;align-items:start}
.fi:first-child{border-top:0}
.fi.new{animation:slidein .45s ease}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.fi-t{color:var(--faint);font-size:11.5px;padding-top:1px}
.fi-a{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.02em;margin-right:4px}
.fi.risk .fi-a{color:var(--bad)}.fi.ok .fi-a{color:var(--faint)}
.fi-c{color:var(--faint);font-size:11.5px}
.fi-x{color:#C0C9D8}
.fi-s{font-weight:800;text-align:right;color:var(--gold)}
.fi-s.ok{color:var(--ok)}
.fi .linkish{font-weight:600}
.patterns{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pattern{border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px;background:rgba(10,16,30,.35);display:flex;flex-direction:column;gap:8px}
.pattern .ph{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pattern .by{font-size:11.5px;font-weight:700;color:var(--accent)}
.pattern h3{margin:2px 0 0;font-size:15px;color:#fff;font-weight:700;line-height:1.3}
.pattern .k{font-family:var(--display);font-size:26px;line-height:1;color:#fff;white-space:nowrap}
.pattern.up .k{color:var(--ok)}.pattern.down .k{color:var(--bad)}
.pattern p{margin:0;color:var(--muted);font-size:13px}
.pattern .btn{align-self:flex-start;margin-top:auto}
.insights{list-style:none;margin:0;padding:0}
.insights li{padding:11px 0 11px 18px;border-top:1px solid var(--line-2);position:relative;color:#D3DAE6}
.insights li:first-child{border-top:0}
.insights li::before{content:"";position:absolute;left:0;top:18px;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.citylist{list-style:none;margin:10px 0 0;padding:0}
.citylist li{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line-2);cursor:pointer}
.citylist li:hover{color:var(--accent)}

/* ---------- Map ---------- */
.map-wrap{display:flex;justify-content:center}
.map-wrap svg{width:100%;max-width:410px;height:auto}
.land{fill:url(#landGrad);stroke:rgba(108,213,199,.45);stroke-width:1}
.map-wrap .tick{stroke:var(--faint)}.map-wrap .tick-l{font-size:10.5px;fill:var(--faint)}
.city{cursor:pointer}
.city circle:first-child{fill:rgba(226,191,124,.2);stroke:var(--gold);stroke-width:1.2;transition:fill .15s}
.city .dot{fill:var(--gold)}
.city:hover circle:first-child,.city:focus circle:first-child{fill:rgba(226,191,124,.38)}
.city.sel circle:first-child{fill:rgba(108,213,199,.3);stroke:var(--accent);stroke-width:2}
.city.sel .dot{fill:var(--accent)}
.city text{font-size:12px;fill:#D6DDE9;paint-order:stroke;stroke:#0D1526;stroke-width:3px}
.city .cn{font-weight:700}.city .cv{fill:var(--gold);font-weight:600}
.map-mini .city text{font-size:11px}
.geo{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:18px;align-items:start;margin-bottom:18px}
.cityhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.cityhead h2{margin:0;font-family:var(--display);font-weight:500;font-size:30px;color:#fff}
.minikpis{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:16px 0}
.minikpis div{padding:11px 12px 11px 0}
.minikpis .l{font-size:12px;color:var(--muted)}.minikpis .v{font-family:var(--display);font-size:22px;color:#fff}
.pen .row{display:grid;grid-template-columns:140px 1fr 96px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.pen .track{height:8px;background:var(--line);border-radius:5px;position:relative}
.pen .track span{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:5px}
.pen .track i{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;border-radius:1px}
.pen .row.low .track span{background:var(--t-risk)}
.pen .v{text-align:right;color:var(--muted);font-size:12px}
.legend{font-size:12px;color:var(--muted);display:flex;gap:14px;align-items:center;margin-top:8px;flex-wrap:wrap}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);margin-right:5px;vertical-align:-1px}
.legend .mk{display:inline-block;width:2px;height:12px;background:#fff;margin-right:6px;vertical-align:-2px}
.insight-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));background:rgba(17,26,45,.6);border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:18px}
.insight-strip p{margin:0;padding:16px 18px;border-left:1px solid var(--line-2);font-size:13.5px;color:#D3DAE6}
.insight-strip p:first-child{border-left:0}
.bars .row{display:grid;grid-template-columns:150px 1fr 60px 80px;gap:10px;align-items:center;padding:7px 0}
.bars .bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.bars .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:5px}
.bars .n{text-align:right;color:var(--muted);font-size:12.5px}.bars .m{text-align:right;font-weight:700;color:var(--gold)}

/* ---------- Agents page ---------- */
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.agent{border:1px solid var(--line);border-radius:var(--r-m);padding:18px 20px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,rgba(22,33,58,.72),rgba(17,26,45,.72))}
.agent-h{display:flex;gap:13px;align-items:flex-start}
.agent-ic{width:40px;height:40px;border-radius:11px;background:rgba(108,213,199,.1);border:1px solid rgba(108,213,199,.25);color:var(--accent);display:grid;place-items:center;flex:none}
.agent-ic svg{width:19px;height:19px}
.agent h3{margin:0;font-size:15.5px;color:#fff;display:flex;gap:8px;align-items:center}
.agent p{margin:3px 0 0;color:var(--muted);font-size:13px}
.agent .stats{display:flex;gap:22px;font-size:12px;color:var(--muted)}
.agent .stats b{display:block;font-family:var(--display);font-weight:500;font-size:22px;color:#fff}
.ag-live{font-size:12.5px;color:var(--muted);border-left:2px solid var(--accent);padding:2px 0 2px 10px;min-height:38px}
.ag-live b{color:var(--text)}
.agent-log{background:#060B16;border:1px solid var(--line);color:#A9BAD0;border-radius:var(--r-s);padding:10px 12px;font-size:12px;line-height:1.65;max-height:170px;overflow:auto;display:none;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.agent-log.on{display:block}
.agent-log .ok{color:var(--ok)}
.agent-res{list-style:none;margin:0;padding:0;font-size:13px}
.agent-res li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line-2)}
.agent .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:4px}
.agent .when{font-size:12px;color:var(--faint)}
.statline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:18px;background:rgba(17,26,45,.6)}
.statline div{padding:16px 18px;border-left:1px solid var(--line-2)}
.statline div:first-child{border-left:0}
.statline .l{font-size:12px;color:var(--muted)}.statline .v{font-family:var(--display);font-size:26px;color:#fff}

/* ---------- Chat (shared by dock and Copilot page) ---------- */
.msgs{display:flex;flex-direction:column;gap:14px}
.msg.user{align-self:flex-end;max-width:82%;background:linear-gradient(135deg,rgba(108,213,199,.22),rgba(160,143,246,.18));border:1px solid rgba(108,213,199,.3);color:#fff;padding:9px 14px;border-radius:16px 16px 4px 16px}
.msg.ai{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start}
.msg.ai .body{min-width:0;background:rgba(22,33,58,.7);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:11px 14px;color:#D9E0EC}
.msg.ai.alert .body{border-color:rgba(226,191,124,.45);background:linear-gradient(135deg,rgba(226,191,124,.1),rgba(22,33,58,.7))}
.msg.ai p{margin:0 0 8px}.msg.ai p:last-child{margin-bottom:0}
.msg.ai ol,.msg.ai ul{margin:4px 0 10px;padding-left:18px}
.msg.ai li{margin:5px 0}
.msg.ai b{color:#fff}
.msg.ai .srcl{font-size:11.5px;color:var(--faint);margin-top:8px}
.msg.ai .tbl{font-size:12.5px;margin:6px 0}
.msg.ai .tbl td{padding:7px 8px}.msg.ai .tbl th{padding:6px 8px}
.msg.ai .tbl-wrap{margin:0;padding:0}
.msg .row-flex{margin-top:8px}
.steps{list-style:none;margin:0;padding:0;font-size:12.5px;color:var(--muted)}
.steps li{display:flex;gap:8px;align-items:center;padding:2px 0;opacity:.35;transition:opacity .2s}
.steps li.on{opacity:1}.steps li.done{opacity:.8}
.steps li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
.steps li.on::before{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.steps li.done::before{background:var(--ok)}
.suggest{display:flex;gap:7px;flex-wrap:wrap}
.suggest button{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:16px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:#C9D2E2}
.suggest button:hover{border-color:var(--accent);color:#fff}
.composer-form{display:flex;gap:8px}
.composer-form input{border-radius:22px;padding:10px 16px}
.send{width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--violet));color:#06222A;cursor:pointer;display:grid;place-items:center;flex:none}

/* Dock */
.dock{position:fixed;top:0;right:0;height:100%;width:var(--dock-w);max-width:100%;background:linear-gradient(180deg,#0F1729,#0B1222);border-left:1px solid var(--line);z-index:55;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:-20px 0 60px rgba(0,0,0,.35)}
.dock.on{transform:none}
.dock-h{padding:16px 18px;padding-top:max(16px,env(safe-area-inset-top));border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.dock-h .who{flex:1;min-width:0}
.dock-h b{display:block;color:#fff;font-size:15px}
.dock-h small{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden}
.dock-h small span:last-child{overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:34px;height:34px;border-radius:var(--r-s);border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer;display:grid;place-items:center;flex:none}
.icon-btn:hover{color:#fff;border-color:rgba(150,172,212,.4)}
.dock-chat{flex:1;overflow-y:auto;padding:18px}
.dock-foot{border-top:1px solid var(--line);padding:12px 14px;padding-bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;background:rgba(10,16,30,.6)}
.dock-foot .suggest{max-height:66px;overflow:hidden}
.orb-btn{position:fixed;right:22px;bottom:max(22px,env(safe-area-inset-bottom));z-index:50;border:0;background:none;cursor:pointer;padding:0;border-radius:50%;transition:transform .2s,opacity .2s}
.orb-btn:hover{transform:scale(1.06)}
.orb-btn.hide{opacity:0;pointer-events:none;transform:scale(.6)}
.orb-btn .badge{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:#2A1C05;font-size:11px;font-weight:800;display:none;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.orb-btn .badge.on{display:grid}
.orb-btn .bubble{position:absolute;right:76px;bottom:12px;background:var(--panel-2);border:1px solid rgba(226,191,124,.4);color:#fff;padding:9px 13px;border-radius:14px 14px 4px 14px;font-size:12.5px;width:max-content;max-width:260px;text-align:left;box-shadow:var(--shadow);display:none}
.orb-btn .bubble.on{display:block;animation:slidein .3s ease}

/* Copilot page */
.copilot{display:grid;grid-template-columns:280px 1fr;gap:18px;height:calc(100vh - 200px);min-height:520px}
.cp-side{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
.agent-card{text-align:center}
.agent-card .orb{margin:4px auto 14px}
.agent-card h3{margin:0;font-family:var(--display);font-weight:500;font-size:22px;color:#fff}
.agent-card p{margin:6px 0 0;color:var(--muted);font-size:13px}
.cap{list-style:none;margin:0;padding:0;font-size:13px}
.cap li{padding:8px 0;border-top:1px solid var(--line-2);color:#C9D2E2}
.cap li:first-child{border-top:0}
.cap b{color:var(--accent);font-weight:700}
.cp-main{display:grid;grid-template-rows:1fr auto;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:rgba(13,21,38,.7);min-height:0}
.cp-chat{overflow-y:auto;padding:22px}
.cp-foot{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:rgba(10,16,30,.6)}

/* Connect */
.conn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.form-grid{display:grid;gap:13px}
.conn-log{background:#060B16;border:1px solid var(--line);color:#B6C4D8;border-radius:var(--r-s);padding:12px 14px;font-size:12.5px;line-height:1.7;min-height:170px;max-height:360px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.conn-log .e{color:#FF9D9D}.conn-log .o{color:var(--ok)}.conn-log .m{color:var(--faint)}
.note{font-size:13px;color:var(--muted);background:rgba(10,16,30,.4);border:1px solid var(--line-2);border-radius:var(--r-s);padding:11px 13px}
.note b{color:#fff}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}

/* Drawer, modal, toast */
.overlay{position:fixed;inset:0;background:rgba(3,6,14,.6);backdrop-filter:blur(2px);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(780px,100%);background:var(--bg-2);border-left:1px solid var(--line);z-index:70;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.on{transform:none}
.drawer-h{border-bottom:1px solid var(--line);padding:20px 24px;padding-top:max(20px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:linear-gradient(120deg,rgba(108,213,199,.08),transparent)}
.drawer-h h2{margin:0;font-family:var(--display);font-weight:500;font-size:26px;color:#fff}
.drawer-h p{margin:4px 0 0;color:var(--muted);font-size:13px}
.drawer-b{overflow-y:auto;padding:20px 24px 44px;padding-bottom:max(44px,env(safe-area-inset-bottom))}
.drawer-b .panel{margin-top:16px}
.nbx{display:grid;grid-template-columns:1fr 1fr;border:1px solid rgba(226,191,124,.4);border-radius:var(--r-m);background:linear-gradient(135deg,rgba(226,191,124,.1),rgba(17,26,45,.4));margin:16px 0}
.nbx div{padding:15px 17px}
.nbx div+div{border-left:1px solid rgba(226,191,124,.25)}
.nbx .l{font-size:12px;font-weight:700;color:var(--gold)}
.nbx .v{font-weight:700;color:#fff;margin-top:3px}
.agent-note{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;background:rgba(108,213,199,.05);color:#D3DAE6;font-size:13.5px}
.agent-note p{margin:0}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:min(560px,calc(100% - 28px));max-height:calc(100% - 40px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);z-index:80;box-shadow:var(--shadow);padding:24px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal h3{margin:0 0 6px;font-family:var(--display);font-weight:500;font-size:22px;color:#fff}
.modal .kv{display:grid;grid-template-columns:140px 1fr;gap:7px 12px;font-size:13px;margin:16px 0;padding:14px;background:rgba(10,16,30,.5);border-radius:var(--r-s);border:1px solid var(--line-2)}
.modal .kv dt{color:var(--muted);font-weight:600}.modal .kv dd{margin:0;word-break:break-word}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.modal .err{color:var(--bad);font-size:13px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:90;background:var(--panel-3);border:1px solid var(--line);color:#fff;padding:12px 18px;border-radius:var(--r-s);box-shadow:var(--shadow);font-weight:600;transform:translate(-50%,20px);opacity:0;transition:all .22s;pointer-events:none;max-width:calc(100% - 40px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-color:rgba(94,211,154,.5);background:#123028}.toast.bad{border-color:rgba(242,125,125,.5);background:#35161B}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.scrim{display:none}

/* ---------- Responsive ---------- */
@media (max-width:1500px){.app.dock-open .main{padding-right:0}}
@media (max-width:1320px){
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .kpi{border-top:1px solid var(--line-2)}
  .kpi:nth-child(-n+4){border-top:0}
  .kpi:nth-child(4n+1){border-left:0}
  .filters{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1100px){
  .g-2-1,.g-1-1,.geo,.conn,.hero,.copilot{grid-template-columns:1fr}
  .hero-side{border-left:0;border-top:1px solid var(--line)}
  .copilot{height:auto}
  .cp-side{display:none}
  .cp-main{height:calc(100vh - 190px)}
  .statline{grid-template-columns:1fr 1fr}
  .statline div:nth-child(3){border-left:0;border-top:1px solid var(--line-2)}
  .statline div:nth-child(4){border-top:1px solid var(--line-2)}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:278px;transform:translateX(-100%);transition:transform .22s;padding-top:max(24px,env(safe-area-inset-top))}
  .sidebar.open{transform:none;box-shadow:var(--shadow)}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(3,6,14,.55);z-index:35}
  .menu-btn{display:inline-grid}
  .topbar{padding:10px 14px}
  .ticker,.crumb{display:none}
  .view{padding:20px 16px 100px}
  .hero-main{padding:22px 20px;flex-direction:column;gap:14px}
}
@media (max-width:700px){
  .kpis{grid-template-columns:1fr 1fr}
  .kpi:nth-child(n){border-left:1px solid var(--line-2);border-top:1px solid var(--line-2)}
  .kpi:nth-child(odd){border-left:0}
  .kpi:nth-child(-n+2){border-top:0}
  .kpi .v{font-size:24px}
  .filters{grid-template-columns:1fr 1fr}
  .minikpis{grid-template-columns:1fr 1fr}
  .nbx{grid-template-columns:1fr}
  .nbx div+div{border-left:0;border-top:1px solid rgba(226,191,124,.25)}
  .donut-wrap{grid-template-columns:1fr;justify-items:center}
  .bars .row{grid-template-columns:110px 1fr 70px}.bars .n{display:none}
  .page-head h1{font-size:28px}
  .talk-btn span.t{display:none}
  .talk-btn{padding:4px}
  .tbl.cards thead{display:none}
  .tbl.cards,.tbl.cards tbody,.tbl.cards tr,.tbl.cards td{display:block;width:100%}
  .tbl.cards tr{border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:10px;padding:6px 14px;background:rgba(10,16,30,.35)}
  .tbl.cards td{border:0;padding:6px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  .tbl.cards td::before{content:attr(data-l);color:var(--faint);font-size:12px;font-weight:600;text-align:left;flex:none}
  .tbl.cards td.reason,.tbl.cards td.action{max-width:none}
  .tbl-wrap{margin:0;padding:0}
  .dock{width:100%}
  .modal .kv{grid-template-columns:1fr}
  .orb-btn .bubble{max-width:200px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

      <div class="wm"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v3H7.5v3.5H17v3H7.5V17H20v3H4z" fill="url(#bg1)"/></svg>EUROLAB GROUP</div>

    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

  </main>
</div>
<button class="orb-btn" id="orbBtn" data-action="open-dock" aria-label="Open Eurolab AI"><span class="orb lg"></span><span class="badge" id="orbBadge"></span><span class="bubble" id="orbBubble"></span></button>
<aside class="dock" id="dock" aria-label="Eurolab AI agent" aria-hidden="true">
  <div class="dock-h">

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (a, f = x => x) => a.reduce((s, x) => s + (f(x) || 0), 0);
const median = a => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const fmtDate = t => t ? new Date(t).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';

};
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function money(v, compact = false) {
  const clp = S.settings.currency === 'CLP';

  if (compact) {

    if (a >= 1e6) return sym + (x / 1e6).toFixed(a >= 1e7 ? 1 : 2).replace(/\.?0+$/, '') + 'M';
    if (a >= 1e3) return sym + Math.round(x / 1e3) + 'K';
    return sym + Math.round(x);
  }
  return sym + Math.round(x).toLocaleString('en-US');
}

/* =========================================================
   Local commercial dataset (used until Odoo is connected)
   ========================================================= */
function genDemo(seed) {
  const R = mulberry32(seed);
  const rnd = (a, b) => a + R() * (b - a);
  const ri = (a, b) => Math.floor(rnd(a, b + 1));
  const pick = a => a[Math.floor(R() * a.length)];
  const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  const today = startOfDay(Date.now());
  const products = DEMO_PRODUCTS.map(p => ({ ...p }));
  const P = Object.fromEntries(products.map(p => [p.id, p]));

  const prefixes = ['Clínica', 'Centro Médico', 'Dermoclínica', 'Instituto', 'Clínica Estética', 'Centro de Medicina Estética', 'Medical Spa', 'Clínica Dermatológica'];
  const cores = ['Alma', 'Lumière', 'Andes', 'Pacífico', 'Vitalis', 'Renova', 'Dermavida', 'Esencia', 'Aurora', 'Nativa', 'Cumbre', 'Bahía', 'Ámbar', 'Mirador', 'Austral', 'Magnolia', 'Piel Sana', 'Skin Lab', 'Derma Plus', 'Vértice', 'Equilibrio', 'Origen', 'Nova', 'Kora', 'Lyra', 'Oasis', 'Dra. Fuentes', 'Dr. Rivas', 'Dra. Contreras', 'Dr. Sepúlveda', 'Dra. Muñoz', 'Dr. Araya', 'Dra. Rojas', 'Dr. Valenzuela', 'Dra. Bravo', 'Dr. Espinoza', 'Dra. Carrasco', 'Dr. Tapia', 'Belle Peau', 'Integral', 'Armonía', 'Lienzo'];
  const hoods = ['Las Condes', 'Vitacura', 'Providencia', 'Lo Barnechea', 'Ñuñoa', 'La Reina'];
  const names = new Set();
  const customers = [], orders = [], lines = [];
  let cid = 0, oid = 0;

  for (const [city, count] of DEMO_CITIES) {
    const bias = CITY_BIAS[city] || {};
    for (let i = 0; i < count; i++) {
      let name, guard = 0;
      do {
        name = pick(prefixes) + ' ' + pick(cores);
        if (city === 'Santiago' && R() < 0.5) name += ' ' + pick(hoods);
        guard++;
      } while (names.has(name) && guard < 50);
      names.add(name);
      const tr = R();
      const tierA = bias.tierA ?? 0.2;
      const tier = tr < tierA ? 'A' : tr < tierA + 0.5 ? 'B' : 'C';
      const br = R();
      const behavior = br < 0.55 ? 'normal' : br < 0.77 ? 'overdue' : br < 0.9 ? 'risk' : 'dormant';
      const rep = pick(REP_BY_CITY[city]);
      const id = 'C' + String(++cid).padStart(3, '0');
      const slug = norm(name).replace(/^(clinica|centro medico|dermoclinica|instituto|clinica estetica|centro de medicina estetica|medical spa|clinica dermatologica)\s+/, '').replace(/[^a-z0-9]+/g, '');
      customers.push({ id, name, city, rep, tier, email: 'contacto@' + slug.slice(0, 18) + '.cl', phone: '+56 9 ' + ri(5000, 9999) + ' ' + ri(1000, 9999) });

      // Portfolio
      const port = [];
      port.push(tier === 'C' || R() < 0.3 ? 'XEO50' : 'XEO100');
      if (R() < (bias.radiesse ?? (tier === 'A' ? 0.9 : 0.62))) port.push(R() < 0.4 ? 'RADP15' : 'RAD15');
      shuffle(['BELBAL', 'BELSOFT', 'BELVOL', 'BELINT']).slice(0, ri(1, tier === 'A' ? 3 : 2)).forEach(p => port.push(p));
      if (R() < 0.4) port.push('BELLIPS');
      if (R() < (bias.revive ?? 0.35)) port.push('BELREV');
      if (R() < 0.55) port.push('CANKIT');
      if (R() < 0.6) port.push('ANEST');
      const ownsULT = tier === 'A' ? R() < 0.35 : tier === 'B' ? R() < 0.07 : false;
      const ownsCEL = tier === 'A' && R() < 0.15;
      const disc = tier === 'A' ? 0.1 : tier === 'B' ? 0.05 : 0;
      const tierMul = tier === 'A' ? 2.5 : tier === 'B' ? 1.5 : 1;

      const addOrder = (date, items) => {
        const oname = 'S' + String(10000 + (++oid));
        let total = 0;
        for (const [pid, qty] of items) {
          const p = P[pid];
          const unit = p.equipment ? p.price : Math.round(p.price * (1 - disc));
          const subtotal = unit * qty;
          total += subtotal;
          lines.push({ orderId: oname, customerId: id, productId: pid, qty, subtotal, date });
        }
        orders.push({ id: oname, name: oname, customerId: id, date, rep, total });
      };
      if (ownsULT) { port.push('ULTTX'); addOrder(today - ri(420, 700) * DAY, [['ULTPRIME', 1]]); }
      if (ownsCEL) { port.push('CELKIT'); addOrder(today - ri(420, 700) * DAY, [['CELSYS', 1]]); }

      const cycle = ri(tier === 'A' ? 26 : 34, tier === 'C' ? 62 : 50);
      let d = today - ri(470, 560) * DAY;
      const end = behavior === 'overdue' ? today - Math.round(cycle * rnd(1.35, 1.9)) * DAY
        : behavior === 'dormant' ? today - ri(165, 320) * DAY : today;
      const growth = bias.growth || 1;
      while (d <= end) {
        const recent = d > today - 182 * DAY;
        const trend = 0.55 + 0.9 * Math.max(0, (d - (today - 560 * DAY)) / (560 * DAY));
        const qm = tierMul * trend * (recent && behavior === 'risk' ? 0.42 : 1) * (recent ? growth : 1);
        const items = [];
        for (const pid of port) {
          const p = P[pid];
          const prob = p.family === 'XEO' ? 0.95 : p.requires ? 0.5 : 0.78;
          if (R() > prob) continue;
          let qty = Math.max(1, Math.round(p.baseQty * qm * rnd(0.7, 1.3)));
          if (p.requires) qty = Math.min(qty, 3);
          items.push([pid, qty]);
        }
        if (!items.length) items.push([port[0], Math.max(1, Math.round(2 * qm))]);
        addOrder(d, items);
        const step = cycle * rnd(0.8, 1.2) * (recent && behavior === 'risk' ? 1.7 : 1);
        d += Math.round(step) * DAY;
      }
    }
  }
  return { source: 'demo', today, customers, products, orders, lines, leads: [], activities: [], loadedAt: Date.now() };
}

/* =========================================================
   OpportunityEngine + Geographic Revenue Engine
   ========================================================= */
const OpportunityEngine = {
  run() {
    const D = S.data, st = S.settings, today = D.today;
    const P = new Map(D.products.map(p => [String(p.id), p]));
    const cs = new Map();
    for (const c of D.customers) cs.set(String(c.id), { c, orderDates: new Set(), rev12: 0, rev6: 0, revPrev6: 0, revAll: 0, prods: new Map(), owns: new Set(), monthly: new Array(12).fill(0), opps: [] });
    const now = new Date(today); const curKey = now.getFullYear() * 12 + now.getMonth();
    const monthly = new Array(12).fill(0);
    const prodAgg = new Map();

    for (const l of D.lines) {
      const s = cs.get(String(l.customerId)); const p = P.get(String(l.productId));
      if (!s || !p) continue;
      const age = (today - l.date) / DAY;
      s.orderDates.add(startOfDay(l.date));
      s.revAll += l.subtotal;
      if (age < 365) s.rev12 += l.subtotal;
      if (age < 182) s.rev6 += l.subtotal; else if (age < 365) s.revPrev6 += l.subtotal;
      const dt = new Date(l.date); const mk = curKey - (dt.getFullYear() * 12 + dt.getMonth());
      if (mk >= 0 && mk < 12) { s.monthly[11 - mk] += l.subtotal; monthly[11 - mk] += l.subtotal; }
      if (p.equipment) s.owns.add(String(p.id));
      if (p.requires) s.owns.add(String(p.requires));
      const pk = String(p.id);
      let pr = s.prods.get(pk);
      if (!pr) { pr = { p, dates: new Set(), qty: 0, v12: 0, vAll: 0, q12: 0 }; s.prods.set(pk, pr); }
      pr.dates.add(startOfDay(l.date)); pr.qty += l.qty; pr.vAll += l.subtotal;
      if (age < 365) { pr.v12 += l.subtotal; pr.q12 += l.qty; }
      let pa = prodAgg.get(pk);
      if (!pa) { pa = { rev12: 0, rev6: 0, prev6: 0, qty12: 0, buyers: new Set() }; prodAgg.set(pk, pa); }
      if (age < 365) { pa.rev12 += l.subtotal; pa.qty12 += l.qty; pa.buyers.add(String(l.customerId)); }
      if (age < 182) pa.rev6 += l.subtotal; else if (age < 365) pa.prev6 += l.subtotal;
    }

    for (const s of cs.values()) {
      const ds = [...s.orderDates].sort((a, b) => a - b);
      s.dates = ds; s.nOrders = ds.length;
      s.firstDate = ds[0] || null; s.lastDate = ds.length ? ds[ds.length - 1] : null;
      s.daysSince = s.lastDate != null ? Math.round((today - s.lastDate) / DAY) : null;
      s.orders12 = ds.filter(t => today - t < 365 * DAY).length;
      s.cycle = ds.length > 1 ? Math.round((ds[ds.length - 1] - ds[0]) / (ds.length - 1) / DAY) : null;
      for (const pr of s.prods.values()) {
        const pd = [...pr.dates].sort((a, b) => a - b);
        pr.n = pd.length; pr.last = pd[pd.length - 1];
        pr.since = Math.round((today - pr.last) / DAY);
        pr.cycle = pr.n > 1 ? Math.round((pd[pd.length - 1] - pd[0]) / (pr.n - 1) / DAY) : null;
        pr.avgValue = pr.vAll / pr.n; pr.avgQty = pr.qty / pr.n;
        pr.n12 = pd.filter(t => today - t < 365 * DAY).length;
      }
      s.active = s.rev12 > 0;
      s.injRev12 = sum([...s.prods.values()].filter(x => !x.p.equipment), x => x.v12);
    }

    // Tiers for live data (local dataset already has tiers)
    const activeList = [...cs.values()].filter(s => s.active);
    const revSorted = activeList.map(s => s.rev12).sort((a, b) => a - b);
    const pctRank = v => { if (!revSorted.length) return 0; let i = 0; while (i < revSorted.length && revSorted[i] <= v) i++; return i / revSorted.length; };
    for (const s of cs.values()) { if (!s.c.tier) { const r = pctRank(s.rev12); s.c.tier = r >= 0.8 ? 'A' : r >= 0.3 ? 'B' : 'C'; } }

    // Product affinity (who buys A also buys B)
    const buyers = new Map();
    for (const s of activeList) for (const [pid, pr] of s.prods) {
      if (pr.p.equipment) continue;
      if (!buyers.has(pid)) buyers.set(pid, new Set());
      buyers.get(pid).add(String(s.c.id));
    }
    const annualByProd = new Map();
    for (const [pid, set] of buyers) annualByProd.set(pid, median([...set].map(id => cs.get(id).prods.get(pid).v12).filter(v => v > 0)));
    const equipProducts = D.products.filter(p => p.equipment).sort((a, b) => b.price - a.price);

    const tierBonus = { A: 6, B: 3, C: 0 }, tierScale = { A: 1.5, B: 1, C: 0.6 };
    const opps = []; let oid = 0;
    const add = (s, o) => {
      const c = s.c;
      const op = Object.assign({ id: 'OP-' + String(++oid).padStart(4, '0'), customerId: String(c.id), customer: c.name, city: c.city, rep: c.rep || 'Unassigned', productId: null, product: '' }, o);
      op.score = Math.round(clamp(op.score, 1, 99));
      op.potential = Math.max(0, Math.round(op.potential));
      opps.push(op); s.opps.push(op);
    };

    for (const s of cs.values()) {
      if (!s.nOrders) continue;
      const c = s.c, tb = tierBonus[c.tier] || 0;
      // DORMANT ACCOUNT
      if (s.daysSince >= st.dormantDays && s.nOrders >= 3) {
        const spanDays = Math.max(90, (s.lastDate - s.firstDate) / DAY);
        const annual = s.revAll / (spanDays / 365);
        add(s, {
          type: 'DORMANT ACCOUNT',
          score: 45 + Math.min(30, annual / 3000) + (s.nOrders >= 8 ? 8 : 0) - clamp((s.daysSince - st.dormantDays) / 30, 0, 10),
          potential: annual * 0.5,
          reason: `No orders in ${s.daysSince} days; previously ordered every ${s.cycle || '—'} days (${money(annual, true)} per year).`,
          action: `Reactivation visit by ${c.rep || 'the account rep'}; offer a reorder incentive.`,
          meta: { annual, days: s.daysSince }
        });
        continue;
      }
      // REORDER
      for (const [pid, pr] of s.prods) {
        if (pr.p.equipment || pr.n < 3 || !pr.cycle) continue;
        const r = pr.since / pr.cycle;
        if (r >= st.reorderFactor && pr.since < st.dormantDays) {
          const overdue = pr.since - pr.cycle;
          add(s, {
            type: 'REORDER', productId: pid, product: pr.p.name,
            score: 52 + (r - st.reorderFactor) * 40 + Math.min(pr.n, 12) * 1.2 + tb,
            potential: pr.avgValue,
            reason: `Average reorder cycle ${pr.cycle} days; last purchase ${pr.since} days ago.`,
            action: r >= 1.5 ? `Call today: reorder overdue by ${overdue} days (usual order ${Math.round(pr.avgQty)} units).` : `Contact customer for reorder (usual order ${Math.round(pr.avgQty)} units).`,
            meta: { ratio: r, overdue, cycle: pr.cycle, since: pr.since }
          });
        }
      }
      // CUSTOMER RISK
      if (s.revPrev6 >= 2500 && s.rev6 < s.revPrev6 * (1 - st.riskDrop)) {
        const drop = 1 - s.rev6 / s.revPrev6;
        add(s, {
          type: 'CUSTOMER RISK',
          score: 48 + drop * 45 + Math.min(10, s.revPrev6 / 5000),
          potential: s.revPrev6 - s.rev6,
          reason: `Revenue down ${pct(drop)} in the last 6 months (${money(s.rev6, true)} vs ${money(s.revPrev6, true)} the 6 months before).`,
          action: 'Account review call: confirm the cause of the decline (competitor, stock, patient demand).',
          meta: { drop }
        });
      }
      // UPSELL
      for (const [pid, pr] of s.prods) {
        const to = pr.p.upsellTo && P.get(String(pr.p.upsellTo));
        if (!to || s.prods.has(String(to.id)) || pr.n12 < 3) continue;
        add(s, {
          type: 'UPSELL', productId: String(to.id), product: to.name,
          score: 50 + pr.n12 * 2.2 + tb,
          potential: pr.v12 * 0.3 + (to.price - pr.p.price) * pr.q12,
          reason: `Ordered ${pr.p.name} ${pr.n12} times in 12 months; ${to.name} is the next tier in the same line.`,
          action: `Present the ${to.name} upgrade with volume pricing.`,
          meta: { from: pr.p.name }
        });
      }
      // CROSS-SELL
      if (s.active) {
        const owned = [...s.prods.keys()].filter(k => !s.prods.get(k).p.equipment);
        const fams = new Set(owned.map(k => s.prods.get(k).p.family || k));
        const cands = [];
        for (const [pid, set] of buyers) {
          if (s.prods.has(pid)) continue;
          const p = P.get(pid);
          if (!p || fams.has(p.family || pid)) continue;
          if (p.requires && !s.owns.has(String(p.requires))) continue;
          let best = 0, from = null;
          for (const a of owned) {
            const bA = buyers.get(a); if (!bA || bA.size < 5) continue;
            let both = 0; for (const x of bA) if (set.has(x)) both++;
            const cp = both / bA.size;
            if (cp > best) { best = cp; from = a; }
          }
          if (best >= st.crossMin && from) cands.push({ pid, p, best, from });
        }
        cands.sort((a, b) => b.best - a.best).slice(0, 2).forEach(k => {
          const fromP = P.get(k.from);
          add(s, {
            type: 'CROSS-SELL', productId: k.pid, product: k.p.name,
            score: 30 + k.best * 60 + tb,
            potential: (annualByProd.get(k.pid) || k.p.price * 6) * (tierScale[c.tier] || 1) * 0.5,
            reason: `Buys ${fromP.name}; ${pct(k.best)} of clinics that buy it also buy ${k.p.name}.`,
            action: `Offer a ${k.p.name} trial with the next ${fromP.name} order.`,
            meta: { affinity: k.best, from: fromP.name }
          });
        });
      }
      // EQUIPMENT
      if (s.injRev12 >= st.equipMin && s.orders12 >= 5) {
        const target = equipProducts.find(e => !s.owns.has(String(e.id)));
        if (target) {
          const growth = s.revPrev6 ? s.rev6 / s.revPrev6 - 1 : 0;
          const r = pctRank(s.rev12);
          const atRisk = s.opps.some(o => o.type === 'CUSTOMER RISK');
          add(s, {
            type: 'EQUIPMENT', productId: String(target.id), product: target.name,
            score: 50 + (s.injRev12 / st.equipMin - 1) * 25 + (growth > 0.05 ? 8 : 0) + Math.min(s.orders12, 12) - (atRisk ? 12 : 0),
            potential: target.price,
            reason: `${money(s.injRev12, true)} in injectables over 12 months (top ${Math.max(1, Math.round((1 - r) * 100) + 1)}% of accounts), ${s.orders12} orders, ${growth >= 0 ? 'growing ' + pct(growth) : 'down ' + pct(-growth)}; no ${target.name} installed.`,
            action: `Book an in-clinic ${target.name} evaluation with the medical director.`,
            meta: { growth, injRev: s.injRev12 }
          });
        }
      }
    }

    // Customer-level summaries
    for (const s of cs.values()) {
      s.opps.sort((a, b) => b.score - a.score);
      s.potential = sum(s.opps, o => o.potential);
      const riskO = s.opps.find(o => o.type === 'CUSTOMER RISK');
      const dorm = s.opps.find(o => o.type === 'DORMANT ACCOUNT');
      s.riskLevel = dorm || (riskO && riskO.score >= 70) ? 'High' : riskO ? 'Medium' : 'Low';
      const prodOpp = s.opps.find(o => o.productId && ['CROSS-SELL', 'UPSELL', 'EQUIPMENT', 'REORDER'].includes(o.type));
      s.nbp = prodOpp ? prodOpp.product : null;
      s.nbpWhy = prodOpp ? TYPES[prodOpp.type].label : '';
      s.nba = s.opps[0] ? s.opps[0].action : (s.active ? 'Keep regular contact; no open signals.' : 'No recent purchases to analyze.');
    }
    opps.sort((a, b) => b.score - a.score || b.potential - a.potential);

    // Product stats
    const activeCount = Math.max(1, activeList.length);
    const prodStats = D.products.map(p => {
      const pk = String(p.id), pa = prodAgg.get(pk) || { rev12: 0, rev6: 0, prev6: 0, qty12: 0, buyers: new Set() };
      const po = opps.filter(o => o.productId === pk);
      return {
        p, id: pk, rev12: pa.rev12, qty12: pa.qty12, customers: pa.buyers.size, penetration: pa.buyers.size / activeCount,
        growth: pa.prev6 ? pa.rev6 / pa.prev6 - 1 : null,
        reorders: po.filter(o => o.type === 'REORDER').length, cross: po.filter(o => o.type === 'CROSS-SELL').length,
        upsell: po.filter(o => o.type === 'UPSELL').length, equipment: po.filter(o => o.type === 'EQUIPMENT').length,
        potential: sum(po, o => o.potential)
      };
    }).sort((a, b) => b.rev12 - a.rev12);

    // Category penetration helpers
    const catOf = s => { const set = new Set(); for (const pr of s.prods.values()) if (pr.v12 > 0 && !pr.p.equipment) set.add(pr.p.category); return set; };
    const categories = [...new Set(D.products.filter(p => !p.equipment).map(p => p.category))];
    const natCat = {};
    for (const cat of categories) natCat[cat] = activeList.filter(s => catOf(s).has(cat)).length / activeCount;

    // Geographic Revenue Engine
    const cityMap = new Map();
    for (const s of cs.values()) {
      const name = s.c.city || 'Sin ciudad';
      let g = cityMap.get(name);
      if (!g) { g = { name, geo: CITY_GEO[name] || null, customers: 0, active: 0, rev12: 0, rev6: 0, revPrev6: 0, potential: 0, opps: 0, reorder: 0, cross: 0, upsell: 0, equip: 0, dormant: 0, risk: 0, riskRevenue: 0, prodRev: new Map(), members: [], reps: new Set() }; cityMap.set(name, g); }
      g.customers++; if (s.active) g.active++;
      g.rev12 += s.rev12; g.rev6 += s.rev6; g.revPrev6 += s.revPrev6; g.members.push(s);
      if (s.c.rep) g.reps.add(s.c.rep);
      for (const pr of s.prods.values()) if (pr.v12 > 0) g.prodRev.set(pr.p.name, (g.prodRev.get(pr.p.name) || 0) + pr.v12);
      for (const o of s.opps) {
        g.opps++; g.potential += o.potential;
        if (o.type === 'REORDER') g.reorder++;
        else if (o.type === 'CROSS-SELL') g.cross++;
        else if (o.type === 'UPSELL') g.upsell++;
        else if (o.type === 'EQUIPMENT') g.equip++;
        else if (o.type === 'DORMANT ACCOUNT') { g.dormant++; g.riskRevenue += o.potential; }
        else if (o.type === 'CUSTOMER RISK') { g.risk++; g.riskRevenue += o.potential; }
      }
    }
    const cityStats = [...cityMap.values()].map(g => {
      const act = g.members.filter(s => s.active);
      g.atRisk = g.members.filter(s => s.riskLevel !== 'Low').length;
      g.growth = g.revPrev6 ? g.rev6 / g.revPrev6 - 1 : null;
      g.topProducts = [...g.prodRev.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3);
      g.catPen = categories.map(cat => ({ cat, city: act.length ? act.filter(s => catOf(s).has(cat)).length / act.length : 0, nat: natCat[cat] }));
      g.prodPen = D.products.filter(p => !p.equipment).map(p => {
        const n = act.filter(s => { const pr = s.prods.get(String(p.id)); return pr && pr.v12 > 0; }).length;
        return { p, city: act.length ? n / act.length : 0, nat: (prodAgg.get(String(p.id))?.buyers.size || 0) / activeCount, n, of: act.length };
      });
      return g;
    }).sort((a, b) => b.potential - a.potential);

    // KPIs
    const k = {
      rev12: sum([...cs.values()], s => s.rev12), rev6: sum([...cs.values()], s => s.rev6), prev6: sum([...cs.values()], s => s.revPrev6),
      potential: sum(opps, o => o.potential), opps: opps.length,
      customersWithOpps: [...cs.values()].filter(s => s.opps.length).length,
      activeCustomers: activeList.length, customers: D.customers.length
    };
    k.growth = k.prev6 ? k.rev6 / k.prev6 - 1 : 0;
    for (const t of TYPE_KEYS) { const l = opps.filter(o => o.type === t); k[t] = { n: l.length, pot: sum(l, o => o.potential) }; }
    k.atRisk = [...cs.values()].filter(s => s.opps.some(o => o.type === 'CUSTOMER RISK' || o.type === 'DORMANT ACCOUNT'));
    k.atRiskPot = sum(k.atRisk, s => sum(s.opps.filter(o => o.type === 'CUSTOMER RISK' || o.type === 'DORMANT ACCOUNT'), o => o.potential));

    // Keep Odoo IDs of opportunities already created this session
    const created = S.created || {};
    for (const o of opps) { const key = o.customerId + '|' + o.type + '|' + (o.productId || ''); if (created[key]) o.odooId = created[key]; }

    const months = [];
    for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); { const m = d.toLocaleDateString('es-CL', { month: 'short' }).replace('.', ''); months.push(m.charAt(0).toUpperCase() + m.slice(1)); } }

    Object.assign(S, { cs, opps, prodStats, cityStats, kpi: k, monthly, months, categories, natCat, lastAnalyzed: Date.now() });
    S.insights = GeoEngine.insights();
  }
};
const oppKey = o => o.customerId + '|' + o.type + '|' + (o.productId || '');

const GeoEngine = {
  insights() {
    const C = S.cityStats.filter(c => c.name !== 'Sin ciudad' && c.customers > 0);
    const out = [];
    if (!C.length) return out;
    const top = [...C].sort((a, b) => b.potential - a.potential)[0];
    if (top.potential > 0) out.push({ city: top.name, text: `${top.name} concentra ${money(top.potential, true)} en oportunidades potenciales.` });
    const eq = [...C].sort((a, b) => b.equip - a.equip)[0];
    if (eq.equip > 0) out.push({ city: eq.name, text: `${eq.name} tiene ${eq.equip} ${eq.equip === 1 ? 'cuenta' : 'cuentas'} de alto consumo con potencial para equipos.` });
    const ro = [...C].sort((a, b) => b.reorder - a.reorder)[0];
    if (ro.reorder > 0) out.push({ city: ro.name, text: `${ro.name} presenta ${ro.reorder} ${ro.reorder === 1 ? 'oportunidad' : 'oportunidades'} de recompra.` });
    let best = null;
    for (const c of C) {
      if (c.active < 3) continue;
      for (const cp of c.catPen) {
        const gap = cp.city - cp.nat;
        const rank = ((c.growth || 0) > 0.02 ? 1 : 0) - gap;
        if (cp.nat >= 0.2 && gap <= -0.15 && (!best || rank > best.rank)) best = { c, cp, gap, rank };
      }
    }
    if (best) {
      const g = best.c.growth;
      out.push({ city: best.c.name, text: g != null && g > 0.02
        ? `${best.c.name} muestra crecimiento (+${pct(g)}) pero baja penetración de ${best.cp.cat} (${pct(best.cp.city)} vs ${pct(best.cp.nat)} nacional).`
        : `${best.c.name} tiene baja penetración de ${best.cp.cat} (${pct(best.cp.city)} vs ${pct(best.cp.nat)} nacional).` });
    }
    const rk = [...C].sort((a, b) => b.riskRevenue - a.riskRevenue)[0];
    if (rk.riskRevenue > 0) out.push({ city: rk.name, text: `${rk.name} tiene ${money(rk.riskRevenue, true)} de revenue en riesgo en ${rk.risk + rk.dormant} ${rk.risk + rk.dormant === 1 ? 'cuenta' : 'cuentas'}.` });
    return out;
  }
};

/* =========================================================
   PatternEngine — cross-account patterns from the loaded data
   ========================================================= */
const AGENT_OF = { 'REORDER': 'reorder', 'CROSS-SELL': 'cross', 'UPSELL': 'cross', 'EQUIPMENT': 'equip', 'CUSTOMER RISK': 'risk', 'DORMANT ACCOUNT': 'risk' };
const AGENT_NAME = { hunter: 'Opportunity Hunter', reorder: 'Reorder Agent', cross: 'Cross-Sell Agent', equip: 'Equipment Agent', risk: 'Customer Risk Agent', geo: 'Geographic Agent' };

const PatternEngine = {
  run() {
    const D = S.data, today = D.today, out = [];
    const all = [...S.cs.values()], active = all.filter(s => s.active);
    const N = Math.max(1, active.length);
    const P = new Map(D.products.map(p => [String(p.id), p]));

    // 1. Product affinity (highest lift pair)
    const buyers = new Map();
    for (const s of active) for (const [pid, pr] of s.prods) { if (pr.p.equipment || pr.v12 <= 0) continue; if (!buyers.has(pid)) buyers.set(pid, new Set()); buyers.get(pid).add(String(s.c.id)); }
    let bestPair = null;
    for (const [a, A] of buyers) for (const [b, B] of buyers) {
      if (a === b || A.size < 8) continue;
      const pa = P.get(a), pb = P.get(b);
      if (pa.category === 'Accessories' || pb.category === 'Accessories') continue;
      if ((pa.family && pa.family === pb.family)) continue;
      let both = 0; for (const x of A) if (B.has(x)) both++;
      const cp = both / A.size, lift = cp / (B.size / N);
      if (cp >= 0.5 && lift > 1.05 && (!bestPair || lift * cp > bestPair.lift * bestPair.cp)) bestPair = { pa, pb, cp, lift, gap: A.size - both };
    }
    if (bestPair) out.push({
      id: 'affinity', agent: 'cross', tone: 'up', kpi: pct(bestPair.cp),
      title: `${bestPair.pa.name} lleva a ${bestPair.pb.name}`,
      detail: `${pct(bestPair.cp)} de las clínicas que compran ${bestPair.pa.name} también compran ${bestPair.pb.name} (${bestPair.lift.toFixed(1)}× sobre el promedio). ${bestPair.gap} clínicas aún no lo hacen.`,
      action: { label: 'Ver cross-sell', kind: 'filter', type: 'CROSS-SELL', product: String(bestPair.pb.id) }
    });

    // 2. Cadence slowdown
    const slow = active.filter(s => {
      if (s.dates.length < 6 || !s.cycle) return false;
      const d = s.dates, k = d.length;
      const recent = ((d[k - 1] - d[k - 4]) / 3) / DAY;
      const sinceLast = (today - d[k - 1]) / DAY;
      return Math.max(recent, sinceLast) > s.cycle * 1.35;
    });
    if (slow.length) out.push({
      id: 'cadence', agent: 'risk', tone: 'down', kpi: String(slow.length),
      title: 'Frecuencia de compra desacelerando',
      detail: `${slow.length} ${slow.length === 1 ? 'cuenta espacia' : 'cuentas espacian'} sus pedidos más de un 35% por sobre su ciclo histórico. Representan ${money(sum(slow, s => s.rev12), true)} de revenue 12M.`,
      action: { label: 'Ver cuentas', kind: 'ask', q: '¿Qué cuentas están desacelerando sus compras?' }, members: slow.map(s => String(s.c.id))
    });

    // 3. Revenue concentration
    const byRev = [...active].sort((a, b) => b.rev12 - a.rev12);
    const tot = sum(active, s => s.rev12) || 1;
    const top10 = sum(byRev.slice(0, 10), s => s.rev12) / tot;
    out.push({
      id: 'concentration', agent: 'hunter', tone: top10 > 0.5 ? 'down' : 'neutral', kpi: pct(top10),
      title: 'Concentración de revenue',
      detail: `Las 10 cuentas principales generan ${pct(top10)} del revenue 12M. La principal es ${byRev[0] ? byRev[0].c.name : '—'} (${byRev[0] ? money(byRev[0].rev12, true) : '—'}).`,
      action: { label: 'Ver clientes', kind: 'route', route: 'customers' }
    });

    // 4. City momentum
    const cities = S.cityStats.filter(c => c.revPrev6 > 5000 && c.growth != null);
    if (cities.length) {
      const up = [...cities].sort((a, b) => b.growth - a.growth)[0];
      if (up.growth > 0.03) out.push({ id: 'city-up', agent: 'geo', tone: 'up', kpi: '+' + pct(up.growth), title: `${up.name} acelera`, detail: `${up.name} crece ${pct(up.growth)} en los últimos 6 meses frente a los 6 anteriores, con ${up.opps} oportunidades abiertas por ${money(up.potential, true)}.`, action: { label: 'Analizar ciudad', kind: 'city', city: up.name } });
      const dn = [...cities].sort((a, b) => a.growth - b.growth)[0];
      if (dn.growth < -0.05 && dn !== up) out.push({ id: 'city-down', agent: 'geo', tone: 'down', kpi: '−' + pct(-dn.growth), title: `${dn.name} pierde ritmo`, detail: `${dn.name} cae ${pct(-dn.growth)} en los últimos 6 meses; ${dn.atRisk} ${dn.atRisk === 1 ? 'cuenta' : 'cuentas'} en riesgo y ${money(dn.riskRevenue, true)} expuestos.`, action: { label: 'Analizar ciudad', kind: 'city', city: dn.name } });
    }

    // 5. Category momentum
    const cat = {};
    for (const x of S.prodStats) { if (x.p.equipment) continue; const c = cat[x.p.category] || (cat[x.p.category] = { rev6: 0, prev6: 0 }); const pa = x.growth; c.rev6 += x.rev12 && pa != null ? x.rev12 * (1 + pa) / (2 + pa) : 0; c.prev6 += x.rev12 && pa != null ? x.rev12 / (2 + pa) : 0; }
    const cats = Object.entries(cat).filter(([, v]) => v.prev6 > 3000).map(([k, v]) => ({ k, g: v.rev6 / v.prev6 - 1 })).sort((a, b) => b.g - a.g);
    if (cats.length && cats[0].g > 0.03) out.push({ id: 'cat-up', agent: 'hunter', tone: 'up', kpi: '+' + pct(cats[0].g), title: `${cats[0].k} en alza`, detail: `La categoría ${cats[0].k} crece ${pct(cats[0].g)} semestre contra semestre, la más dinámica del portafolio.`, action: { label: 'Ver productos', kind: 'route', route: 'products' } });

    // 6. Average ticket drift
    const o6 = D.orders.filter(o => today - o.date < 182 * DAY), o12 = D.orders.filter(o => today - o.date >= 182 * DAY && today - o.date < 365 * DAY);
    if (o6.length > 10 && o12.length > 10) {
      const t6 = sum(o6, o => o.total) / o6.length, t12 = sum(o12, o => o.total) / o12.length, g = t6 / t12 - 1;
      if (Math.abs(g) > 0.03) out.push({ id: 'ticket', agent: 'hunter', tone: g > 0 ? 'up' : 'down', kpi: (g > 0 ? '+' : '−') + pct(Math.abs(g)), title: `Ticket promedio ${g > 0 ? 'al alza' : 'a la baja'}`, detail: `El pedido promedio pasó de ${money(t12)} a ${money(t6)} en los últimos 6 meses (${o6.length} pedidos analizados).`, action: { label: 'Preguntar al agente', kind: 'ask', q: '¿Cómo va el revenue?' } });
    }

    // 7. Rep workload on overdue reorders
    const overdue = S.opps.filter(o => o.type === 'REORDER' && o.meta && o.meta.ratio >= 1.3);
    if (overdue.length >= 5) {
      const byRep = {}; for (const o of overdue) byRep[o.rep] = (byRep[o.rep] || 0) + 1;
      const [rep, n] = Object.entries(byRep).sort((a, b) => b[1] - a[1])[0];
      out.push({ id: 'rep', agent: 'reorder', tone: 'down', kpi: String(n), title: `Recompras atrasadas en la cartera de ${rep}`, detail: `${rep} concentra ${n} de ${overdue.length} recompras atrasadas (${pct(n / overdue.length)}), por ${money(sum(overdue.filter(o => o.rep === rep), o => o.potential), true)}.`, action: { label: 'Ver recompras', kind: 'ask', q: `Recompras atrasadas de ${rep}` } });
    }

    // 8. Peak month
    const m = S.monthly, avg = sum(m) / 12;
    if (avg > 0) {
      const i = m.indexOf(Math.max(...m.slice(0, 11)));

const Live = {
  queue: [], idx: 0, audited: 0, feed: [], current: null, timer: null, lastProactive: 0, announced: new Set(), perAgent: {},
  rebuild() {
    const list = [...S.cs.values()].filter(s => s.nOrders);
    this.queue = list.sort((a, b) => (b.opps[0]?.score || 0) - (a.opps[0]?.score || 0));
    this.idx = 0;
  },
  start() { if (!this.timer) this.timer = setInterval(() => this.tick(), 1700); },
  evaluate(s) {
    const o = s.opps[0], c = s.c;
    if (!o) return { agent: 'hunter', level: 'ok', cust: String(c.id), name: c.name, city: c.city, text: `Cuenta sana: ciclo ${s.cycle || '—'} días, última compra hace ${s.daysSince} días.` };
    const m = o.meta || {};
    let text;
    switch (o.type) {
      case 'REORDER': text = `${o.product}: ciclo ${m.cycle} días, última compra hace ${m.since} → recompra ${m.ratio >= 1.3 ? 'atrasada' : 'esperada'}.`; break;
      case 'CROSS-SELL': text = `No compra ${o.product}; ${pct(m.affinity)} de afinidad con ${m.from}.`; break;
      case 'UPSELL': text = `Candidata a ${o.product} (hoy compra ${m.from}).`; break;
      case 'EQUIPMENT': text = `${money(m.injRev, true)} en inyectables 12M → candidata a ${o.product}.`; break;
      case 'CUSTOMER RISK': text = `Compras −${pct(m.drop)} en los últimos 6 meses.`; break;
      default: text = `Sin pedidos hace ${m.days} días.`;
    }
    const more = s.opps.length - 1;
    return { agent: AGENT_OF[o.type], level: ['CUSTOMER RISK', 'DORMANT ACCOUNT'].includes(o.type) ? 'risk' : 'find', cust: String(c.id), name: c.name, city: c.city, text: text + (more > 0 ? ` +${more} ${more === 1 ? 'señal' : 'señales'}.` : ''), score: o.score, opp: o };
  },
  tick() {
    if (!this.queue.length || document.hidden) return;
    const s = this.queue[this.idx % this.queue.length]; this.idx++;
    this.current = s; this.audited++;
    const ev = Object.assign(this.evaluate(s), { t: Date.now() });
    this.feed.unshift(ev); if (this.feed.length > 80) this.feed.length = 80;
    const pa = this.perAgent[ev.agent] || (this.perAgent[ev.agent] = { n: 0, last: null }); pa.n++; pa.last = ev;
    this.paint(ev);
    // Proactive message for high-value findings, at most once a minute
    if (ev.opp && ev.score >= 90 && !this.announced.has(ev.opp.id) && Date.now() - this.lastProactive > 60000 && S.chat.length > 1) {
      this.announced.add(ev.opp.id); this.lastProactive = Date.now();
      Agent.say(`<p><b>Hallazgo en tiempo real.</b> Acabo de auditar <b>${esc(ev.name)}</b> (${esc(ev.city)}): ${esc(ev.text)}</p><p>Score ${ev.score}/100, potencial ${money(ev.opp.potential)}. ${esc(ev.opp.action)}</p><div class="row-flex">${custBtn(ev.cust, 'Abrir Customer 360', 'btn sm')}${createBtn(ev.opp)}</div>`, { notify: true });
    }
  },
  paint(ev) {
    const t = $('#liveTicker'); if (t) t.innerHTML = `<span class="pulse"></span><span class="lt-a">${AGENT_NAME[ev.agent]}</span><span class="lt-n">${esc(ev.name)}</span>`;
    $$('.live-count').forEach(e => e.textContent = this.audited.toLocaleString('es-CL'));
    $$('.live-current').forEach(e => e.textContent = ev.name);
    $$('.live-feed').forEach(ul => {
      ul.insertAdjacentHTML('afterbegin', feedItem(ev, true));
      while (ul.children.length > (+ul.dataset.max || 12)) ul.lastElementChild.remove();
    });
    $$(`.ag-live[data-agent="${ev.agent}"]`).forEach(e => { e.innerHTML = `<b>${esc(ev.name)}</b> · ${esc(ev.text)}`; });
    $$(`.ag-count[data-agent="${ev.agent}"]`).forEach(e => { e.textContent = this.perAgent[ev.agent].n; });
    $$(`.ag-dot[data-agent="${ev.agent}"]`).forEach(e => { e.classList.remove('blink'); void e.offsetWidth; e.classList.add('blink'); });
    const ds = $('#dockStatus'); if (ds) ds.textContent = 'Auditando ' + ev.name;
  }
};
function feedItem(ev, fresh) {
  return `<li class="fi ${ev.level} ${fresh ? 'new' : ''}"><span class="fi-t">${new Date(ev.t).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</span><span class="fi-b"><span class="fi-a">${AGENT_NAME[ev.agent]}</span> ${custBtn(ev.cust, ev.name)} <span class="fi-c">${esc(ev.city)}</span><br><span class="fi-x">${esc(ev.text)}</span></span>${ev.score ? `<span class="fi-s">${ev.score}</span>` : '<span class="fi-s ok">✓</span>'}</li>`;
}

/* ---------- Charts ---------- */
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }
function areaChart(values, labels) {
  const W = 680, H = 230, L = 54, B = 28, T = 16, R = 10;
  const max = niceMax(Math.max(...values, 1));
  const x = i => L + (W - L - R) * (i / (values.length - 1));
  const y = v => T + (H - T - B) * (1 - v / max);
  let g = '';
  for (const f of [0, 0.5, 1]) { const yy = y(max * f); g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text class="al" x="${L - 10}" y="${yy + 4}" text-anchor="end">${money(max * f, true)}</text>`; }
  // smooth path
  const pts = values.map((v, i) => [x(i), y(v)]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; const cx = (x0 + x1) / 2; d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`; }
  const area = d + ` L${x(values.length - 1)},${H - B} L${x(0)},${H - B} Z`;
  const dots = pts.map(([px, py], i) => `<circle cx="${px}" cy="${py}" r="${i === pts.length - 1 ? 5 : 3}" fill="${i === pts.length - 1 ? '#E2BF7C' : '#0D1526'}" stroke="${i === pts.length - 1 ? '#E2BF7C' : '#6CD5C7'}" stroke-width="2"><title>${labels[i]}: ${money(values[i])}</title></circle><text class="al" x="${px}" y="${H - 8}" text-anchor="middle">${labels[i]}</text>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly revenue">${g}<path d="${area}" fill="url(#areaGrad)"/><path d="${d}" fill="none" stroke="#6CD5C7" stroke-width="2.5"/>${dots}</svg></div>`;
}
function donut(rows) {
  const total = sum(rows, r => r.pot) || 1, R = 70, r = 48, C = 85;
  let a0 = -Math.PI / 2, segs = '';
  for (const row of rows) {
    if (!row.pot) continue;
    const a1 = a0 + row.pot / total * Math.PI * 2 - 0.02;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const p = (ang, rad) => `${(C + rad * Math.cos(ang)).toFixed(2)},${(C + rad * Math.sin(ang)).toFixed(2)}`;
    segs += `<path d="M${p(a0, R)} A${R},${R} 0 ${large} 1 ${p(a1, R)} L${p(a1, r)} A${r},${r} 0 ${large} 0 ${p(a0, r)}Z" fill="${TYPE_COLOR[row.t]}"><title>${TYPES[row.t].label}: ${money(row.pot)}</title></path>`;
    a0 = a1 + 0.02;
  }
  return `<svg viewBox="0 0 170 170" role="img" aria-label="Potential by opportunity type">${segs}<text x="85" y="82" text-anchor="middle" style="font-family:var(--display);font-size:22px;fill:#fff">${money(total, true)}</text><text x="85" y="101" text-anchor="middle" style="font-size:10.5px;fill:#95A2BA">potential</text></svg>`;
}
function sparkline(values, color = '#6CD5C7') {
  const W = 300, H = 60, max = Math.max(...values, 1);
  const pts = values.map((v, i) => `${(i / (values.length - 1) * W).toFixed(1)},${(H - 4 - v / max * (H - 10)).toFixed(1)}`);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="0,${H} ${pts.join(' ')} ${W},${H}" fill="url(#areaGrad)" stroke="none"/><polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function chileMap({ w = 380, h = 640, metric = 'potential', selected = null, mini = false } = {}) {
  const lat0 = -17.2, lat1 = -44.6, lon0 = -71.3;
  const k = h / (lat0 - lat1), kx = k * Math.cos(31 * Math.PI / 180), cx = w / 2;
  const X = lon => cx + (lon - lon0) * kx, Y = lat => (lat0 - lat) * k;
  const d = CHILE.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join('') + 'Z';
  const cities = S.cityStats.filter(c => c.geo && c.geo.lat <= lat0 && c.geo.lat >= lat1).sort((a, b) => metricVal(b, metric) - metricVal(a, metric));
  const max = Math.max(1, ...cities.map(c => metricVal(c, metric)));

const Agent = {
  open: false, unread: 0,
  visible() { return this.open || S.route === 'copilot'; },

  },

  },
  think(steps, done, delay = 300) {

    S.chat.push(m); renderChats();
    $$('.orb').forEach(o => o.id === 'dockOrb' && o.classList.add('busy'));
    const tick = () => {
      m.step++;
      if (m.step < steps.length) { renderChats(); setTimeout(tick, delay); }
