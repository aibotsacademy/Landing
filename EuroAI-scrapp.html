<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eurolab Group · Inteligencia de Mercado con IA (MVP simulado)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07111D; --bg2:#0B1929; --surf:rgba(17,35,57,.72); --solid:#102238; --solid2:#0D1C2F;
  --line:rgba(150,190,230,.15); --line2:rgba(150,190,230,.08);
  --ink:#EAF2FA; --ink2:#A7BACD; --mute:#6D8399;
  --cyan:#3FD0C9; --violet:#8F7DFF; --rose:#F07AA0; --gold:#E9B65E; --ok:#4FDE9E; --blue:#5AAEFF;
  --ai:linear-gradient(100deg,#3FD0C9 0%,#6FA8FF 45%,#8F7DFF 100%);
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  box-sizing:border-box;color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 85% -10%,rgba(143,125,255,.16),transparent 60%),radial-gradient(900px 600px at 10% 110%,rgba(63,208,201,.12),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
#neural{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.num{font-family:var(--serif);font-variant-numeric:lining-nums tabular-nums;font-weight:400;letter-spacing:-.01em}
.tab{font-variant-numeric:tabular-nums}
.grad{background:var(--ai);-webkit-background-clip:text;background-clip:text;color:transparent}

/* shell */
.app{position:relative;z-index:1;display:grid;grid-template-columns:258px 1fr;min-height:100%}
.side{background:rgba(9,21,35,.82);backdrop-filter:blur(14px);border-right:1px solid var(--line);padding:22px 14px 18px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 18px;border-bottom:1px solid var(--line2);margin-bottom:10px}
.mark{width:38px;height:38px;border-radius:11px;background:var(--ai);display:grid;place-items:center;flex:none;box-shadow:0 0 24px rgba(111,168,255,.35)}
.mark svg{width:22px;height:22px;stroke:#07111D;fill:none;stroke-width:2}
.brand b{display:block;font-weight:700;font-size:13.5px;letter-spacing:.1em;white-space:nowrap}
.brand span{display:block;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink2)}
.navgrp{margin:10px 0 4px}
.navgrp h6{margin:0;padding:6px 10px;font-size:12px;font-weight:500;color:var(--mute)}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;color:var(--ink2);font-weight:500;position:relative}
.nav:hover{background:rgba(150,190,230,.07);color:var(--ink)}
.nav.on{background:linear-gradient(90deg,rgba(63,208,201,.16),rgba(143,125,255,.08));color:var(--ink)}
.nav.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--ai)}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav .live{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--ok);display:flex;align-items:center;gap:5px}
.nav .live i,.dotlive{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(79,222,158,.6);animation:ping 1.8s infinite;display:inline-block}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(79,222,158,.55)}80%,100%{box-shadow:0 0 0 8px rgba(79,222,158,0)}}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:12px;color:var(--mute);border-top:1px solid var(--line2)}
.side-foot .eng{display:flex;align-items:center;gap:8px;color:var(--ink2);margin-bottom:6px;font-weight:500}
.main{min-width:0;padding:26px 34px 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{margin:0;font-family:var(--serif);font-weight:400;font-size:42px;line-height:1.05;letter-spacing:-.01em}
.top p{margin:8px 0 0;color:var(--ink2);max-width:74ch}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.simtag{display:inline-flex;align-items:center;gap:6px;border:1px dashed rgba(240,122,160,.6);color:var(--rose);background:rgba(240,122,160,.08);padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.simtag i{width:6px;height:6px;border-radius:50%;background:var(--rose)}
.aitag{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(63,208,201,.35);color:var(--cyan);background:rgba(63,208,201,.08);padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}

/* blocks */
.panel{background:var(--surf);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:18px 20px;position:relative}
.panel h3{margin:0 0 4px;font-size:15px;font-weight:600}
.panel .sub{margin:0 0 14px;color:var(--mute);font-size:13px}
.glow{border-color:rgba(111,168,255,.35);box-shadow:0 0 0 1px rgba(143,125,255,.08),0 20px 60px -30px rgba(111,168,255,.45)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
.mt{margin-top:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--mute)}
.small{font-size:12.5px}
.btn{border:1px solid var(--line);background:rgba(150,190,230,.06);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.pri{background:var(--ai);border:0;color:#06101B}
.btn.pri:hover{filter:brightness(1.1);color:#06101B}
.btn.big{padding:14px 26px;font-size:14px;letter-spacing:.05em;box-shadow:0 10px 40px -12px rgba(111,168,255,.7)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.lnk{border:0;background:none;padding:0;color:var(--cyan);font-weight:600;text-decoration:underline;text-underline-offset:3px}
select,input[type=text],input[type=search]{border:1px solid var(--line);background:var(--solid2);border-radius:8px;padding:8px 10px;min-width:0;color:var(--ink)}
select option{background:var(--solid)}
input[type=range]{accent-color:var(--cyan)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink2);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:rgba(150,190,230,.04);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:rgba(63,208,201,.5)}
.chip.on{background:rgba(63,208,201,.16);border-color:var(--cyan);color:var(--ink)}
.chip svg{width:14px;height:14px;stroke:var(--c,currentColor);fill:none;stroke-width:1.8}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-hi{background:rgba(240,122,160,.15);color:var(--rose)}
.p-mid{background:rgba(233,182,94,.14);color:var(--gold)}
.p-lo{background:rgba(150,190,230,.1);color:var(--ink2)}
.p-ok{background:rgba(79,222,158,.14);color:var(--ok)}
.p-pe{background:rgba(63,208,201,.13);color:var(--cyan)}
.score{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:27px;border-radius:7px;font-family:var(--serif);font-size:18px}
.s-hi{background:linear-gradient(135deg,#F07AA0,#C45B9E);color:#fff;box-shadow:0 0 18px -4px rgba(240,122,160,.7)}
.s-mid{background:rgba(63,208,201,.15);color:var(--cyan)}
.s-lo{background:rgba(150,190,230,.1);color:var(--ink2)}
.src{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--c);white-space:nowrap}
.src svg{width:15px;height:15px;stroke:var(--c);fill:none;stroke-width:1.8;flex:none}
.srcs{display:inline-flex;gap:4px}
.srci{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.srci svg{width:13px;height:13px;stroke:var(--c);fill:none;stroke-width:2}
.srci.off{opacity:.2}
.shimmer{background:linear-gradient(90deg,var(--ink2) 0%,#fff 50%,var(--ink2) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 2.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surf);overflow:hidden}
.kpi{padding:16px 16px;border-right:1px solid var(--line2)}
.kpi:last-child{border-right:0}
.kpi .num{font-size:36px;line-height:1.05;display:block}
.kpi small{color:var(--mute);font-size:12.5px}
.kpi.acc .num{color:var(--gold)}

/* hero */
.hero{border:1px solid rgba(111,168,255,.28);border-radius:18px;padding:24px 26px 12px;margin-bottom:16px;position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(18,40,66,.9),rgba(10,22,38,.9))}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(63,208,201,.07),transparent);width:40%;animation:scan 6s ease-in-out infinite;pointer-events:none}
@keyframes scan{0%{transform:translateX(-120%)}100%{transform:translateX(350%)}}
.hero-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start;position:relative;z-index:1}
.hero-head h2{margin:10px 0 0;font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.15;max-width:30ch}
.hero-head .big{text-align:right}
.hero-head .big .num{font-size:68px;line-height:1}
.hero-head .big small{display:block;color:var(--ink2)}
.chile{width:100%;height:auto;display:block;position:relative}
.chile .land{fill:rgba(111,168,255,.07);stroke:rgba(111,168,255,.75);stroke-width:1.2;stroke-linejoin:round}
.chile .sea{fill:rgba(63,208,201,.045)}
.chile .grid-l{stroke:rgba(150,190,230,.06);stroke-width:1}
.chile .bub{fill:var(--rose);fill-opacity:.14;stroke:var(--rose);stroke-width:1.2;cursor:pointer;transition:fill-opacity .2s}
.chile .bub:hover,.chile .bub.sel{fill-opacity:.4}
.chile .halo{fill:none;stroke:var(--rose);stroke-width:1;opacity:0;transform-box:fill-box;transform-origin:center;animation:halo 3s ease-out infinite}
@keyframes halo{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(1.9)}}
.chile .dot{fill:#fff}
.chile .lead{stroke:rgba(167,186,205,.5);stroke-width:.7;stroke-dasharray:2 2}
.chile .lbl{font:600 12px var(--sans);fill:var(--ink)}
.chile .lbl2{font:400 11px var(--sans);fill:var(--mute)}
.chile .lblsel{fill:var(--rose)}
.chile .ocean{font:italic 15px var(--serif);fill:var(--cyan);opacity:.7}
.chile .pdot{fill:var(--cyan);opacity:.55}
.chile .blip{fill:var(--cyan);transform-box:fill-box;transform-origin:center;animation:blip 1.6s ease-out forwards}
@keyframes blip{0%{opacity:1;transform:scale(3)}100%{opacity:.8;transform:scale(1)}}
.sweep{stroke:url(#sw);stroke-width:2;opacity:.9}
.scroll-x{overflow-x:auto}

/* bars */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:130px 1fr 66px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:8px;background:rgba(150,190,230,.1);border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--ai);border-radius:5px;transform-origin:left;animation:grow 1s cubic-bezier(.2,.7,.2,1) both}
.bar.rose .t i{background:linear-gradient(90deg,#C45B9E,#F07AA0)}
.bar.amb .t i{background:linear-gradient(90deg,#B98535,#E9B65E)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
@keyframes grow{from{transform:scaleX(0)}}
.funnel{display:flex;flex-direction:column;gap:6px}
.fstep{display:flex;align-items:center;gap:12px}
.fstep .fb{height:34px;border-radius:6px;color:#06101B;display:flex;align-items:center;padding:0 12px;font-weight:700;font-size:13px;white-space:nowrap;min-width:max-content;transform-origin:left;animation:grow 1s cubic-bezier(.2,.7,.2,1) both}
.fstep:nth-child(1) .fb{background:#3FD0C9}
.fstep:nth-child(2) .fb{background:#5ABEE0;animation-delay:.08s}
.fstep:nth-child(3) .fb{background:#6FA8FF;animation-delay:.16s}
.fstep:nth-child(4) .fb{background:#8F7DFF;animation-delay:.24s}
.fstep:nth-child(5) .fb{background:#F07AA0;animation-delay:.32s}
.fstep span{color:var(--ink2);font-size:13px}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surf)}
table{border-collapse:collapse;width:100%;min-width:820px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line2);font-size:13px;vertical-align:middle}
th{font-weight:600;color:var(--ink2);background:var(--solid);position:sticky;top:0;white-space:nowrap}
th.s{cursor:pointer}
th.s:hover{color:var(--cyan)}
td.r,th.r{text-align:right}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:rgba(63,208,201,.05)}
td .nm{font-weight:600}
td .ad{display:block;font-size:12px;color:var(--mute)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:12px}
.preset{display:flex;align-items:center;gap:10px;background:rgba(233,182,94,.1);border:1px solid rgba(233,182,94,.3);color:var(--gold);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px}

/* discovery run */
.srcrun{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.sr{background:var(--solid2);border:1px solid var(--line);border-radius:12px;padding:12px}
.sr .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sr .n{font-family:var(--serif);font-size:30px;line-height:1}
.sr .pb{height:4px;border-radius:3px;background:rgba(150,190,230,.1);overflow:hidden;margin-top:10px}
.sr .pb i{display:block;height:100%;width:0;background:var(--c);box-shadow:0 0 10px var(--c);transition:width .25s linear}
.sr small{color:var(--mute);font-size:11.5px}
.sr.off{opacity:.3}
.term{background:#050C15;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:12.5px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#9FE8E2;height:250px;overflow-y:auto}
.term .c{color:var(--mute)}
.term .v{color:var(--violet)}
.term .g{color:var(--gold)}
.term .cur::after{content:"▋";animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.det{display:flex;flex-direction:column;gap:6px;height:250px;overflow:hidden}
.dcard{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--solid2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;animation:slidein .45s cubic-bezier(.2,.7,.2,1)}
.dcard .nm{font-weight:600;font-size:13px}
.dcard .ad{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes slidein{from{opacity:0;transform:translateY(-10px) scale(.98)}}
.results{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.results div{background:var(--solid);padding:14px 16px}
.results .num{font-size:40px;display:block;line-height:1.05}
.results small{color:var(--mute)}
.results .acc .num{color:var(--gold)}
.phase{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.phase .spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(63,208,201,.25);border-top-color:var(--cyan);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* radar live */
.live-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:16px}
.stream{display:flex;flex-direction:column;gap:8px;height:520px;overflow:hidden;mask-image:linear-gradient(#000 80%,transparent)}
.scard{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--solid2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;animation:slidein .5s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.scard:hover{border-color:rgba(63,208,201,.4)}
.scard .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.scard .ic svg{width:20px;height:20px;stroke:var(--c);fill:none;stroke-width:1.8}
.scard .nm{font-weight:600}
.scard .ev{font-size:12px;color:var(--ink2);margin-top:1px}
.scard .tg{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.scard .tg span{font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(143,125,255,.14);color:#BDB2FF}
.ctr{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ctr div{background:var(--solid2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.ctr .num{display:block;font-size:28px;line-height:1.1}
.ctr small{font-size:11px;color:var(--mute)}
.flow{width:100%;height:auto;display:block}
.flow .node{fill:var(--solid);stroke:var(--line)}
.flow .core{fill:url(#coreg);filter:drop-shadow(0 0 14px rgba(111,168,255,.6))}
.flow text{font:600 11px var(--sans);fill:var(--ink2)}
.flow .path{fill:none;stroke:rgba(150,190,230,.16);stroke-width:1.2}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(3,8,14,.6);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,100%);background:linear-gradient(180deg,#0F2136,#0A1728);border-left:1px solid rgba(111,168,255,.25);z-index:50;transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5);padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
.dh{padding:20px 24px 16px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start}
.dh h2{margin:8px 0 0;font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.05}
.dh .loc{color:var(--ink2);margin-top:4px}
.db{overflow-y:auto;padding:4px 24px 30px;flex:1}
.sec{padding:16px 0;border-bottom:1px solid var(--line2)}
.sec:last-child{border-bottom:0}
.sec h4{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--cyan)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:13px}
.checks span::before{content:"✓";color:var(--ok);font-weight:700;margin-right:6px}
.checks span.no{color:var(--mute)}
.checks span.no::before{content:"–";color:var(--mute)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv div{background:rgba(150,190,230,.05);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.kv b{display:block;font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.15}
.kv small{color:var(--mute);font-size:12px}
.x{margin-left:auto;border:1px solid var(--line);background:rgba(150,190,230,.06);width:36px;height:36px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.ring{flex:none}
.ring .arc{animation:dash 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes dash{from{stroke-dasharray:0 999}}
.why{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink2)}

}

(function seed(){
  const top=P.slice().sort((a,b)=>b.score-a.score);

  let k=0;plan.forEach(([st,n])=>{for(let i=0;i<n;i++){const p=top[k*3+1];k++;if(!p)continue;p.stage=st;if(st==='ASIGNADO'||st==='OPORTUNIDAD')p.rep=repFor(p);}});

}

function chileSVG(opts={}){
  const sel=opts.sel||'';
  const coast=CL.slice(0,28).map(([lo,la])=>proj(la,lo));
  const sea=[[0,coast[0][1]],...coast,[960,coast[27][1]],[960,300],[0,300]].map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
  const land=CL.map(([lo,la])=>proj(la,lo).map(v=>v.toFixed(1)).join(',')).join(' ');
  let gridl='';for(let x=60;x<960;x+=60)gridl+=`<line class="grid-l" x1="${x}" y1="0" x2="${x}" y2="300"/>`;for(let y=40;y<300;y+=60)gridl+=`<line class="grid-l" x1="0" y1="${y}" x2="960" y2="${y}"/>`;

  const cities=CITIES.map((c,i)=>{

  return `<svg class="chile" id="${opts.id||''}" viewBox="0 0 960 300" role="img" aria-label="Chile, norte a la izquierda, con clusters simulados de prospectos por ciudad">

    ${gridl}<polygon class="sea" points="${sea}"/><polygon class="land" points="${land}"/>${dots}${sweep}<g class="blips"></g>${cities}
    <text class="ocean" x="700" y="288">Océano Pacífico</text>
    <text class="lbl2" x="20" y="288">Norte</text><text class="lbl2" x="930" y="288" text-anchor="end">Sur</text></svg>`;
}

V.radar={t:'Radar IA en vivo',s:'La IA escanea fuentes públicas en tiempo real y convierte cada perfil en un prospecto calificado. Simulación del flujo que luego se conectará a APIs autorizadas.',r(){
  const f=S.radar.filter;
  return `<div class="row" style="justify-content:space-between;margin-bottom:14px">
    <div class="chips"><button class="chip ${!f?'on':''}" data-a="rfilter" data-v="">Todas las fuentes</button>${SOURCES.map(s=>`<button class="chip ${f===s?'on':''}" data-a="rfilter" data-v="${s}" style="--c:${SRC[s].c}">${icon(s)}${s}</button>`).join('')}</div>
    <button class="btn" data-a="rtoggle" id="rBtn">${S.radar.on?'Pausar radar':'Reanudar radar'}</button></div>
  <div class="ctr">${SOURCES.map(s=>`<div style="border-color:color-mix(in srgb,${SRC[s].c} 35%,transparent)"><span class="src" style="--c:${SRC[s].c};justify-content:center">${icon(s)}${s}</span><span class="num" id="rc-${norm(s).replace(/ /g,'')}">${S.radar.counts[s]||0}</span><small>perfiles escaneados hoy</small></div>`).join('')}</div>
  <div class="live-grid mt">
    <div class="panel glow"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0"><span class="dotlive"></span>&nbsp; Flujo de detección</h3><span class="small muted" id="rTotal"></span></div><div class="stream" id="stream"></div></div>
    <div class="grid" style="align-content:start">
      <div class="panel"><h3>Cómo procesa la IA cada señal</h3><p class="sub">Fuentes, motor de IA y resultado</p>${flowSVG()}</div>
      <div class="panel" style="padding:12px 14px"><div class="scroll-x">${chileSVG({id:'radarMap'})}</div></div>
    </div>
  </div>`;},after(){const st=$('#stream');S.radar.buf.slice(-8).reverse().forEach(p=>st.insertAdjacentHTML('beforeend',radarCard(p.p,p.s)));updRadarTotal();if(S.radar.on){clearTimeout(S.radar.t);S.radar.t=setTimeout(radarLoop,500);}}};
function flowSVG(){
  const ys=[30,70,110,150,190];const out=[['Calificado',60],['Alto potencial',110],['Descartado',160]];
  const paths=[];let dots='';
  ys.forEach((y,i)=>{const d=`M118 ${y} C170 ${y},170 110,215 110`;paths.push(`<path class="path" d="${d}"/>`);if(!REDUCED)dots+=`<circle r="3" fill="${SRC[SOURCES[i]].c}"><animateMotion dur="${(2+i*.35).toFixed(2)}s" repeatCount="indefinite" path="${d}"/></circle>`;});
  out.forEach(([l,y],i)=>{const d=`M275 110 C320 110,320 ${y},360 ${y}`;paths.push(`<path class="path" d="${d}"/>`);if(!REDUCED)dots+=`<circle r="2.6" fill="${['#3FD0C9','#F07AA0','#6D8399'][i]}"><animateMotion dur="${(1.8+i*.5).toFixed(2)}s" begin="${i*.4}s" repeatCount="indefinite" path="${d}"/></circle>`;});
  return `<svg class="flow" viewBox="0 0 470 220" role="img" aria-label="Diagrama: cinco fuentes alimentan al motor de IA, que clasifica prospectos">
   <defs><radialGradient id="coreg"><stop offset="0" stop-color="#8F7DFF"/><stop offset="1" stop-color="#3FD0C9"/></radialGradient></defs>
   ${paths.join('')}${dots}
   ${SOURCES.map((s,i)=>`<g><rect class="node" x="4" y="${ys[i]-13}" width="114" height="26" rx="8" style="stroke:${SRC[s].c}55"/><g transform="translate(14 ${ys[i]-7})" style="stroke:${SRC[s].c};fill:none;stroke-width:1.8">${`<svg width="14" height="14" viewBox="0 0 24 24"><path d="${SRC[s].d}"/></svg>`}</g><text x="34" y="${ys[i]+4}">${s}</text></g>`).join('')}
   <circle class="core" cx="245" cy="110" r="30"/><text x="245" y="106" text-anchor="middle" style="fill:#06101B;font-weight:700">MOTOR</text><text x="245" y="120" text-anchor="middle" style="fill:#06101B;font-weight:700">IA</text>
   ${out.map(([l,y])=>`<g><rect class="node" x="360" y="${y-13}" width="104" height="26" rx="8"/><text x="412" y="${y+4}" text-anchor="middle">${l}</text></g>`).join('')}
  </svg>`;
}
function radarCard(p,s){
  const tags=[p.spec,p.recommended+' '+p.aff[p.recommended]+'%'];if(p.growth.length)tags.push(GLABEL[p.growth[0].kind]);
  return `<div class="scard" data-a="open" data-v="${p.id}" style="--c:${SRC[s].c}"><div class="ic">${icon(s)}</div>
   <div style="min-width:0"><div class="nm">${esc(p.name)} <span class="muted small" style="font-weight:400">${esc(p.zone)}, ${esc(p.city)}</span></div><div class="ev">${esc(p.evidence[s])}</div><div class="tg">${tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div></div>
   <div style="text-align:right">${scoreTag(p.score)}<div class="small muted" style="margin-top:4px">${isHi(p)?'Alto potencial':isQ(p)?'Calificado':'En observación'}</div></div></div>`;
}
function updRadarTotal(){const e=$('#rTotal');if(e)e.textContent=S.radar.buf.length+' detecciones en esta sesión';}
function radarLoop(){
  clearTimeout(S.radar.t);
  if(S.view!=='radar'||!S.radar.on)return;
  const f=S.radar.filter;
  let p,s,guard=0;
  do{p=S.radar.queue[S.radar.i++%S.radar.queue.length];s=f&&p.foundBy.includes(f)?f:p.foundBy[Math.floor(Math.random()*p.foundBy.length)];guard++;}while(f&&s!==f&&guard<400);
  S.radar.buf.push({p,s});if(S.radar.buf.length>200)S.radar.buf.shift();
  S.radar.counts[s]=(S.radar.counts[s]||0)+1;
  const st=$('#stream');st.insertAdjacentHTML('afterbegin',radarCard(p,s));while(st.children.length>9)st.removeChild(st.lastChild);
  const ce=$('#rc-'+norm(s).replace(/ /g,''));if(ce)ce.textContent=S.radar.counts[s];
  blip($('#radarMap'),p);updRadarTotal();
  S.radar.t=setTimeout(radarLoop,REDUCED?2500:1300+Math.random()*700);
}

function interpret(p){
  const k=new Set(p.growth.map(g=>g.kind));
  const growthy=k.has('equipment')||k.has('expansion')||k.has('opening')||p.growth.length>=2;
  const head=growthy?'SEÑAL DE ALTO CRECIMIENTO':p.socialLevel==='Alta'?'SEÑAL DE DEMANDA ACTIVA':'PERFIL ESTABLE';
  const lines=[];
  if(k.has('equipment')||k.has('expansion'))lines.push('Oportunidad potencial de equipamiento detectada.');
  if(k.has('hiring')||k.has('physician'))lines.push('Equipo médico en crecimiento: más procedimientos, más consumo de producto.');
  if(p.services.includes(SV.INJ))lines.push('La demanda de inyectables ya es visible en su contenido.');
  if(k.has('opening'))lines.push('Nueva sede: una cuenta nueva para abastecer desde el primer día.');
  if(!lines.length)lines.push('Monitorear 30 días antes de contactar.');
  return {head,lines};
}

function prodReason(p,pr){
  const has=s=>p.services.includes(s);const gk=new Set(p.growth.map(g=>g.kind));
  switch(pr){
    case 'Inyectables':return has(SV.INJ)?'Ya promueve tratamientos inyectables'+(p.socialLevel==='Alta'?' con alta actividad social':''):'Sus servicios faciales sugieren demanda de neuromoduladores';
    case 'Rellenos':return has(SV.FIL)?'Ofrece procedimientos de relleno como '+(p.treatments.find(t=>/labial|Rinomodel|ojeras/.test(t))||'restauración de volumen').toLowerCase():'Su base de pacientes estéticos calza con rellenos';
    case 'Bioestimuladores':return has(SV.FR)&&has(SV.INJ)?'Ya promueve rejuvenecimiento facial y tratamientos inyectables':has(SV.FR)?'Su foco en rejuvenecimiento facial calza con estimulación de colágeno':'Interés antiedad visible en su contenido';
    case 'Dispositivos médicos':return p.size==='Grande'?'Centro grande con '+p.physicians+' médicos y salas de procedimiento':'Sus procedimientos clínicos requieren renovación de dispositivos';
    case 'Equipos estéticos':return gk.has('equipment')?'Anunció nueva tecnología o equipamiento':gk.has('expansion')?'Está ampliando sus salas de tratamiento':has(SV.LAS)?'Realiza tratamientos láser y con equipos de energía':'Podría sumar servicios con equipos de energía';
    default:return p.size==='Grande'?'Alto volumen de procedimientos: abastecimiento recurrente':'Abastecimiento recurrente para procedimientos diarios';
  }
}
function reasons(p){
  const r=[];const gk=new Set(p.growth.map(g=>g.kind));
  if(p.comp.specialty>=85)r.push('Fuerte especialización en '+p.spec.toLowerCase());
  if(p.services.includes(SV.INJ))r.push('Promueve tratamientos inyectables');
  if(p.socialLevel==='Alta')r.push('Alta actividad social ('+p.postsMonth+' publicaciones al mes)');
  if(p.physicians>=3)r.push('Varios médicos ('+p.physicians+')');
  if(p.growth.length)r.push('Señales de crecimiento: '+[...gk].map(k=>GLABEL[k].toLowerCase()).join(', '));
  if(p.foundBy.length>=3)r.push('Confirmado en '+p.foundBy.length+' fuentes públicas');
  if(CITY[p.city].tier>=85)r.push('Ubicado en territorio de alto valor');
  if(r.length<3)r.push(p.services.length+' servicios relevantes detectados');
  return r;
}

/* =================== lookalike =================== */
function similarTo(src,pool){
  const vec=o=>PRODUCTS.map(pr=>o.aff[pr]);const a=vec(src),na=Math.hypot(...a);
  const sz={'Pequeña':1,'Mediana':2,'Grande':3};
  return pool.map(p=>{
    const b=vec(p);const cos=a.reduce((s,v,i)=>s+v*b[i],0)/(na*Math.hypot(...b));
    const inter=src.services.filter(s=>p.services.includes(s)).length,uni=new Set([...src.services,...p.services]).size;
    const parts={'Especialidad':p.spec===src.spec?100:30,'Servicios':Math.round(inter/uni*100),'Geografía':p.city===src.city?100:p.region===src.region?75:45,'Tamaño':100-Math.abs(sz[p.size]-sz[src.size])*40,'Actividad social':100-Math.abs(p.activity-src.activity),'Afinidad':Math.round(Math.max(0,(cos-.85)/.15)*100)};
    const s=Math.round(parts['Especialidad']*.25+parts['Servicios']*.2+parts['Geografía']*.1+parts['Tamaño']*.1+parts['Actividad social']*.1+parts['Afinidad']*.25);
    return {p,s,parts};
  }).sort((x,y)=>y.s-x.s);
}
function lookHTML(c){

}

  const LOG=[
   [`<span class="c">$</span> eurolab-ai discover --pais=CL --zona="${where}"`],
   [`<span class="v">[geo]</span> Buscando mercado geográfico: ${d.city?1:d.region?CITIES.filter(c=>c.region===d.region).length:CITIES.length} ciudades`],

   [`<span class="v">[nlp]</span> Detectando especialidades: ${new Set(set.map(p=>p.spec)).size} encontradas`],
   [`<span class="v">[nlp]</span> Detectando tratamientos: ${new Set(set.flatMap(p=>p.treatments)).size} tipos`],
   [`<span class="v">[entity]</span> Fusionando perfiles entre fuentes: ${dups} duplicados unificados`],
   [`<span class="v">[match]</span> Cruzando con portafolio Eurolab: ${PRODUCTS.length} líneas de producto`],
   [`<span class="v">[score]</span> Calculando potencial comercial: <span class="g">${money(sum(set,p=>p.opp))}</span>`],
   [`<span class="v">[rank]</span> Ordenando ${set.length} prospectos por score IA`],
   [`<span class="g">✓ Descubrimiento completo</span>`]
  ];
  const area=$('#runArea');$('#runBtn').disabled=true;
  area.innerHTML=`<div class="panel glow"><div class="phase"><span class="spin"></span><h3 style="margin:0" class="shimmer">IA DESCUBRIENDO PROSPECTOS</h3><span class="small muted" style="margin-left:auto">${esc(label)}</span></div>
   <div class="srcrun">${SOURCES.map(s=>`<div class="sr ${srcs.includes(s)?'':'off'}" style="--c:${SRC[s].c}"><div class="h">${srcTag(s)}</div><span class="n" id="sn-${norm(s).replace(/ /g,'')}">0</span><small> perfiles</small><div class="pb"><i id="sp-${norm(s).replace(/ /g,'')}"></i></div></div>`).join('')}</div>
   <div class="grid g2 mt"><div class="term" id="term"></div><div class="det" id="det"></div></div></div>`;
  area.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'start'});
  const targets={};srcs.forEach(s=>targets[s]=set.filter(p=>p.foundBy.includes(s)).length);
  const order=shuffle(set,mulberry(set.length+3));
  const total=REDUCED?800:6400;const t0=performance.now();let li=0,di=0;
  const term=$('#term'),det=$('#det');
  const frame=t=>{
    if(S.view!=='discovery')return;
    const k=Math.min(1,(t-t0)/total);
    srcs.forEach((s,i)=>{const kk=Math.min(1,k*(1.25-i*.05));const id=norm(s).replace(/ /g,'');const n=$('#sn-'+id),b=$('#sp-'+id);if(n)n.textContent=Math.round(targets[s]*kk);if(b)b.style.width=(kk*100)+'%';});
    while(li<LOG.length&&li/LOG.length<=k){term.querySelectorAll('.cur').forEach(e=>e.classList.remove('cur'));term.insertAdjacentHTML('beforeend',`<div class="cur">${LOG[li][0]}</div>`);term.scrollTop=term.scrollHeight;li++;}
    const want=Math.floor(k*Math.min(order.length,40));
    while(di<want){const p=order[di++];det.insertAdjacentHTML('afterbegin',`<div class="dcard" style="--c:${SRC[p.origin].c}"><span class="srci" style="--c:${SRC[p.origin].c}">${icon(p.origin)}</span><div style="min-width:0"><div class="nm">${esc(p.name)}</div><div class="ad">${esc(p.evidence[p.origin])}</div></div>${scoreTag(p.score)}</div>`);while(det.children.length>7)det.removeChild(det.lastChild);}
    if(k<1)requestAnimationFrame(frame);
    else{S.lastRun={set,label};setTimeout(()=>{if(S.view!=='discovery')return;area.innerHTML=runResultHTML(S.lastRun);countUp(area);$('#runBtn').disabled=false;},REDUCED?0:700);}
  };
  requestAnimationFrame(frame);
}

function miniTable(list,extra){

function answer(q){
  const s=norm(q);const has=(...w)=>w.some(x=>s.includes(x));
  const city=CITIES.find(c=>s.includes(norm(c.name))||(c.name==='Viña del Mar'&&s.includes('vina')));
  let set=P.slice();const scope=[];
  if(city){set=set.filter(p=>p.city===city.name);scope.push('en '+city.name);}
  const src=SOURCES.find(x=>s.includes(norm(x))||(x==='Google Maps'&&s.includes('maps')));
  if(src){set=set.filter(p=>p.foundBy.includes(src));scope.push('detectados en '+src);}
  const TMAP=[[['dermatolog'],t=>/dermatol/i.test(t),'dermatología'],[['plastic','plastica','cirugia'],t=>t==='Cirugía plástica','cirugía plástica'],[['dental','odont'],t=>t==='Odontología estética','odontología estética'],[['laser'],t=>t==='Centro láser','láser'],[['hospital'],t=>t==='Hospital','hospitales'],[['medical center','centro medico','centros medicos'],t=>t==='Centro médico','centros médicos'],[['aesthetic','estetic','rejuven'],t=>['Clínica estética','Medicina estética','Centro de rejuvenecimiento'].includes(t),'estética']];
  for(const [w,fn,l] of TMAP){if(has(...w)&&!(l==='estética'&&has('dental','odont'))){set=set.filter(p=>fn(p.type));scope.push(l);break;}}
  const sc=scope.length?' ('+scope.join(', ')+')':'';
  if(has('untapped','largest','which city','que ciudad','mayor oportunidad','sin explotar')){
    const rows=CITIES.map(c=>cityStats(c.name)).map(x=>Object.assign(x,{white:Math.round(x.opp*(1-x.pen))})).sort((a,b)=>b.white-a.white);
    const t=rows[0],alt=rows.filter(r=>r.c.name!=='Santiago')[0];
    return `<p><b>${t.c.name}</b> tiene la mayor oportunidad sin explotar: ${money(t.white)} después de descontar el ${Math.round(t.pen*100)}% que Eurolab ya atiende. Fuera de la capital lidera <b>${alt.c.name}</b> con ${money(alt.white)} y solo ${Math.round(alt.pen*100)}% de penetración.</p><table class="mini"><thead><tr><th>Ciudad</th><th class="r">Sin explotar</th><th class="r">Penetración</th><th class="r">Alto potencial</th></tr></thead><tbody>${rows.slice(0,6).map(r=>`<tr data-a="city" data-v="${esc(r.c.name)}"><td><b>${r.c.name}</b></td><td class="r">${money(r.white)}</td><td class="r">${Math.round(r.pen*100)}%</td><td class="r">${r.hi}</td></tr>`).join('')}</tbody></table>`;
  }
  if(has('similar','lookalike','best customer','mejores clientes','parecid')){
    const c=CUSTOMERS[0];const res=similarTo(c,set).filter(r=>r.s>=80);
    return `<p>Usando a <b>${c.name}</b>, uno de los mejores clientes, como perfil de referencia: <b>${res.length}</b> negocios similares encontrados${sc}.</p>${miniTable(res.slice(0,8).map(r=>r.p),['Similitud',p=>res.find(r=>r.p===p).s+'%'])}`;
  }
  if(has('this week','contact','semana','contactar','priori')){
    const pr=set.filter(p=>isQ(p)&&p.stage!=='OPORTUNIDAD').map(p=>({p,v:p.score+p.growth.length*4+(p.lastPost<=3?4:0)+p.opp/4000})).sort((a,b)=>b.v-a.v).slice(0,8).map(x=>x.p);
    return `<p>Contacta primero a estos ${pr.length}${sc}. El ranking combina score IA, señales de crecimiento recientes, actividad en redes y valor estimado.</p>${miniTable(pr,['Por qué ahora',p=>p.growth.length?'Señal: '+GLABEL[p.growth[0].kind].toLowerCase():'Publicó hace '+p.lastPost+'d'])}`;
  }
  if(has('equipment','equipo','device','dispositivo')){
    const r=set.slice().sort((a,b)=>b.aff['Equipos estéticos']-a.aff['Equipos estéticos']);const n=set.filter(isEquip).length;
    return `<p><b>${n}</b> candidatos a equipos${sc}. Mayor potencial de equipamiento:</p>${miniTable(r.slice(0,8),['Match equipos',p=>p.aff['Equipos estéticos']+'%'])}`;
  }
  if(has('injectable','inyect','toxin','botox')){
    const r=set.filter(p=>p.services.includes(SV.INJ)).sort((a,b)=>b.aff.Inyectables-a.aff.Inyectables);
    return `<p><b>${r.length}</b> clínicas promueven tratamientos inyectables${sc}.</p>${miniTable(r.slice(0,8),['Match inyectables',p=>p.aff.Inyectables+'%'])}`;
  }
  if(has('growth','crecimiento','growing','expansion','expand')){
    const r=set.filter(p=>p.growth.length>=2).sort((a,b)=>b.growth.length-a.growth.length||b.score-a.score);
    return `<p><b>${r.length}</b> negocios de alto crecimiento${sc} con dos o más señales recientes.</p>${miniTable(r.slice(0,8),['Señales',p=>p.growth.map(g=>GLABEL[g.kind]).join(', ')])}`;
  }
  if(src&&!city&&scope.length===1){
    const r=set.sort((a,b)=>b.score-a.score);
    return `<p><b>${r.length}</b> prospectos tienen presencia en ${src}; ${P.filter(p=>p.origin===src).length} fueron detectados ahí por primera vez. Los de mayor score:</p>${miniTable(r.slice(0,8),['Evidencia',p=>esc(p.evidence[src])])}`;
  }
  if(!scope.length&&!has('clinic','clinica','show','find','busca','muestra','prospect')){
    return `<p>Puedo responder sobre ciudades, especialidades, fuentes (Google Maps, Instagram, Facebook, TikTok), afinidad de producto, señales de crecimiento y prioridad de contacto. Prueba "Busca clínicas estéticas en Santiago" o "¿Qué ciudad tiene la mayor oportunidad sin explotar?"</p>`;
  }
  const r=set.sort((a,b)=>b.score-a.score);
  if(!r.length)return `<p>No hay prospectos que coincidan${sc}. Prueba otra ciudad o especialidad.</p>`;
  return `<p><b>${r.length}</b> prospectos encontrados${sc}. ${r.filter(isHi).length} son de alto potencial, con ${money(sum(r,p=>p.opp))} de valor combinado. Los mejores:</p>${miniTable(r.slice(0,8))}`;
}
let asking=false;
function ask(q){
  q=(q||'').trim();if(!q||asking)return;asking=true;
  S.chat.push({u:q});refresh();
  const chat=$('#chat');const steps=['Interpretando la pregunta','Consultando '+P.length+' prospectos','Cruzando fuentes y scores'];
  chat.insertAdjacentHTML('beforeend',`<div class="msg a" id="thinking"><span class="who"><i></i>Copiloto IA</span><div class="row" style="gap:10px"><span class="dots"><span></span><span></span><span></span></span><span class="small shimmer" id="thk">${steps[0]}</span></div></div>`);chat.scrollTop=chat.scrollHeight;
  let k=0;const iv=setInterval(()=>{const e=$('#thk');if(e&&k<steps.length-1)e.textContent=steps[++k];},450);
  setTimeout(()=>{clearInterval(iv);S.chat.push({a:answer(q)});asking=false;if(S.view!=='copilot')return;refresh();const last=[...document.querySelectorAll('#chat .msg.a')].pop();if(last&&!REDUCED){const p=last.querySelector('p');if(p){const html=p.innerHTML,txt=p.textContent;p.textContent='';let i=0;const tw=setInterval(()=>{i+=3;p.textContent=txt.slice(0,i);if(i>=txt.length){clearInterval(tw);p.innerHTML=html;}},14);}}const inp=$('#askIn');inp&&inp.focus();},REDUCED?100:1400);
}

/* =================== agentes =================== */
function runAgents(){
  const btn=$('#agBtn');btn.disabled=true;let i=0;
  document.querySelectorAll('.agent').forEach(a=>{a.classList.remove('live','done');a.querySelector('.st span').textContent='En espera';});
  const step=()=>{
    if(S.view!=='agents')return;
    if(i>0){const prev=$('#ag'+(i-1));prev.classList.remove('live');prev.classList.add('done');prev.querySelector('.st span').textContent='Completado';}
    document.querySelectorAll('#chain span').forEach(s=>s.classList.toggle('on',+s.dataset.i===i));
    if(i>=AGENTS.length){btn.disabled=false;toast('Los seis agentes terminaron. '+TOT.q+' prospectos calificados.');return;}
    const card=$('#ag'+i),log=$('#log'+i);card.classList.add('live');card.querySelector('.st span').textContent='Ejecutando';log.innerHTML='';
    card.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'nearest'});
    const lines=AGENTS[i].log();let j=0;
    const line=()=>{if(S.view!=='agents')return;if(j<lines.length){log.insertAdjacentHTML('beforeend',`<span>${esc(lines[j++])}</span>`);runAgents._t=setTimeout(line,REDUCED?20:320);}else{i++;runAgents._t=setTimeout(step,REDUCED?20:260);}};
    line();
  };step();
}

/* =================== pipeline =================== */
function setStage(id,st){
  const p=byId(id);if(!p)return;p.stage=st;
  if((st==='ASIGNADO'||st==='OPORTUNIDAD')&&!p.rep)p.rep=repFor(p);
  persist();
  const msg={DESCUBIERTO:'agregado a la lista de prospectos',ANALIZADO:'analizado',CALIFICADO:'calificado',ASIGNADO:'asignado a '+p.rep,OPORTUNIDAD:'oportunidad creada'}[st];
  toast(p.name+': '+msg);
  if($('#drawer').dataset.id===id)openDrawer(id);
  if(['pipeline','qualified','dashboard'].includes(S.view))refresh();
}

/* =================== eventos =================== */
const A={
  go:v=>{closeDrawer();go(v);},
  open:v=>openDrawer(v),close:()=>closeDrawer(),
  city:v=>{S.mapCity=v;closeDrawer();S.view==='map'?refresh():go('map');},
  cityDb:v=>{S.db=Object.assign({},DB0,{city:v});go('database');},
  sort:v=>{if(S.db.sort===v)S.db.dir*=-1;else{S.db.sort=v;S.db.dir=['name','type','city','spec','recommended','origin'].includes(v)?1:-1;}refresh();},
  dbReset:()=>{S.db=Object.assign({},DB0);refresh();},
  clearPreset:()=>{S.db.preset=null;refresh();},
  dtype:v=>{const a=S.disc.types;a.includes(v)?a.splice(a.indexOf(v),1):a.push(v);refresh();},
  dprod:v=>{const a=S.disc.prods;a.includes(v)?a.splice(a.indexOf(v),1):a.push(v);refresh();},
  dsrc:v=>{const a=S.disc.srcs;a.includes(v)?a.splice(a.indexOf(v),1):a.push(v);refresh();},
  dreset:()=>{S.disc={region:'',city:'',types:[],prods:[],srcs:[]};S.lastRun=null;refresh();},
  run:()=>runDiscovery(),
  toDb:()=>{const ids=new Set(S.lastRun.set.map(p=>p.id));S.db=Object.assign({},DB0,{preset:{label:'Resultados del descubrimiento: '+S.lastRun.label,fn:p=>ids.has(p.id)}});go('database');},
  addHi:()=>{const hi=S.lastRun.set.filter(p=>isHi(p)&&!p.stage);hi.forEach(p=>p.stage='DESCUBIERTO');persist();toast(hi.length?hi.length+' prospectos de alto potencial agregados al pipeline':'Los prospectos de alto potencial de esta búsqueda ya están en el pipeline');},
  lookrun:()=>{if(!S.look){toast('Primero elige un cliente');return;}$('#lookArea').innerHTML=lookHTML(CUSTOMERS.find(c=>c.id===S.look));},
  lookDb:()=>{const c=CUSTOMERS.find(x=>x.id===S.look);const ids=new Set(similarTo(c,P).filter(r=>r.s>=80).map(r=>r.p.id));S.db=Object.assign({},DB0,{preset:{label:'Similares a '+c.name,fn:p=>ids.has(p.id)}});go('database');},
  splat:v=>{S.social.plat=v;refresh();},skind:v=>{S.social.kind=v;refresh();},
  ssel:v=>{S.social.sel=v;$('#socialSel').innerHTML=socialDetail(byId(v));if(innerWidth<1200)$('#socialSel').scrollIntoView({behavior:REDUCED?'auto':'smooth'});},
  prod:v=>{S.prod=v;refresh();},
  gap:v=>{const g=gapInsights()[+v];S.db=Object.assign({},DB0,{preset:{label:g.label,fn:g.fn}});go('database');},
  runAgents:()=>runAgents(),
  rtoggle:()=>{S.radar.on=!S.radar.on;$('#rBtn').textContent=S.radar.on?'Pausar radar':'Reanudar radar';if(S.radar.on)radarLoop();else clearTimeout(S.radar.t);},
  rfilter:v=>{S.radar.filter=v;refresh();},
  ask:()=>ask($('#askIn').value),askq:v=>ask(v),
  stage:v=>{const[id,st]=v.split('|');setStage(id,st);},
  resetPipe:()=>{P.forEach(p=>{p.stage=null;p.rep=null;});persist();refresh();toast('Pipeline reiniciado');}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const fn=A[t.dataset.a];if(fn){e.stopPropagation();fn(t.dataset.v,t,e);}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#drawer').classList.contains('on'))closeDrawer();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('circle[data-a], tr[data-a], .li[data-a], .scard[data-a]')){e.preventDefault();e.target.click();}
});
function onField(e){
  const t=e.target;const f=t.dataset&&t.dataset.f;if(!f)return;
  if(f==='dregion'){S.disc.region=t.value;if(S.disc.city&&CITY[S.disc.city].region!==t.value)S.disc.city='';if(e.type==='change')refresh();return;}
  if(f==='dcity'){S.disc.city=t.value;if(t.value)S.disc.region=CITY[t.value].region;if(e.type==='change')refresh();return;}
  if(f==='look'){S.look=t.value;return;}
  if(f==='rep'){const p=byId(t.dataset.id);p.rep=t.value||null;if(p.rep&&STAGES.indexOf(p.stage)<3)p.stage='ASIGNADO';persist();toast(p.name+(p.rep?': asignado a '+p.rep:': sin ejecutivo'));openDrawer(p.id);if(['pipeline','qualified'].includes(S.view))refresh();return;}
  if(f in S.db){S.db[f]=f==='min'?+t.value:t.value;if(f==='min')$('#msv').textContent=t.value;if(f==='region'&&S.db.city&&CITY[S.db.city].region!==t.value)S.db.city='';fillDb();}
}
document.addEventListener('input',e=>{if(e.target.matches('input'))onField(e);});
document.addEventListener('change',e=>{if(e.target.matches('select'))onField(e);});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v!==S.view&&V[v])go(v);});

/* =================== fondo de red neuronal =================== */
(function neural(){
  const cv=$('#neural');if(!cv||REDUCED)return;const ctx=cv.getContext('2d');let w,h,dpr,nodes=[];
  const rs=()=>{dpr=Math.min(2,window.devicePixelRatio||1);w=innerWidth;h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);const n=Math.round(Math.min(70,w*h/26000));nodes=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25}));};
  rs();addEventListener('resize',rs);
  const tick=()=>{
    if(!document.hidden){
      ctx.clearRect(0,0,w,h);
      for(const a of nodes){a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>w)a.vx*=-1;if(a.y<0||a.y>h)a.vy*=-1;}
      for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<150){ctx.strokeStyle=`rgba(111,168,255,${(1-d/150)*.22})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}
      for(const a of nodes){ctx.fillStyle='rgba(63,208,201,.55)';ctx.beginPath();ctx.arc(a.x,a.y,1.4,0,6.3);ctx.fill();}
    }
    requestAnimationFrame(tick);
  };tick();
})();

go(location.hash.slice(1)||'dashboard');
</script>
