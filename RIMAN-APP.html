<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RIMAN AI APP — AI Business Operating System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/3.4.1/tailwind.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide-static/0.363.0/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --burgundy:#8D2944;
  --burgundy-dark:#642033;
  --rose:#B84C6B;
  --dusty-rose:#C98B9C;
  --blush:#F7ECEC;
  --cream:#FCF8F5;
  --gold:#CDA25F;
  --gold-light:#E4CB98;
  --ink:#202020;
  --grey:#777777;
  --white:#FFFFFF;
  --line:#EDE2DE;
  --shadow-sm: 0 1px 2px rgba(100,32,51,0.06), 0 1px 1px rgba(100,32,51,0.04);
  --shadow-md: 0 8px 24px rgba(100,32,51,0.08), 0 2px 6px rgba(100,32,51,0.05);
  --shadow-lg: 0 20px 45px rgba(100,32,51,0.14), 0 6px 14px rgba(100,32,51,0.06);
  --sidebar-w: 264px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background: var(--cream);
  color: var(--ink);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4,.font-display{font-family:'Manrope',sans-serif;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--dusty-rose);border-radius:8px;}
:focus-visible{outline:2px solid var(--burgundy);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:linear-gradient(180deg,#ffffff 0%, var(--cream) 100%);
  border-right:1px solid var(--line);
  padding:24px 18px;
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;
  gap:6px;
}
#sidebar-nav{flex:1;overflow-y:auto;}
#main-col{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}
#topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(252,248,245,0.88);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:14px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
#view-container{flex:1;padding:26px 28px 100px;max-width:1360px;width:100%;margin:0 auto;contain:layout;}
#bottomnav{display:none;}

.logo-mark{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,var(--burgundy) 0%, var(--rose) 60%, var(--gold) 130%);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;
  box-shadow:var(--shadow-sm);
  flex-shrink:0;
}

.navlink{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:12px;
  color:var(--grey);font-size:14px;font-weight:600;
  cursor:pointer;transition:all .18s ease;
  position:relative;
}
.navlink svg{width:18px;height:18px;flex-shrink:0;}
.navlink:hover{background:var(--blush);color:var(--burgundy-dark);}
.navlink.active{
  background:linear-gradient(135deg, var(--burgundy) 0%, var(--rose) 100%);
  color:#fff;
  box-shadow:0 6px 16px rgba(141,41,68,0.28);
}
.navlink.active svg{color:#fff;}
.navlink .nl-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:auto;flex-shrink:0;}
.nav-section-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dusty-rose);font-weight:700;margin:14px 6px 4px;}

/* ---------- Cards & primitives ---------- */
.card{
  background:#fff;border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow-sm);
}
.card-hover{transition:transform .2s ease, box-shadow .2s ease;}
.card-hover:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-weight:700;font-size:13.5px;border-radius:12px;padding:10px 18px;
  cursor:pointer;transition:all .16s ease;border:1px solid transparent;
  font-family:'Inter',sans-serif;white-space:nowrap;
}
.btn svg{width:15px;height:15px;}
.btn-primary{
  background:linear-gradient(135deg,var(--burgundy),var(--rose));color:#fff;
  box-shadow:0 8px 18px rgba(141,41,68,0.28);
}
.btn-primary:hover{filter:brightness(1.07);transform:translateY(-1px);}
.btn-gold{
  background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#4a3413;
  box-shadow:0 8px 18px rgba(205,162,95,0.35);
}
.btn-gold:hover{filter:brightness(1.05);transform:translateY(-1px);}
.btn-outline{background:#fff;border:1.5px solid var(--dusty-rose);color:var(--burgundy-dark);}
.btn-outline:hover{background:var(--blush);}
.btn-ghost{background:transparent;color:var(--grey);}
.btn-ghost:hover{background:var(--blush);color:var(--burgundy-dark);}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:10px;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none !important;}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.02em;}
.badge-burgundy{background:var(--blush);color:var(--burgundy-dark);}
.badge-gold{background:#FBF3E3;color:#8a672c;}
.badge-green{background:#E7F5EC;color:#1e7a47;}
.badge-blue{background:#E9F1FB;color:#2158a3;}
.badge-grey{background:#F1EEEC;color:var(--grey);}

.input, select.input, textarea.input{
  width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 13px;
  font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);background:#fff;
  transition:border-color .15s ease;
}
.input:focus{border-color:var(--rose);outline:none;}

.stat-card{padding:18px 20px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);}
.stat-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;}

/* ---------- Signature: Radiance Ring ---------- */
.radiance-ring{position:relative;display:inline-flex;align-items:center;justify-content:center;}
.radiance-ring svg{transform:rotate(-90deg);}
.radiance-ring .ring-bg{stroke:var(--blush);}
.radiance-ring .ring-fg{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1);}
.radiance-ring .ring-center{position:absolute;text-align:center;}

/* ---------- AI insight ribbon ---------- */
.ai-ribbon{
  border-radius:18px;padding:18px 20px;position:relative;overflow:hidden;
  background:linear-gradient(120deg, var(--burgundy) 0%, var(--rose) 55%, var(--burgundy-dark) 100%);
  color:#fff;box-shadow:var(--shadow-md);
}
.ai-ribbon::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(600px 120px at 15% 0%, rgba(205,162,95,0.35), transparent 60%);
  pointer-events:none;
}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--gold-light);position:relative;flex-shrink:0;}
.pulse-dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;background:var(--gold-light);opacity:.55;animation:pulse 1.8s ease-out infinite;}
@keyframes pulse{0%{transform:scale(.6);opacity:.6;}100%{transform:scale(2.1);opacity:0;}}

/* ---------- Charts: fixed-height wrapper prevents Chart.js resize-on-scroll drift ---------- */
.chart-wrap{position:relative;width:100%;height:230px;}
.chart-wrap canvas{position:absolute !important;inset:0;width:100% !important;height:100% !important;}
.chart-wrap.sm{height:190px;}

/* ---------- Kanban ---------- */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px;}
.kanban-col{background:var(--blush);border-radius:16px;padding:12px;min-height:120px;}
.kanban-card{background:#fff;border-radius:13px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow-sm);cursor:pointer;border:1px solid var(--line);transition:transform .15s ease;}
.kanban-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}

/* ---------- Table ---------- */
table.riman-table{width:100%;border-collapse:collapse;font-size:13.5px;}
table.riman-table th{text-align:left;color:var(--grey);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;border-bottom:1.5px solid var(--line);}
table.riman-table td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.riman-table tbody tr{transition:background .15s ease;}
table.riman-table tbody tr:hover{background:var(--blush);cursor:pointer;}

/* ---------- Modal ---------- */
#modal-root{position:fixed;inset:0;z-index:100;display:none;}
#modal-root.open{display:block;}
.modal-backdrop{position:absolute;inset:0;background:rgba(32,20,24,0.45);backdrop-filter:blur(2px);animation:fadeIn .18s ease;}
.modal-panel{
  position:relative;background:#fff;border-radius:22px;max-width:560px;width:92%;
  margin:5vh auto;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);
  animation:slideUp .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- Toast ---------- */
#toast-root{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;
  display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg);animation:toastIn .25s ease;
}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Voice Assistant FAB ---------- */
.voice-fab{
  position:fixed;right:24px;bottom:28px;z-index:60;
  width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--burgundy),var(--rose) 60%,var(--gold) 130%);
  box-shadow:0 10px 26px rgba(141,41,68,0.38);
  display:flex;align-items:center;justify-content:center;color:#fff;
  transition:transform .18s ease;
}
.voice-fab:hover{transform:scale(1.06);}
.voice-fab svg{width:24px;height:24px;}
@media (max-width:900px){.voice-fab{right:16px;bottom:86px;width:52px;height:52px;}.voice-fab svg{width:21px;height:21px;}}
.voice-orb{
  width:96px;height:96px;border-radius:50%;margin:0 auto;
  background:linear-gradient(135deg,var(--burgundy),var(--rose),var(--gold));
  display:flex;align-items:center;justify-content:center;color:#fff;position:relative;
}
.voice-orb.listening::before, .voice-orb.listening::after{
  content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--rose);
  animation:orbPulse 1.6s ease-out infinite;
}
.voice-orb.listening::after{animation-delay:.5s;}
@keyframes orbPulse{0%{transform:scale(1);opacity:.7;}100%{transform:scale(1.9);opacity:0;}}
.voice-bars{display:flex;align-items:center;gap:3px;height:18px;}
.voice-bars span{width:3px;background:#fff;border-radius:2px;animation:bar 1s ease-in-out infinite;}
.voice-bars span:nth-child(1){height:6px;animation-delay:0s;}
.voice-bars span:nth-child(2){height:14px;animation-delay:.15s;}
.voice-bars span:nth-child(3){height:18px;animation-delay:.3s;}
.voice-bars span:nth-child(4){height:10px;animation-delay:.45s;}
.voice-bars span:nth-child(5){height:15px;animation-delay:.6s;}
@keyframes bar{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1);}}

/* ---------- AI agent status dot ---------- */
.agent-status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.agent-status-dot.on{background:#1e7a47;box-shadow:0 0 0 3px rgba(30,122,71,0.18);}
.agent-status-dot.busy{background:var(--gold);box-shadow:0 0 0 3px rgba(205,162,95,0.22);}

/* ---------- Misc ---------- */
.progress-track{height:8px;border-radius:99px;background:var(--blush);overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--burgundy),var(--rose));transition:width 1s cubic-bezier(.4,0,.2,1);}
.progress-fill-gold{background:linear-gradient(90deg,var(--gold),var(--gold-light));}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-family:'Manrope',sans-serif;flex-shrink:0;}
.fade-view{animation:fadeInView .28s ease;}
@keyframes fadeInView{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;border:1.5px solid var(--line);cursor:pointer;transition:all .15s ease;background:#fff;color:var(--grey);}
.chip.active{background:var(--burgundy-dark);border-color:var(--burgundy-dark);color:#fff;}
.chip:hover:not(.active){border-color:var(--dusty-rose);color:var(--burgundy-dark);}
.section-title{font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;letter-spacing:-0.01em;}
.subtle{color:var(--grey);}
hr.line{border:none;border-top:1px solid var(--line);}

/* ---------- Mobile ---------- */
@media (max-width: 900px){
  #sidebar{display:none;}
  #view-container{padding:16px 14px 96px;}
  #topbar{padding:12px 16px;}
  #bottomnav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;
    background:rgba(255,255,255,0.96);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 6px);
    justify-content:space-around;box-shadow:0 -6px 18px rgba(100,32,51,0.06);
  }
  .bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--grey);font-size:10px;font-weight:700;padding:4px 8px;border-radius:12px;cursor:pointer;flex:1;}
  .bn-item svg{width:20px;height:20px;}
  .bn-item.active{color:var(--burgundy);}
  .modal-panel{margin:auto;width:94%;max-height:94vh;}
  .kanban-col{min-width:220px;}
}
</style>
</head>

<script>
/* Defensive helpers: never let a slow/blocked CDN (lucide, Chart.js) crash the app */
function safeIcons(){ try{ if(window.lucide && typeof lucide.createIcons==='function') lucide.createIcons(); }catch(e){} }
function safeChart(canvasEl, config){
  try{
    if(window.Chart && canvasEl){
      config.options = config.options || {};
      config.options.responsive = true;
      config.options.maintainAspectRatio = false;
      config.options.resizeDelay = 150;
      return new Chart(canvasEl, config);
    }
    if(canvasEl){
      const box = canvasEl.parentElement;
      if(box) box.insertAdjacentHTML('beforeend', '<div class="subtle" style="font-size:12px;text-align:center;padding:30px 0;">Chart unavailable offline.</div>');
    }
  }catch(e){}
  return null;
}
</script>

function toast(msg, icon='check-circle'){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = `<i data-lucide="${icon}" style="width:16px;height:16px;color:var(--gold-light);"></i><span>${msg}</span>`;
  root.appendChild(el);
  safeIcons();
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);}, 2600);
}
function openModal(html){
  document.getElementById('modal-panel').innerHTML = html;
  document.getElementById('modal-root').classList.add('open');
  safeIcons();
}
function closeModal(){
  document.getElementById('modal-root').classList.remove('open');
}
document.addEventListener('keydown', e=>{if(e.key==='Escape') closeModal();});

/* ============================================================
   SHARED UI COMPONENTS
   ============================================================ */
function statCard({icon,label,value,sub,color}){
  color = color || 'var(--burgundy)';
  return `
  <div class="stat-card card-hover">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <div class="stat-icon" style="background:${color}1a;">
        <i data-lucide="${icon}" style="width:18px;height:18px;color:${color};"></i>
      </div>
      ${sub?`<span class="badge badge-green">${sub}</span>`:''}
    </div>
    <div style="font-family:'Manrope';font-weight:800;font-size:22px;letter-spacing:-.01em;">${value}</div>
    <div class="subtle" style="font-size:12.5px;margin-top:2px;">${label}</div>
  </div>`;
}
function ring({percent, size=90, stroke=9, label='', sublabel=''}){
  const r = (size-stroke)/2, c = 2*Math.PI*r, off = c*(1-percent/100);
  return `
  <div class="radiance-ring" style="width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}">
      <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${stroke}"/>
      <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${stroke}"
        stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    </svg>
    <div class="ring-center">
      <div style="font-family:'Manrope';font-weight:800;font-size:${size*0.19}px;line-height:1;">${label}</div>
      ${sublabel?`<div class="subtle" style="font-size:9.5px;font-weight:700;margin-top:2px;">${sublabel}</div>`:''}
    </div>
  </div>`;
}
function avatarOf(name,color,size=40){
  const initials = name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${color};font-size:${size*0.36}px;">${initials}</div>`;
}
function scoreColor(n){ return n>=80?'#1e7a47': n>=60?'#8a672c':'#8D2944'; }
function aiRibbon(text, cta){
  return `
  <div class="ai-ribbon">
    <div style="display:flex;align-items:flex-start;gap:12px;position:relative;">
      <div style="width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <i data-lucide="sparkles" style="width:17px;height:17px;"></i>
      </div>
      <div style="flex:1;">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
          <span class="pulse-dot"></span>
          <span style="font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85;">AI Insight</span>
        </div>
        <div style="font-size:14px;font-weight:600;line-height:1.45;">${text}</div>
        ${cta?`<button class="btn btn-gold btn-sm" style="margin-top:12px;" onclick="${cta.onclick}">${cta.label}</button>`:''}
      </div>
    </div>
  </div>`;
}

function viewCommissions(){

  const pending = COMM_HISTORY.filter(c=>c.status==='Pending').reduce((s,c)=>s+c.amount,0);
  return `

      ${statCard({icon:'check-circle',label:'Paid',value:fmt.money(paid),color:'#1e7a47'})}

    <div class="card" style="padding:22px;">
      <h3 style="font-family:'Manrope';font-weight:800;font-size:16px;margin:0 0 4px;">Earning potential calculator</h3>
      <p class="subtle" style="font-size:12.5px;margin:0 0 18px;">Adjust the variables to see your estimated monthly income.</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;" class="calc-grid">
        <div style="display:flex;flex-direction:column;gap:16px;">
          ${calcSlider('calc-customers','Number of customers',20,4,100,2)}
          ${calcSlider('calc-avgorder','Average order ($)',65,20,250,5)}
          ${calcSlider('calc-personal','Personal sales ($)',1500,300,8000,100)}
          ${calcSlider('calc-distributors','Active distributors',6,0,40,1)}
          ${calcSlider('calc-teamsales','Team sales ($)',9000,0,60000,500)}
          ${calcSlider('calc-commission','Commission %',15,5,30,1)}
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--blush);border-radius:18px;padding:24px;">
          <div class="subtle" style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;">Estimated monthly income</div>
          <div id="calc-result" style="font-family:'Manrope';font-weight:800;font-size:38px;color:var(--burgundy);">$0</div>
          <div style="display:flex;gap:16px;font-size:12px;" class="subtle">
            <div style="text-align:center;"><div id="calc-retail" style="font-weight:800;color:var(--ink);"></div>Retail</div>
            <div style="text-align:center;"><div id="calc-team" style="font-weight:800;color:var(--ink);"></div>Team</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card" style="overflow-x:auto;">
      <table class="riman-table"><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead><tbody>
        ${COMM_HISTORY.map(c=>`<tr>
          <td class="subtle">${c.date}</td><td style="font-weight:600;">${c.type}</td>
          <td style="font-weight:700;">${fmt.money(c.amount)}</td>
          <td><span class="badge ${c.status==='Paid'?'badge-green':'badge-gold'}">${c.status}</span></td>
        </tr>`).join('')}
      </tbody></table>
    </div>
  </div>`;
}
function calcSlider(id,label,val,min,max,step){
  return `<div>
    <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:6px;">
      <span>${label}</span><span id="${id}-val" style="color:var(--burgundy);">${val}</span>
    </div>
    <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" style="width:100%;accent-color:#8D2944;" oninput="calcUpdate()">
  </div>`;
}
function calcUpdate(){
  const g = id=>parseFloat(document.getElementById(id).value);
  const customers=g('calc-customers'), avgorder=g('calc-avgorder'), personal=g('calc-personal'),
        distributors=g('calc-distributors'), teamsales=g('calc-teamsales'), commission=g('calc-commission');
  document.getElementById('calc-customers-val').textContent = customers;
  document.getElementById('calc-avgorder-val').textContent = '$'+avgorder;
  document.getElementById('calc-personal-val').textContent = '$'+fmt.num(personal);
  document.getElementById('calc-distributors-val').textContent = distributors;
  document.getElementById('calc-teamsales-val').textContent = '$'+fmt.num(teamsales);
  document.getElementById('calc-commission-val').textContent = commission+'%';
  const retail = (customers*avgorder*0.12) + (personal*(commission/100));
  const team = teamsales*(commission/100)*0.6 + distributors*35;
  const total = retail+team;
  document.getElementById('calc-result').textContent = '$'+fmt.num(Math.round(total));
  document.getElementById('calc-retail').textContent = '$'+fmt.num(Math.round(retail));
  document.getElementById('calc-team').textContent = '$'+fmt.num(Math.round(team));
}

<script>
/* ============================================================
   VOICE ASSISTANT — uses Web Speech API (SpeechRecognition + SpeechSynthesis)
   Degrades gracefully to text input + no speech if unsupported.
   ============================================================ */
function speak(text){
  try{
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 1.02; u.pitch = 1.03;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}
function openVoiceAssistant(){
  const supportsSTT = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  const supportsTTS = 'speechSynthesis' in window;
  openModal(`
    <div style="padding:26px;text-align:center;">
      <div class="voice-orb" id="voice-orb"><i data-lucide="mic" style="width:34px;height:34px;"></i></div>
      <h3 style="font-family:'Manrope';font-weight:800;margin:16px 0 4px;">AI Voice Assistant</h3>
      <p class="subtle" style="font-size:12.5px;margin:0 0 6px;" id="voice-status">
        ${supportsSTT ? 'Tap the mic and ask a question.' : 'Voice input isn\'t supported in this browser — type your question instead.'}
      </p>
      ${!supportsTTS ? '<p class="subtle" style="font-size:11px;margin:0 0 14px;">Spoken responses aren\'t supported here — you\'ll see the answer as text.</p>':''}
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0;">
        <span class="chip" onclick="askVoice('Who should I contact today?')">Who should I contact today?</span>
        <span class="chip" onclick="askVoice('How are my sales this month?')">How are my sales?</span>
        <span class="chip" onclick="askVoice('Any hot leads?')">Any hot leads?</span>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:14px;">
        <input class="input" id="voice-text-input" placeholder="Type or use the mic...">
        <button class="btn ${supportsSTT?'btn-primary':'btn-ghost'} btn-sm" id="voice-mic-btn" onclick="toggleListening()" ${supportsSTT?'':'disabled'}><i data-lucide="mic"></i></button>
      </div>
      <button class="btn btn-outline" style="width:100%;" onclick="askVoiceFromInput()">Ask</button>
      <div id="voice-answer" style="margin-top:16px;text-align:left;"></div>
      <button class="btn btn-ghost btn-sm" style="margin-top:10px;" onclick="closeModal()">Close</button>
    </div>`);
}
function askVoiceFromInput(){
  const val = document.getElementById('voice-text-input').value.trim();
  if(val) askVoice(val);
}
function toggleListening(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  const orb = document.getElementById('voice-orb');
  const statusEl = document.getElementById('voice-status');
  if(state.voice.listening){
    state.voice.recognition && state.voice.recognition.stop();
    return;
  }
  try{
    const rec = new SR();
    rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onstart = ()=>{ state.voice.listening = true; orb && orb.classList.add('listening'); if(statusEl) statusEl.textContent = 'Listening...'; };
    rec.onerror = ()=>{ state.voice.listening = false; orb && orb.classList.remove('listening'); if(statusEl) statusEl.textContent = 'Didn\'t catch that — try typing instead.'; };
    rec.onend = ()=>{ state.voice.listening = false; orb && orb.classList.remove('listening'); };
    rec.onresult = (e)=>{
      const transcript = e.results[0][0].transcript;
      const input = document.getElementById('voice-text-input');
      if(input) input.value = transcript;
      askVoice(transcript);
    };
    state.voice.recognition = rec;
    rec.start();
  }catch(e){}
}
function askVoice(question){
  const box = document.getElementById('voice-answer');
  const orb = document.getElementById('voice-orb');
  if(!box) return;
  box.innerHTML = `<div class="subtle" style="font-size:12.5px;display:flex;align-items:center;gap:8px;justify-content:center;"><span class="voice-bars"><span></span><span></span><span></span><span></span><span></span></span>Thinking...</div>`;
  setTimeout(()=>{
    const answer = VOICE_RESPONSES[Math.floor(Math.random()*VOICE_RESPONSES.length)];
    box.innerHTML = `
      <div class="card" style="padding:14px;background:var(--blush);border:none;">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;"><i data-lucide="sparkles" style="width:14px;height:14px;color:var(--burgundy);"></i><b style="font-size:12px;color:var(--burgundy-dark);">AI Coach</b></div>
        <div style="font-size:13.5px;line-height:1.55;">${answer}</div>
      </div>`;
    safeIcons();
    speak(answer);
  }, 750);
}
</script>
