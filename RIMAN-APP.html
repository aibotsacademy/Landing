<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RIMAN AI APP — AI Business Operating System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/3.4.1/tailwind.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide-static/0.363.0/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --burgundy:#8D2944;
  --burgundy-dark:#642033;
  --rose:#B84C6B;
  --dusty-rose:#C98B9C;
  --blush:#F7ECEC;
  --cream:#FCF8F5;
  --gold:#CDA25F;
  --gold-light:#E4CB98;
  --ink:#202020;
  --grey:#777777;
  --white:#FFFFFF;
  --line:#EDE2DE;
  --shadow-sm: 0 1px 2px rgba(100,32,51,0.06), 0 1px 1px rgba(100,32,51,0.04);
  --shadow-md: 0 8px 24px rgba(100,32,51,0.08), 0 2px 6px rgba(100,32,51,0.05);
  --shadow-lg: 0 20px 45px rgba(100,32,51,0.14), 0 6px 14px rgba(100,32,51,0.06);
  --sidebar-w: 264px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background: var(--cream);
  color: var(--ink);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4,.font-display{font-family:'Manrope',sans-serif;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--dusty-rose);border-radius:8px;}
:focus-visible{outline:2px solid var(--burgundy);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:linear-gradient(180deg,#ffffff 0%, var(--cream) 100%);
  border-right:1px solid var(--line);
  padding:24px 18px;
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;
  gap:6px;
}
#sidebar-nav{flex:1;overflow-y:auto;}
#main-col{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}
#topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(252,248,245,0.88);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:14px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
#view-container{flex:1;padding:26px 28px 100px;max-width:1360px;width:100%;margin:0 auto;contain:layout;}
#bottomnav{display:none;}

.logo-mark{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,var(--burgundy) 0%, var(--rose) 60%, var(--gold) 130%);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;
  box-shadow:var(--shadow-sm);
  flex-shrink:0;
}

.navlink{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:12px;
  color:var(--grey);font-size:14px;font-weight:600;
  cursor:pointer;transition:all .18s ease;
  position:relative;
}
.navlink svg{width:18px;height:18px;flex-shrink:0;}
.navlink:hover{background:var(--blush);color:var(--burgundy-dark);}
.navlink.active{
  background:linear-gradient(135deg, var(--burgundy) 0%, var(--rose) 100%);
  color:#fff;
  box-shadow:0 6px 16px rgba(141,41,68,0.28);
}
.navlink.active svg{color:#fff;}
.navlink .nl-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:auto;flex-shrink:0;}
.nav-section-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dusty-rose);font-weight:700;margin:14px 6px 4px;}

/* ---------- Cards & primitives ---------- */
.card{
  background:#fff;border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow-sm);
}
.card-hover{transition:transform .2s ease, box-shadow .2s ease;}
.card-hover:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-weight:700;font-size:13.5px;border-radius:12px;padding:10px 18px;
  cursor:pointer;transition:all .16s ease;border:1px solid transparent;
  font-family:'Inter',sans-serif;white-space:nowrap;
}
.btn svg{width:15px;height:15px;}
.btn-primary{
  background:linear-gradient(135deg,var(--burgundy),var(--rose));color:#fff;
  box-shadow:0 8px 18px rgba(141,41,68,0.28);
}
.btn-primary:hover{filter:brightness(1.07);transform:translateY(-1px);}
.btn-gold{
  background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#4a3413;
  box-shadow:0 8px 18px rgba(205,162,95,0.35);
}
.btn-gold:hover{filter:brightness(1.05);transform:translateY(-1px);}
.btn-outline{background:#fff;border:1.5px solid var(--dusty-rose);color:var(--burgundy-dark);}
.btn-outline:hover{background:var(--blush);}
.btn-ghost{background:transparent;color:var(--grey);}
.btn-ghost:hover{background:var(--blush);color:var(--burgundy-dark);}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:10px;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none !important;}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.02em;}
.badge-burgundy{background:var(--blush);color:var(--burgundy-dark);}
.badge-gold{background:#FBF3E3;color:#8a672c;}
.badge-green{background:#E7F5EC;color:#1e7a47;}
.badge-blue{background:#E9F1FB;color:#2158a3;}
.badge-grey{background:#F1EEEC;color:var(--grey);}

.input, select.input, textarea.input{
  width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 13px;
  font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);background:#fff;
  transition:border-color .15s ease;
}
.input:focus{border-color:var(--rose);outline:none;}

.stat-card{padding:18px 20px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);}
.stat-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;}

/* ---------- Signature: Radiance Ring ---------- */
.radiance-ring{position:relative;display:inline-flex;align-items:center;justify-content:center;}
.radiance-ring svg{transform:rotate(-90deg);}
.radiance-ring .ring-bg{stroke:var(--blush);}
.radiance-ring .ring-fg{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1);}
.radiance-ring .ring-center{position:absolute;text-align:center;}

/* ---------- AI insight ribbon ---------- */
.ai-ribbon{
  border-radius:18px;padding:18px 20px;position:relative;overflow:hidden;
  background:linear-gradient(120deg, var(--burgundy) 0%, var(--rose) 55%, var(--burgundy-dark) 100%);
  color:#fff;box-shadow:var(--shadow-md);
}
.ai-ribbon::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(600px 120px at 15% 0%, rgba(205,162,95,0.35), transparent 60%);
  pointer-events:none;
}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--gold-light);position:relative;flex-shrink:0;}
.pulse-dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;background:var(--gold-light);opacity:.55;animation:pulse 1.8s ease-out infinite;}
@keyframes pulse{0%{transform:scale(.6);opacity:.6;}100%{transform:scale(2.1);opacity:0;}}

/* ---------- Charts: fixed-height wrapper prevents Chart.js resize-on-scroll drift ---------- */
.chart-wrap{position:relative;width:100%;height:230px;}
.chart-wrap canvas{position:absolute !important;inset:0;width:100% !important;height:100% !important;}
.chart-wrap.sm{height:190px;}

/* ---------- Kanban ---------- */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px;}
.kanban-col{background:var(--blush);border-radius:16px;padding:12px;min-height:120px;}
.kanban-card{background:#fff;border-radius:13px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow-sm);cursor:pointer;border:1px solid var(--line);transition:transform .15s ease;}
.kanban-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}

/* ---------- Table ---------- */
table.riman-table{width:100%;border-collapse:collapse;font-size:13.5px;}
table.riman-table th{text-align:left;color:var(--grey);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;border-bottom:1.5px solid var(--line);}
table.riman-table td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.riman-table tbody tr{transition:background .15s ease;}
table.riman-table tbody tr:hover{background:var(--blush);cursor:pointer;}

/* ---------- Modal ---------- */
#modal-root{position:fixed;inset:0;z-index:100;display:none;}
#modal-root.open{display:block;}
.modal-backdrop{position:absolute;inset:0;background:rgba(32,20,24,0.45);backdrop-filter:blur(2px);animation:fadeIn .18s ease;}
.modal-panel{
  position:relative;background:#fff;border-radius:22px;max-width:560px;width:92%;
  margin:5vh auto;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);
  animation:slideUp .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- Toast ---------- */
#toast-root{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;
  display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg);animation:toastIn .25s ease;
}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Voice Assistant FAB ---------- */
.voice-fab{
  position:fixed;right:24px;bottom:28px;z-index:60;
  width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--burgundy),var(--rose) 60%,var(--gold) 130%);
  box-shadow:0 10px 26px rgba(141,41,68,0.38);
  display:flex;align-items:center;justify-content:center;color:#fff;
  transition:transform .18s ease;
}
.voice-fab:hover{transform:scale(1.06);}
.voice-fab svg{width:24px;height:24px;}
@media (max-width:900px){.voice-fab{right:16px;bottom:86px;width:52px;height:52px;}.voice-fab svg{width:21px;height:21px;}}
.voice-orb{
  width:96px;height:96px;border-radius:50%;margin:0 auto;
  background:linear-gradient(135deg,var(--burgundy),var(--rose),var(--gold));
  display:flex;align-items:center;justify-content:center;color:#fff;position:relative;
}
.voice-orb.listening::before, .voice-orb.listening::after{
  content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--rose);
  animation:orbPulse 1.6s ease-out infinite;
}
.voice-orb.listening::after{animation-delay:.5s;}
@keyframes orbPulse{0%{transform:scale(1);opacity:.7;}100%{transform:scale(1.9);opacity:0;}}
.voice-bars{display:flex;align-items:center;gap:3px;height:18px;}
.voice-bars span{width:3px;background:#fff;border-radius:2px;animation:bar 1s ease-in-out infinite;}
.voice-bars span:nth-child(1){height:6px;animation-delay:0s;}
.voice-bars span:nth-child(2){height:14px;animation-delay:.15s;}
.voice-bars span:nth-child(3){height:18px;animation-delay:.3s;}
.voice-bars span:nth-child(4){height:10px;animation-delay:.45s;}
.voice-bars span:nth-child(5){height:15px;animation-delay:.6s;}
@keyframes bar{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1);}}

/* ---------- AI agent status dot ---------- */
.agent-status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.agent-status-dot.on{background:#1e7a47;box-shadow:0 0 0 3px rgba(30,122,71,0.18);}
.agent-status-dot.busy{background:var(--gold);box-shadow:0 0 0 3px rgba(205,162,95,0.22);}

/* ---------- Misc ---------- */
.progress-track{height:8px;border-radius:99px;background:var(--blush);overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--burgundy),var(--rose));transition:width 1s cubic-bezier(.4,0,.2,1);}
.progress-fill-gold{background:linear-gradient(90deg,var(--gold),var(--gold-light));}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-family:'Manrope',sans-serif;flex-shrink:0;}
.fade-view{animation:fadeInView .28s ease;}
@keyframes fadeInView{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;border:1.5px solid var(--line);cursor:pointer;transition:all .15s ease;background:#fff;color:var(--grey);}
.chip.active{background:var(--burgundy-dark);border-color:var(--burgundy-dark);color:#fff;}
.chip:hover:not(.active){border-color:var(--dusty-rose);color:var(--burgundy-dark);}
.section-title{font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;letter-spacing:-0.01em;}
.subtle{color:var(--grey);}
hr.line{border:none;border-top:1px solid var(--line);}

/* ---------- Per-module AI agent strip ---------- */
.agent-strip{display:flex;gap:8px;flex-wrap:wrap;}
.agent-chip{display:flex;align-items:center;gap:7px;padding:7px 12px 7px 8px;border-radius:999px;background:#fff;border:1px solid var(--line);cursor:pointer;transition:all .15s ease;}
.agent-chip:hover{border-color:var(--dusty-rose);box-shadow:var(--shadow-sm);}
.agent-chip .aci{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.agent-chip .aci svg{width:12px;height:12px;}
.agent-chip .acl{font-size:11.5px;font-weight:700;color:var(--ink);}
.agent-chip .acs{width:6px;height:6px;border-radius:50%;background:#1e7a47;flex-shrink:0;}
.agent-insight-box{transition:opacity .25s ease;}

/* ---------- Funnel ---------- */
.funnel-row{display:flex;align-items:center;gap:12px;}
.funnel-bar-track{flex:1;height:34px;border-radius:9px;background:var(--blush);overflow:hidden;position:relative;}
.funnel-bar-fill{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--burgundy),var(--rose));display:flex;align-items:center;padding-left:12px;color:#fff;font-weight:700;font-size:12px;transition:width 1s cubic-bezier(.4,0,.2,1);white-space:nowrap;}

/* ---------- Heatmap (best contact time) ---------- */
.heatmap-grid{display:grid;grid-template-columns:44px repeat(5,1fr);gap:4px;font-size:10px;}
.heatmap-cell{aspect-ratio:1.6;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;}
.heatmap-label{display:flex;align-items:center;color:var(--grey);font-weight:700;font-size:10px;}

/* ---------- Inbox / chat UI ---------- */
.inbox-layout{display:grid;grid-template-columns:340px 1fr;gap:16px;min-height:520px;}
@media (max-width:900px){.inbox-layout{grid-template-columns:1fr;}}
.thread-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;cursor:pointer;transition:background .15s ease;border:1px solid transparent;}
.thread-row:hover{background:var(--blush);}
.thread-row.active{background:var(--blush);border-color:var(--dusty-rose);}
.channel-dot{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:absolute;transform:translate(14px,14px);border:2px solid #fff;}
.channel-dot svg{width:9px;height:9px;color:#fff;}
.chat-bubble{max-width:78%;padding:10px 13px;border-radius:15px;font-size:13px;line-height:1.45;}
.chat-bubble.in{background:#F1EEEC;color:var(--ink);border-bottom-left-radius:4px;align-self:flex-start;}
.chat-bubble.out{background:linear-gradient(135deg,var(--burgundy),var(--rose));color:#fff;border-bottom-right-radius:4px;align-self:flex-end;}

/* ---------- Customer "Glow Score" — Oura/WHOOP-style premium dashboard ---------- */
.glow-hero{
  border-radius:24px;padding:28px 24px;position:relative;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 140% at 20% 0%, #3a0f1c 0%, #642033 38%, #8D2944 68%, #B84C6B 100%);
  color:#fff;box-shadow:var(--shadow-lg);
}
.glow-hero::before{
  content:"";position:absolute;inset:0;z-index:0;
  background:radial-gradient(340px 220px at 82% 10%, rgba(205,162,95,0.45), transparent 65%);
  pointer-events:none;
}
.glow-orb{position:absolute;border-radius:50%;filter:blur(38px);opacity:.5;pointer-events:none;z-index:0;animation:orbDrift 12s ease-in-out infinite;}
@keyframes orbDrift{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(14px,-10px) scale(1.08);}}
.glow-ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;z-index:1;}
.glow-ring-wrap svg{transform:rotate(-90deg);filter:drop-shadow(0 0 10px rgba(205,162,95,0.55));}
.factor-row{display:flex;align-items:center;gap:10px;}
.factor-bar-track{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,0.16);overflow:hidden;}
.factor-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold-light),var(--gold));transition:width 1s cubic-bezier(.4,0,.2,1);}
.streak-badge{
  display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;
  background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.22);font-weight:700;font-size:12px;
}
.streak-badge .flame-icon{animation:flicker 1.6s ease-in-out infinite;}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0deg);}50%{transform:scale(1.15) rotate(-4deg);}}
.ritual-step{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;border:1px solid var(--line);cursor:pointer;transition:all .15s ease;}
.ritual-step.done{background:var(--blush);border-color:var(--dusty-rose);}
.ritual-check{width:22px;height:22px;border-radius:7px;border:2px solid var(--dusty-rose);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s ease;}
.ritual-step.done .ritual-check{background:var(--burgundy);border-color:var(--burgundy);}
.match-badge{
  position:absolute;top:8px;right:8px;background:linear-gradient(135deg,var(--burgundy),var(--rose));color:#fff;
  font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;display:flex;align-items:center;gap:3px;box-shadow:0 0 0 3px rgba(141,41,68,0.12), var(--shadow-sm);
  animation:matchPulse 2.4s ease-in-out infinite;
}
@keyframes matchPulse{0%,100%{box-shadow:0 0 0 3px rgba(141,41,68,0.12), var(--shadow-sm);}50%{box-shadow:0 0 0 6px rgba(141,41,68,0.04), var(--shadow-sm);}}
.star-row{display:flex;align-items:center;gap:2px;color:var(--gold);}
.star-row svg{width:11px;height:11px;}
.coach-avatar{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--burgundy),var(--rose),var(--gold));
  display:flex;align-items:center;justify-content:center;color:#fff;
}

/* ---------- AI Skin Scan — computer-vision-flavored camera feature ---------- */
.scan-stage{
  position:relative;width:100%;max-width:340px;aspect-ratio:3/4;margin:0 auto;border-radius:22px;overflow:hidden;
  background:#0e0508;box-shadow:0 20px 50px rgba(0,0,0,0.35);
}
.scan-stage video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
.scan-placeholder{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%, #4a1526, #1a070d 75%);
}
.scan-corner{position:absolute;width:26px;height:26px;border-color:var(--gold-light);border-style:solid;opacity:.9;z-index:3;}
.scan-corner.tl{top:14px;left:14px;border-width:3px 0 0 3px;border-top-left-radius:8px;}
.scan-corner.tr{top:14px;right:14px;border-width:3px 3px 0 0;border-top-right-radius:8px;}
.scan-corner.bl{bottom:14px;left:14px;border-width:0 0 3px 3px;border-bottom-left-radius:8px;}
.scan-corner.br{bottom:14px;right:14px;border-width:0 3px 3px 0;border-bottom-right-radius:8px;}
.scan-line{
  position:absolute;left:8%;right:8%;height:2px;z-index:3;
  background:linear-gradient(90deg,transparent,var(--gold-light) 20%,#fff 50%,var(--gold-light) 80%,transparent);
  box-shadow:0 0 12px 2px rgba(228,203,152,0.75);
  animation:scanSweep 2.2s ease-in-out infinite;
}
@keyframes scanSweep{0%{top:12%;}50%{top:88%;}100%{top:12%;}}
.scan-mesh{position:absolute;inset:0;z-index:2;opacity:.35;background-image:
    linear-gradient(rgba(228,203,152,0.5) 1px, transparent 1px),
    linear-gradient(90deg, rgba(228,203,152,0.5) 1px, transparent 1px);
  background-size:24px 24px; mix-blend-mode:screen; pointer-events:none;}
.scan-status{

async function startSkinScan(){
  const stage = document.getElementById('scan-stage');

  const video = document.getElementById('scan-video');
  const controls = document.getElementById('scan-controls');
  controls.innerHTML = `<div class="subtle" style="font-size:12px;">Requesting camera access...</div>`;

  try{

    activeScanStream = stream;
    video.srcObject = stream;
    video.style.display = 'block';

  beginScanOverlay(stage, controls, noCam);
}

  const statusEl = overlay.querySelector('#scan-status-text');

  }, 680);

    clearInterval(stepInterval);
    stopSkinScanCamera();
    showScanResults();
  }, 3500);
}

function animateScanMetrics(){

  });

   insight for whichever view is currently on screen. Mirrors the AI Agents
   live-update behavior so every module feels like it's monitoring in real time. */
let ribbonRotateInterval = null;
function startRibbonRotation(){
  stopRibbonRotation();
  ribbonRotateInterval = setInterval(()=>{
    const el = document.getElementById('ai-ribbon-text');
    const wrap = document.querySelector('.ai-ribbon[data-ribbon-key]');
    if(!el || !wrap) return;
    const key = wrap.getAttribute('data-ribbon-key');
    const pool = RIBBON_POOL[key];
    if(!pool) return;
    ribbonRotateIndex[key] = ((ribbonRotateIndex[key]||0) + 1) % pool.length;
    el.style.opacity = '0';
    setTimeout(()=>{
      el.textContent = pool[ribbonRotateIndex[key]];
      el.style.opacity = '1';
    }, 300);
  }, 10000);
}
function stopRibbonRotation(){
  if(ribbonRotateInterval){ clearInterval(ribbonRotateInterval); ribbonRotateInterval = null; }
}

function calcSlider(id,label,val,min,max,step){
  return `<div>
    <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:6px;">
      <span>${label}</span><span id="${id}-val" style="color:var(--burgundy);">${val}</span>
    </div>
    <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" style="width:100%;accent-color:#8D2944;" oninput="calcUpdate()">
  </div>`;
}
function calcUpdate(){
  const g = id=>parseFloat(document.getElementById(id).value);
  const customers=g('calc-customers'), avgorder=g('calc-avgorder'), personal=g('calc-personal'),
        distributors=g('calc-distributors'), teamsales=g('calc-teamsales'), commission=g('calc-commission');
  document.getElementById('calc-customers-val').textContent = customers;
  document.getElementById('calc-avgorder-val').textContent = '$'+avgorder;
  document.getElementById('calc-personal-val').textContent = '$'+fmt.num(personal);
  document.getElementById('calc-distributors-val').textContent = distributors;
  document.getElementById('calc-teamsales-val').textContent = '$'+fmt.num(teamsales);
  document.getElementById('calc-commission-val').textContent = commission+'%';
  const retail = (customers*avgorder*0.16) + (personal*(commission/100));
  const team = teamsales*(commission/100)*0.55 + distributors*30;
  const total = retail+team;
  document.getElementById('calc-result').textContent = '$'+fmt.num(Math.round(total));
  document.getElementById('calc-retail').textContent = '$'+fmt.num(Math.round(retail));
  document.getElementById('calc-team').textContent = '$'+fmt.num(Math.round(team));
}

function computeGlowScore(){
  const total = state.ritualSteps.length;
  const done = state.ritualSteps.filter(s=>s.done).length;
  const hydration = 72;
  const radiance = 88;
  const consistency = Math.round(55 + (done/total)*45);
  const overall = Math.round((hydration+radiance+consistency)/3);
  return {overall, hydration, radiance, consistency};
}
/* Animates the Glow ring filling in + the score counting up from 0 — the
   Oura/WHOOP-style "reveal" moment on load. */
function animateGlowHero(){
  const g = computeGlowScore();
  const ringEl = document.getElementById('glow-ring-fg');
  const numEl = document.getElementById('glow-score-num');
  if(!ringEl || !numEl) return;
  const r = 62, c = 2*Math.PI*r;
  const off = c*(1-g.overall/100);
  requestAnimationFrame(()=>{
    setTimeout(()=>{ ringEl.style.strokeDashoffset = off; }, 60);
  });
  let cur = 0;
  const step = Math.max(1, Math.round(g.overall/24));
  const iv = setInterval(()=>{
    cur += step;
    if(cur>=g.overall){ cur=g.overall; clearInterval(iv); }
    numEl.textContent = cur;
  }, 35);
}

<script>
/* ============================================================
   VOICE ASSISTANT — uses Web Speech API (SpeechRecognition + SpeechSynthesis)
   Degrades gracefully to text input + no speech if unsupported.
   ============================================================ */
function speak(text){
  try{
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 1.02; u.pitch = 1.03;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}
function openVoiceAssistant(){
  const supportsSTT = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  const supportsTTS = 'speechSynthesis' in window;
  openModal(`
    <div style="padding:26px;text-align:center;">
      <div class="voice-orb" id="voice-orb"><i data-lucide="mic" style="width:34px;height:34px;"></i></div>
      <h3 style="font-family:'Manrope';font-weight:800;margin:16px 0 4px;">AI Voice Assistant</h3>
      <p class="subtle" style="font-size:12.5px;margin:0 0 6px;" id="voice-status">
        ${supportsSTT ? 'Tap the mic and ask a question.' : 'Voice input isn\'t supported in this browser — type your question instead.'}
      </p>
      ${!supportsTTS ? '<p class="subtle" style="font-size:11px;margin:0 0 14px;">Spoken responses aren\'t supported here — you\'ll see the answer as text.</p>':''}
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0;">
        <span class="chip" onclick="askVoice('Who should I contact today?')">Who should I contact today?</span>
        <span class="chip" onclick="askVoice('How are my sales this month?')">How are my sales?</span>
        <span class="chip" onclick="askVoice('Any hot leads?')">Any hot leads?</span>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:14px;">
        <input class="input" id="voice-text-input" placeholder="Type or use the mic...">
        <button class="btn ${supportsSTT?'btn-primary':'btn-ghost'} btn-sm" id="voice-mic-btn" onclick="toggleListening()" ${supportsSTT?'':'disabled'}><i data-lucide="mic"></i></button>
      </div>
      <button class="btn btn-outline" style="width:100%;" onclick="askVoiceFromInput()">Ask</button>
      <div id="voice-answer" style="margin-top:16px;text-align:left;"></div>
      <button class="btn btn-ghost btn-sm" style="margin-top:10px;" onclick="closeModal()">Close</button>
    </div>`);
}
function askVoiceFromInput(){
  const val = document.getElementById('voice-text-input').value.trim();
  if(val) askVoice(val);
}
function toggleListening(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  const orb = document.getElementById('voice-orb');
  const statusEl = document.getElementById('voice-status');
  if(state.voice.listening){
    state.voice.recognition && state.voice.recognition.stop();
    return;
  }
  try{
    const rec = new SR();
    rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onstart = ()=>{ state.voice.listening = true; orb && orb.classList.add('listening'); if(statusEl) statusEl.textContent = 'Listening...'; };
    rec.onerror = ()=>{ state.voice.listening = false; orb && orb.classList.remove('listening'); if(statusEl) statusEl.textContent = 'Didn\'t catch that — try typing instead.'; };
    rec.onend = ()=>{ state.voice.listening = false; orb && orb.classList.remove('listening'); };
    rec.onresult = (e)=>{
      const transcript = e.results[0][0].transcript;
      const input = document.getElementById('voice-text-input');
      if(input) input.value = transcript;
      askVoice(transcript);
    };
    state.voice.recognition = rec;
    rec.start();
  }catch(e){}
}
function askVoice(question){
  const box = document.getElementById('voice-answer');
  const orb = document.getElementById('voice-orb');
  if(!box) return;
  box.innerHTML = `<div class="subtle" style="font-size:12.5px;display:flex;align-items:center;gap:8px;justify-content:center;"><span class="voice-bars"><span></span><span></span><span></span><span></span><span></span></span>Thinking...</div>`;
  setTimeout(()=>{
    const answer = VOICE_RESPONSES[Math.floor(Math.random()*VOICE_RESPONSES.length)];
    box.innerHTML = `
      <div class="card" style="padding:14px;background:var(--blush);border:none;">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;"><i data-lucide="sparkles" style="width:14px;height:14px;color:var(--burgundy);"></i><b style="font-size:12px;color:var(--burgundy-dark);">AI Coach</b></div>
        <div style="font-size:13.5px;line-height:1.55;">${answer}</div>
      </div>`;
    safeIcons();
    speak(answer);
  }, 750);
}
</script>
<script>
/* ============================================================
   INBOX — unified WhatsApp / Instagram / Facebook conversations
   ============================================================ */
state.inboxFilter = 'all';
state.activeConversationId = CONVERSATIONS[0].id;
function viewInbox(){
  return `
  <div class="fade-view" style="display:flex;flex-direction:column;gap:16px;">

}
function setInboxFilter(f){ state.inboxFilter = f; renderInbox(); }
function threadListHtml(){
  const list = state.inboxFilter==='all' ? CONVERSATIONS : CONVERSATIONS.filter(c=>c.channel===state.inboxFilter);
  if(!list.length) return `<div class="subtle" style="font-size:12.5px;text-align:center;padding:30px 0;">No conversations here.</div>`;
  return list.map(c=>{
    const ch = CHANNELS[c.channel];
    const last = c.messages[c.messages.length-1];
    return `
    <div class="thread-row ${state.activeConversationId===c.id?'active':''}" onclick="openConversation('${c.id}')">
      <div style="position:relative;flex-shrink:0;">
        ${avatarOf(c.name,c.avatarColor,42)}
        <span class="channel-dot" style="background:${ch.color};"><i data-lucide="${ch.icon}"></i></span>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;justify-content:space-between;gap:6px;">
          <span style="font-weight:700;font-size:13px;">${c.name}</span>
          <span class="subtle" style="font-size:10.5px;flex-shrink:0;">${c.updated}</span>
        </div>
        <div class="subtle" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;">${last?(last.from==='me'?'You: ':'')+last.text:''}</div>
      </div>
      ${c.unread? `<span class="badge badge-gold" style="flex-shrink:0;">${c.unread}</span>`:''}
    </div>`;
  }).join('');
}
function renderInbox(){
  const listEl = document.getElementById('thread-list');
  if(!listEl) return;
  listEl.innerHTML = threadListHtml();
  renderChatPanel();
  safeIcons();
}
function openConversation(id){
  state.activeConversationId = id;
  const convo = CONVERSATIONS.find(c=>c.id===id);
  if(convo) convo.unread = 0;
  renderInbox();
}
function renderChatPanel(){
  const panel = document.getElementById('chat-panel');
  if(!panel) return;
  const c = CONVERSATIONS.find(x=>x.id===state.activeConversationId);
  if(!c){ panel.innerHTML = ''; return; }
  const ch = CHANNELS[c.channel];
  panel.innerHTML = `
    <div style="padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;">
      <div style="position:relative;">${avatarOf(c.name,c.avatarColor,38)}<span class="channel-dot" style="background:${ch.color};"><i data-lucide="${ch.icon}"></i></span></div>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:700;font-size:13.5px;">${c.name}</div>
        <div class="subtle" style="font-size:11px;">${ch.name}</div>
      </div>
      <span class="badge badge-burgundy">${c.tag}</span>
    </div>
    <div id="chat-messages" style="flex:1;padding:18px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:360px;min-height:220px;background:var(--cream);">
      ${c.messages.map(m=>`<div class="chat-bubble ${m.from==='me'?'out':'in'}">${m.text}</div>`).join('')}
    </div>
    <div style="padding:12px 16px;border-top:1px solid var(--line);">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;" id="ai-reply-chips"></div>
      <div style="display:flex;gap:8px;">
        <input class="input" id="chat-input" placeholder="Type a reply...">
        <button class="btn btn-primary btn-sm" onclick="sendInboxMessage()"><i data-lucide="send"></i></button>
      </div>
    </div>`;
  renderAiReplyChips();
  const box = document.getElementById('chat-messages');
  if(box) box.scrollTop = box.scrollHeight;
  safeIcons();
}
function renderAiReplyChips(){
  const box = document.getElementById('ai-reply-chips');
  if(!box) return;
  box.innerHTML = `
    <span class="chip" onclick="useAiReply()"><i data-lucide="sparkles" style="width:12px;height:12px;"></i>AI suggested reply</span>
    <span class="chip" onclick="toast('Contact tagged as hot lead','target')">Tag as hot lead</span>
    <span class="chip" onclick="toast('Follow-up reminder scheduled','bell')">Schedule follow-up</span>`;
}
function useAiReply(){
  const suggestion = AI_REPLY_SUGGESTIONS[Math.floor(Math.random()*AI_REPLY_SUGGESTIONS.length)];
  const input = document.getElementById('chat-input');
  if(input) input.value = suggestion;
}
function sendInboxMessage(){
  const input = document.getElementById('chat-input');
  const val = input.value.trim();
  if(!val) return;
  const c = CONVERSATIONS.find(x=>x.id===state.activeConversationId);
  c.messages.push({from:'me', text:val});
  c.updated = 'now';
  input.value = '';
  renderChatPanel();
  renderInbox();
}
